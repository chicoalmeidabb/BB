<style>
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#282828;
  --line:#2a2a2a;--line2:#333;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --accent:#1565C0;--accent2:#1E88E5;--accent-dim:rgba(21,101,192,.15);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,.12);
  --gold:#f1c40f;--gold-dim:rgba(241,196,15,.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,.12);
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;width:100%;background:var(--bg3);color:var(--text);}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
option{background:var(--bg3);}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.header{background:#000;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.header img{height:36px;}
.header h1{font-size:14px;font-weight:700;flex:1;color:var(--text);}
.header .badge{background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.header .xbtn{color:var(--text3);font-size:18px;padding:4px 8px;}

.tabs{display:flex;background:#000;border-top:1px solid var(--line);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;padding:8px 2px 6px;text-align:center;font-size:9.5px;font-weight:500;color:var(--text3);transition:.15s;}
.tab.active{color:var(--accent);}
.tab svg{display:block;margin:0 auto 2px;width:20px;height:20px;}
.tab span{font-size:17px;display:block;margin-bottom:1px;}
.content{flex:1;padding:12px 14px 76px;overflow-y:auto;}.content.att-bg{background:#252530;}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.kpi .val{font-size:28px;font-weight:800;color:var(--accent);}
.kpi .lbl{font-size:10px;color:var(--text3);margin-top:2px;}

.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.player-row:last-child{border:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.player-row .info{flex:1;min-width:0;}
.player-row .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-row .meta{font-size:11px;color:var(--text3);}
.player-row .stat{font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;}

.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-nav button{font-size:22px;padding:6px 10px;color:var(--accent);font-weight:700;}
.week-nav .label{font-size:13px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,36px);gap:1px;font-size:11px;overflow-x:auto;}
.cal-head{text-align:center;font-weight:700;font-size:10px;color:var(--text3);padding:4px 0;cursor:pointer;border-radius:4px;transition:.12s;}
.cal-head.training-day{background:var(--accent);color:#fff;border-radius:4px;}
.cal-head:active{transform:scale(.92);}
.cal-head.weekend{color:var(--gold);}
.cal-head.festivo{color:var(--red);}
.cal-name{font-size:10.5px;font-weight:600;padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:110px;}
.cal-cell{text-align:center;padding:5px 1px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;min-height:30px;display:flex;align-items:center;justify-content:center;}
.cal-cell:active{transform:scale(.9);}
.cal-cell[data-val="1"]{background:var(--green-dim);color:#fff;font-weight:800;}
.cal-cell[data-val="D"]{background:var(--blue-dim);color:var(--blue);}
.cal-cell[data-val="I"]{background:var(--purple-dim);color:var(--purple);}
.cal-cell[data-val="T"]{background:rgba(142,68,173,.15);color:#8e44ad;}
.cal-cell[data-val="t"]{background:rgba(192,57,43,.12);color:#c0392b;}
.cal-cell[data-val="J"]{background:rgba(21,101,192,.2);color:#2196F3;font-weight:800;}
.cal-cell[data-val="B"]{background:rgba(231,76,60,.25);color:#ff3b30;font-weight:800;}
.cal-cell[data-val="E"]{background:rgba(230,126,34,.12);color:#e67e22;}
.cal-cell[data-val="C"]{background:rgba(149,165,166,.12);color:#95a5a6;}
.cal-cell[data-val="O"]{background:rgba(231,76,60,.2);color:var(--red);}
.cal-cell[data-val="P"]{background:var(--accent-dim);color:var(--accent);font-size:14px;}

.code-picker{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--line);padding:10px 12px 14px;z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:none;}
.code-picker.active{display:block;}
.code-picker h4{font-size:10px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.code-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.code-btn{padding:10px 2px;border-radius:6px;font-weight:700;font-size:12px;text-align:center;border:1px solid var(--line);}
.code-btn:active{transform:scale(.92);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{filter:brightness(.85);}
.btn-outline{border:1px solid var(--line2);color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 10px;font-size:12px;}

.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.stat-bar{margin-bottom:8px;}
.stat-bar .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.stat-bar .top .lbl{color:var(--text2);}
.stat-bar .top .val{font-weight:700;}
.stat-bar .track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.stat-bar .fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 16px 24px;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}

.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center;background:#000;}
.login-screen img{height:80px;margin-bottom:16px;}
.login-screen h2{font-size:18px;margin-bottom:4px;}
.login-screen p{color:var(--text3);font-size:12px;margin-bottom:24px;}

.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line);}
.report-row:last-child{border:none;}
.report-row .rlbl{color:var(--text2);}
.report-row .rval{font-weight:700;}

.import-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;cursor:pointer;}

.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:99;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hidden{display:none!important;}

<script>
const LOGO_URL='https://www.baloncestobadajoz.es/archivos/imagenes/logo.png';

const CONFIG_ADMIN_PASSWORD = '144';
// ══════════════════════════════════════════════════════════
// CONFIGURACIÓN — Pega aquí la URL de tu Google Apps Script
// ══════════════════════════════════════════════════════════
const CONFIG_URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbwqc_4H64Z2O7yGfHq56B8aRJRMSADa60a8yj_RmBk__qd42wtOL87ddawEmXQDnsU4hA/exec";
// ══════════════════════════════════════════════════════════

const DB_KEY='cbb_v4_cache';
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||defaultDB();}catch(e){return defaultDB();}}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function defaultDB(){return{teams:[],clubName:'BB Baloncesto Badajoz'};}
let DB=loadDB();
let SYNCING=false;

// ── Google Sheets API ──
async function gsPost(body){
  if(CONFIG_URL_GOOGLE_SHEETS==='AQUÍ_IRÁ_EL_ENLACE'){return{ok:false};}
  try{
    SYNCING=true;showSync(true);
    const r=await fetch(CONFIG_URL_GOOGLE_SHEETS,{method:'POST',redirect:'follow',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});
    const d=await r.json();
    return d;
  }catch(e){
    console.error('gsPost:',e);
    return{ok:false,error:e.message};
  }finally{SYNCING=false;showSync(false);}
}

async function gsGet(params={}){
  if(CONFIG_URL_GOOGLE_SHEETS==='AQUÍ_IRÁ_EL_ENLACE'){return{ok:false};}
  try{
    SYNCING=true;showSync(true);
    const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const url=CONFIG_URL_GOOGLE_SHEETS+(qs?'?'+qs:'');
    const r=await fetch(url,{redirect:'follow'});
    const d=await r.json();
    return d;
  }catch(e){
    console.error('gsGet:',e);
    return{ok:false,error:e.message};
  }finally{SYNCING=false;showSync(false);}
}

let _syncTimeout=null;
function showSync(on){
  let el=document.getElementById('syncBadge');
  if(!el){el=document.createElement('div');el.id='syncBadge';el.style.cssText='position:fixed;top:4px;right:4px;background:var(--accent);color:#fff;font-size:9px;padding:2px 8px;border-radius:10px;z-index:99;display:none;';el.textContent='Sincronizando...';document.body.appendChild(el);}
  if(_syncTimeout){clearTimeout(_syncTimeout);_syncTimeout=null;}
  el.style.display=on?'block':'none';
  // Seguridad: si en 15s no se ha quitado, forzar ocultarlo
  if(on){_syncTimeout=setTimeout(()=>{el.style.display='none';SYNCING=false;},15000);}
}

// ── Sync: cargar todo desde Google Sheets ──
async function syncFromCloud(){
  const res=await gsGet({action:'all'});
  if(!res.ok)return false;
  const d=res.data;
  // Rebuild DB from cloud data
  const teamMap={};
  (d.equipos||[]).forEach(eq=>{
    teamMap[eq.id]={id:eq.id,name:eq.nombre,category:eq.categoria,coachCode:eq.claveEntrenador,directorCode:eq.claveDirector,coachName:eq.coachName||'',players:[],trainingSessions:{},games:[],trainingDays:{},extraGames:[]};
  });
  (d.jugadores||[]).forEach(j=>{
    if(!teamMap[j.equipoId])return;
    teamMap[j.equipoId].players.push({id:j.id,name:j.nombre,dorsal:parseInt(j.dorsal)||0,birthYear:j.anioNacimiento||'',phone:j.telefono||'',email:j.email||'',obs:j.obs||'',photo:j.photoUrl||j.photo||_getLocalPhoto(j.id)||''});
  });
  (d.asistencia||[]).forEach(a=>{
    if(!teamMap[a.equipoId])return;
    const t=teamMap[a.equipoId];
    if(a.jugadorId==='__TEAM_DAY__'){
      if(!t.trainingDays)t.trainingDays={};
      t.trainingDays[normDate(a.fecha)]=(a.incidencia==='TRAIN_DAY');
      return;
    }
    if(!t.trainingSessions[normDate(a.fecha)])t.trainingSessions[normDate(a.fecha)]={};
    t.trainingSessions[normDate(a.fecha)][a.jugadorId]=a.incidencia;
  });
  // Group partidos by id
  const gameMap={};
  (d.partidos||[]).forEach(p=>{
    if(!gameMap[p.id])gameMap[p.id]={id:p.id,date:p.fecha,equipoId:p.equipoId,opponent:p.rival,players:[]};
    gameMap[p.id].players.push({playerId:p.jugadorId,minutes:p.minutos,points:parseInt(p.puntos)||0});
  });
  Object.values(gameMap).forEach(g=>{
    if(teamMap[g.equipoId])teamMap[g.equipoId].games.push(g);
  });
  DB.teams=Object.values(teamMap);
  saveDB(DB);
  // Status updated by init() after render
  return true;
}

// ── Sync wrappers for write operations ──
async function syncCrearEquipo(team){
  await gsPost({action:'crearEquipo',id:team.id,nombre:team.name,categoria:team.category,claveEntrenador:team.coachCode,claveDirector:team.directorCode});
}
async function syncGuardarJugador(equipoId,p){
  await gsPost({action:'guardarJugador',id:p.id,equipoId:equipoId,nombre:p.name,dorsal:p.dorsal,anioNacimiento:p.birthYear,telefono:p.phone,email:p.email});
}
async function syncEliminarJugador(id){
  await gsPost({action:'eliminarJugador',id:id});
}
async function syncAsistencia(fecha,equipoId,jugadorId,nombre,dorsal,incidencia){
  await gsPost({action:'guardarAsistencia',fecha,equipoId,jugadorId,nombre,dorsal,incidencia});
}
async function syncAsistenciaBulk(equipoId,registros){
  await gsPost({action:'guardarAsistenciaBulk',equipoId,registros});
}
async function syncGuardarPartido(equipoId,game){
  const jugadores=game.players.map(p=>{const pl=T()?.players.find(x=>x.id===p.playerId);return{...p,nombre:pl?pl.name:''};});
  await gsPost({action:'guardarPartido',id:game.id,fecha:game.date,equipoId,rival:game.opponent,jugadores});
}
async function syncEliminarPartido(id){
  await gsPost({action:'eliminarPartido',id});
}
async function syncImportarJugadoresBulk(equipoId,jugadores){
  await gsPost({action:'importarJugadoresBulk',jugadores:jugadores.map(j=>({...j,equipoId}))});
}
let S={view:'login',team:null,sub:'home',week:0,selCell:null,selPlayer:null,repLvl:'team'};

const HOLIDAYS=new Set([
'2026-01-01','2026-01-06','2026-02-17',
'2026-04-02','2026-04-03','2026-05-01',
'2026-06-24','2026-08-15','2026-09-08',
'2026-10-12','2026-11-01','2026-11-02',
'2026-12-06','2026-12-08','2026-12-25',
'2027-01-01','2027-01-06',
'2027-03-25','2027-03-26','2027-05-01',
'2027-06-24','2027-08-15','2027-09-08',
'2027-10-12','2027-11-01',
'2027-12-06','2027-12-08','2027-12-25'
]);
const CODES=[{c:'1',l:'Entrenó'},{c:'D',l:'Dobla'},{c:'I',l:'Otro equipo'},{c:'T',l:'Tecnif+Entreno'},{c:'t',l:'Solo tecnif.'},{c:'J',l:'Justificada'},{c:'B',l:'Baja/lesión'},{c:'E',l:'Enfermedad'},{c:'C',l:'Clase'},{c:'O',l:'No avisó'},{c:'P',l:'Partido'},{c:'',l:'Borrar'}];
function _getLocalPhoto(pid){
  try{
    const localDB=JSON.parse(localStorage.getItem('cbb_v4_cache')||'{}');
    if(!localDB.teams)return'';
    for(const t of localDB.teams){
      const p=t.players?.find(x=>x.id===pid);
      if(p&&p.photo)return p.photo;
    }
  }catch(e){}
  return'';
}
function normDate(d){if(!d)return'';const s=String(d);return s.slice(0,10);}
function codeLabel(c){const f=CODES.find(x=>x.c===c);return f?f.l:c;}
function $(s,c=document){return c.querySelector(s);}
function $$(s,c=document){return[...c.querySelectorAll(s)];}
function el(t,cls='',h=''){const e=document.createElement(t);if(cls)e.className=cls;if(h)e.innerHTML=h;return e;}
function toast(m){const t=el('div','toast',m);document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function T(){return DB.teams.find(t=>t.id===S.team);}
function categoryRank(cat){
  cat=(cat||'').toUpperCase();
  var order=['BENJAMIN','PREMINI','MINI','INFANTIL','CADETE','JUNIOR','SENIOR','NACIONAL'];
  var genderOrder={'MASCULINO':0,'MASC':0,'FEMENINO':1,'FEM':1};
  var colorOrder={'NEGRO':0,'BLANCO':1,'AZUL':2};
  var catRank=99,genRank=2,colRank=3;
  order.forEach(function(o,i){if(cat.indexOf(o)>=0)catRank=i;});
  for(var g in genderOrder){if(cat.indexOf(g)>=0){genRank=genderOrder[g];break;}}
  for(var c in colorOrder){if(cat.indexOf(c)>=0){colRank=colorOrder[c];break;}}
  return catRank*100+genRank*10+colRank;
}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function ini(n){return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function ds(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function isH(d){return HOLIDAYS.has(ds(d));}
function isW(d){return d.getDay()===0||d.getDay()===6;}
function getWk(off=0){const n=new Date();const m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7)+off*7);m.setHours(0,0,0,0);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}
const DIAS=['L','M','X','J','V','S','D'],MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function calcAtt(team,pid){
  const bk={};CODES.forEach(c=>{if(c.c)bk[c.c]=0;});
  let wTeam=0;
  // Contar días de entrenamiento marcados por el equipo
  const td=team.trainingDays||{};
  const teamDays=Object.keys(td).filter(k=>td[k]).length;
  Object.entries(team.trainingSessions).forEach(([date,s])=>{
    const v=s[pid];if(v){const cs=String(v||'').split(',').filter(x=>x);let dayW=false;cs.forEach(c=>{if(bk[c]!==undefined)bk[c]++;if(['1','D','T'].includes(c))dayW=true;});if(dayW)wTeam++;}
  });
  const g=team.games.filter(g=>g.players.some(gp=>gp.playerId===pid)).length;
  const pts=team.games.reduce((a,g)=>{const gp=g.players.find(x=>x.playerId===pid);return a+(gp?gp.points:0);},0);
  return{pct:teamDays>0?Math.round(wTeam/teamDays*100):0,wTeam,teamDays,g,pts,bk};
}

// ══════ PDF REPORT ══════
function generateReport(type){
  const team=T();if(!team)return;
  let html='<html><head><meta charset="UTF-8"><style>';
  html+='body{font-family:Arial,sans-serif;font-size:12px;color:#222;padding:20px;max-width:800px;margin:0 auto;}';
  html+='h1{font-size:20px;border-bottom:3px solid #1565C0;padding-bottom:8px;margin-bottom:4px;}';
  html+='h2{font-size:15px;color:#1565C0;margin:16px 0 6px;}';
  html+='table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:11px;}';
  html+='th{background:#1a1a1a;color:#fff;padding:6px 8px;text-align:left;font-size:10px;}';
  html+='td{padding:5px 8px;border-bottom:1px solid #ddd;}';
  html+='tr:nth-child(even){background:#f9f9f9;}';
  html+='.kpi{display:inline-block;background:#f5f5f5;border-radius:8px;padding:10px 16px;margin:4px;text-align:center;min-width:100px;}';
  html+='.kpi .v{font-size:24px;font-weight:800;color:#1565C0;}';
  html+='.kpi .l{font-size:9px;color:#666;margin-top:2px;}';
  html+='.footer{margin-top:20px;padding-top:8px;border-top:1px solid #ddd;font-size:9px;color:#999;text-align:center;}';
  html+='@media print{body{padding:0;}}';
  html+='</style></head><body>';
  html+=`<h1>BB Baloncesto Badajoz — ${team.name}</h1>`;
  html+=`<p style="color:#666;font-size:11px;">Informe generado el ${new Date().toLocaleDateString('es-ES')} · Temporada 2026-2027</p>`;

  const totalDays=Object.keys(team.trainingSessions).length;

  if(type==='team'||type==='individual'){
    html+='<h2>Resumen del equipo</h2>';
    html+=`<div class="kpi"><div class="v">${team.players.length}</div><div class="l">Jugadores</div></div>`;
    html+=`<div class="kpi"><div class="v">${totalDays}</div><div class="l">Días registrados</div></div>`;
    html+=`<div class="kpi"><div class="v">${team.games.length}</div><div class="l">Partidos</div></div>`;
    const avgAtt=team.players.length?Math.round(team.players.reduce((a,p)=>a+calcAtt(team,p.id).pct,0)/team.players.length):0;
    html+=`<div class="kpi"><div class="v">${avgAtt}%</div><div class="l">Asistencia media</div></div>`;
  }

  if(type==='team'||type==='individual'){
    html+='<h2>Asistencia por jugador</h2>';
    html+='<table><tr><th>Dorsal</th><th>Jugador</th><th>% Asist.</th><th>Con equipo</th><th>Partidos</th><th>Puntos</th><th>No avisó</th><th>Lesión</th></tr>';
    team.players.sort((a,b)=>a.dorsal-b.dorsal).forEach(p=>{
      const a=calcAtt(team,p.id);
      html+=`<tr><td><b>${p.dorsal}</b></td><td>${p.name}</td><td><b>${a.pct}%</b></td><td>${a.wTeam}</td><td>${a.g}</td><td>${a.pts}</td><td style="color:${a.bk['O']>0?'#e74c3c':'inherit'}">${a.bk['O']||0}</td><td>${a.bk['B']||0}</td></tr>`;
    });
    html+='</table>';
  }

  if(type==='individual'){
    team.players.sort((a,b)=>a.dorsal-b.dorsal).forEach(p=>{
      const a=calcAtt(team,p.id);
      html+=`<h2>#${p.dorsal} ${p.name}</h2>`;
      html+='<table><tr><th>Concepto</th><th>Total</th></tr>';
      CODES.filter(c=>c.c&&a.bk[c.c]>0).forEach(c=>{
        html+=`<tr><td>${c.l} (${c.c})</td><td>${a.bk[c.c]}</td></tr>`;
      });
      html+=`<tr><td><b>% Asistencia con equipo</b></td><td><b>${a.pct}%</b></td></tr>`;
      html+='</table>';
    });
  }

  if(type==='club'){
    html=html.replace(team.name,'Todos los equipos');
    html+='<h2>Cuadro de mando del club</h2>';
    html+='<table><tr><th>Equipo</th><th>Categoría</th><th>Jugadores</th><th>Días</th><th>Asist. media</th><th>Partidos</th></tr>';
    DB.teams.forEach(t=>{
      const d=Object.keys(t.trainingSessions).length;
      const avg=t.players.length?Math.round(t.players.reduce((a,p)=>a+calcAtt(t,p.id).pct,0)/t.players.length):0;
      html+=`<tr><td><b>${t.name}</b></td><td>${t.category}</td><td>${t.players.length}</td><td>${d}</td><td><b>${avg}%</b></td><td>${t.games.length}</td></tr>`;
    });
    html+='</table>';
    DB.teams.forEach(t=>{
      html+=`<h2>${t.name}</h2>`;
      html+='<table><tr><th>Dorsal</th><th>Jugador</th><th>% Asist.</th><th>Con equipo</th><th>Partidos</th></tr>';
      t.players.sort((a,b)=>a.dorsal-b.dorsal).forEach(p=>{
        const a=calcAtt(t,p.id);
        html+=`<tr><td>${p.dorsal}</td><td>${p.name}</td><td><b>${a.pct}%</b></td><td>${a.wTeam}</td><td>${a.g}</td></tr>`;
      });
      html+='</table>';
    });
  }

  html+=`<div class="footer">BB Baloncesto Badajoz · baloncestobadajoz.es · Informe generado automáticamente</div>`;
  html+='</body></html>';

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){w.onload=()=>{setTimeout(()=>w.print(),300);};}
  else{const a=document.createElement('a');a.href=url;a.download=`Informe_${type}_${team.name.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.html`;a.click();}
  toast('Informe generado');
}

let _lastSync=0;
function rc(){
  const c=$('#cnt');if(!c)return;c.innerHTML='';
  $$('.tab').forEach(t=>{const id=t.textContent.includes('Inicio')?'home':t.textContent.includes('Plantilla')?'players':t.textContent.includes('Asistencia')?'attendance':t.textContent.includes('Partidos')?'games':'reports';t.classList.toggle('active',S.sub===id||(S.sub==='playerDetail'&&id==='players'));});
  const fn={home:rHome,players:rPlayers,playerDetail:rPlayerDetail,attendance:rAttendance,games:rGames,extragames:rExtraGames,reports:rReports,schedule:rSchedule,help:rHelp};
  (fn[S.sub]||rHome)(c);
  // Fondo más claro en asistencia
  const cnt=$('#cnt');
  if(cnt){if(S.sub==='attendance')cnt.classList.add('att-bg');else cnt.classList.remove('att-bg');}
  // Auto-sync cada 30 segundos al cambiar de pestaña
  const now=Date.now();
  if(now-_lastSync>30000&&!SYNCING){
    _lastSync=now;
    syncFromCloud().then(ok=>{if(ok)rc();});
  }
}
// También sincronizar cuando la app vuelve al primer plano
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.view==='main'&&!SYNCING){
    syncFromCloud().then(ok=>{if(ok){_lastSync=Date.now();rc();}}).catch(()=>{});
  }
});

window.handlePhoto=(input,id)=>{
  const file=input.files[0];
  if(!file){toast('No se recibió la foto');return;}
  if(file.size>10000000){toast('Foto demasiado grande, usa galería');return;}
  toast('Procesando foto...');SYNCING=true;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const size=300;canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      const min=Math.min(img.width,img.height);
      const sx=(img.width-min)/2,sy=(img.height-min)/2;
      ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.9);
      const t=T();const p=t.players.find(x=>x.id===id);
      if(p){
        // Preview immediately
        const preview=$('#photoPreview');
        if(preview)preview.innerHTML='<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">';
        // Upload to Drive
        gsPost({action:'subirFoto',id:p.id,nombre:p.name,photo:dataUrl}).then(res=>{
          console.log('Respuesta subirFoto:',res);
          if(res.ok&&res.photoUrl){
            p.photo=res.photoUrl;
            saveDB(DB);
            if(preview)preview.innerHTML='<img src="'+res.photoUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">';
            toast('Foto subida a Drive');SYNCING=false;
          } else {
            p.photo=dataUrl;
            saveDB(DB);
            toast('Error: '+(res.error||'respuesta vacia del servidor'));SYNCING=false;
          }
        }).catch(function(err){
          console.error('Error subirFoto:',err);
          p.photo=dataUrl;
          saveDB(DB);
          toast('Error de red: '+err.message);
          SYNCING=false;
        });
      }
    };
    img.onerror=()=>{toast('Error al cargar la imagen');};
    img.src=e.target.result;
  };
  reader.onerror=()=>{toast('Error al leer el archivo');};
  reader.readAsDataURL(file);
};

function fmtTime(v){
  if(!v)return'';
  const s=String(v).replace(/[^0-9]/g,'');
  if(s.length<=2)return s+':00';
  return s.slice(0,-2)+':'+s.slice(-2);
}
function parseTime(v){
  if(!v)return 0;
  const s=String(v).replace(/[^0-9]/g,'');
  if(s.length<=2)return parseInt(s)||0;
  const min=parseInt(s.slice(0,-2))||0;
  const sec=parseInt(s.slice(-2))||0;
  return min*60+sec;
}

function processExcel(data,bg){
  try{
    const wb=XLSX.read(data,{type:'array'});
    const t=T();
    let playersAdded=0,attendanceAdded=0;
    
    // Try "Contro Asistencia" sheet for players
    if(wb.SheetNames.includes('Contro Asistencia')){
      const ws=wb.Sheets['Contro Asistencia'];
      // Players start at row 9, col B=name, C=dorsal, A=year
      for(let r=9;r<30;r++){
        const nameCell=ws['B'+r],dorsalCell=ws['C'+r],yearCell=ws['A'+r];
        if(!nameCell||!nameCell.v)break;
        const name=String(nameCell.v).trim();
        const dorsal=dorsalCell?parseInt(dorsalCell.v)||0:0;
        const year=yearCell?parseInt(yearCell.v)||'':'';
        if(name&&!t.players.find(p=>p.name.toLowerCase()===name.toLowerCase())){
          t.players.push({id:gid(),name,dorsal,birthYear:year,phone:'',email:''});
          playersAdded++;
        }
      }
    }
    
    // Try "Jugadores" sheet for daily attendance
    if(wb.SheetNames.includes('Jugadores')){
      const ws=wb.Sheets['Jugadores'];
      const monthMap={'Septiembre':[2026,9],'Octubre':[2026,10],'Noviembre':[2026,11],'Diciembre':[2026,12],'Enero':[2027,1],'Febrero':[2027,2],'Marzo':[2027,3],'Abril':[2027,4],'Mayo':[2027,5],'Junio':[2027,6]};
      const mFull=Object.keys(monthMap);
      
      // Find player blocks
      for(let r=1;r<578;r++){
        const a=ws['A'+r],b=ws['B'+r];
        if(!a||!a.v)continue;
        const nameStr=String(a.v).trim();
        const isDorsal=b&&(typeof b.v==='number'||/^\d+$/.test(String(b.v)));
        if(!isDorsal)continue;
        if(mFull.some(m=>nameStr.toUpperCase()===m.toUpperCase()))continue;
        if(nameStr==='Asistencias')continue;
        
        const pl=t.players.find(p=>p.name.toLowerCase()===nameStr.toLowerCase())||
                  t.players.find(p=>nameStr.toLowerCase().includes(p.name.split(' ')[0].toLowerCase()));
        if(!pl)continue;
        
        // Scan month rows below this player
        for(let mr=r+1;mr<r+30;mr++){
          const mCell=ws['A'+mr];
          if(!mCell||!mCell.v)continue;
          const mLabel=String(mCell.v).trim();
          const mCap=mLabel.charAt(0).toUpperCase()+mLabel.slice(1).toLowerCase();
          if(!monthMap[mCap])continue;
          
          const attRow=mr+1;
          const attCheck=ws['A'+attRow];
          if(!attCheck||String(attCheck.v).trim()!=='Asistencias')continue;
          
          const [yr,mo]=monthMap[mCap];
          for(let col=1;col<32;col++){
            const colLetter=XLSX.utils.encode_col(col);
            const dayCell=ws[colLetter+mr];
            const valCell=ws[colLetter+attRow];
            if(!dayCell||dayCell.v===undefined||dayCell.v===null)continue;
            if(!valCell||valCell.v===undefined||valCell.v===null||valCell.v==='')continue;
            const dayNum=parseInt(dayCell.v);
            if(isNaN(dayNum)||dayNum<1||dayNum>31)continue;
            let code=String(valCell.v).trim();
            if(code==='1'||code==='1.0')code='1';
            if(!['1','D','I','T','t','J','B','E','C','O','P'].includes(code))continue;
            const dateKey=yr+'-'+String(mo).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
            if(!t.trainingSessions[dateKey])t.trainingSessions[dateKey]={};
            t.trainingSessions[dateKey][pl.id]=code;
            attendanceAdded++;
          }
        }
      }
    }
    
    saveDB(DB);
    // Sync to cloud
    if(playersAdded>0){syncImportarJugadoresBulk(t.id,t.players);}
    if(attendanceAdded>0){
      const regs=[];
      Object.entries(t.trainingSessions).forEach(([fecha,sess])=>{
        Object.entries(sess).forEach(([pid,inc])=>{
          const pl=t.players.find(x=>x.id===pid);
          regs.push({fecha,equipoId:t.id,jugadorId:pid,nombre:pl?pl.name:'',dorsal:pl?pl.dorsal:'',incidencia:inc});
        });
      });
      syncAsistenciaBulk(t.id,regs);
    }
    rc();
    $('#xlsStatus',bg).innerHTML=`<span style="color:var(--green);">✓ ${playersAdded} jugadores y ${attendanceAdded} registros de asistencia importados y sincronizados</span>`;
  }catch(err){
    $('#xlsStatus',bg).innerHTML='<span style="color:var(--red);">Error: '+err.message+'</span>';
  }
}

function _doGenerateExcel(){
  var wb=XLSX.utils.book_new();

  // Sheet 1: Resumen Total (all teams)
  var resData=[['Equipo','Jugador','Dorsal','Entrenos','Faltas','Partidos']];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;}).length;
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      var faltas=(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['E']||0)+(a.bk['C']||0)+(a.bk['O']||0);
      resData.push([t.name,p.name,p.dorsal,entrenos,faltas,a.g+eg]);
    });
  });
  var ws1=XLSX.utils.aoa_to_sheet(resData);
  XLSX.utils.book_append_sheet(wb,ws1,'Resumen Total');

  // Sheet 2: Ranking Entrenos
  var entData=[['Pos','Equipo','Jugador','Dorsal','Entrenos','Lesiones','Faltas','Partidos']];
  var allPlayers=[];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      var faltas=(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['E']||0)+(a.bk['C']||0)+(a.bk['O']||0);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;}).length;
      allPlayers.push({team:t.name,name:p.name,dorsal:p.dorsal,entrenos:entrenos,lesion:a.bk['B']||0,faltas:faltas,partidos:a.g+eg});
    });
  });
  allPlayers.sort(function(a,b){return b.entrenos-a.entrenos;});
  allPlayers.forEach(function(p,i){entData.push([i+1,p.team,p.name,p.dorsal,p.entrenos,p.lesion,p.faltas,p.partidos]);});
  var ws2=XLSX.utils.aoa_to_sheet(entData);
  XLSX.utils.book_append_sheet(wb,ws2,'Ranking Entrenos');

  // Sheet 3: Ranking Partidos
  var partData=[['Pos','Equipo','Jugador','Dorsal','Partidos','Entrenos','Puntos']];
  var allPart=[];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;});
      var totalG=a.g+eg.length;
      var totalPts=a.pts+eg.reduce(function(s,g){return s+(g.points||0);},0);
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      allPart.push({team:t.name,name:p.name,dorsal:p.dorsal,partidos:totalG,entrenos:entrenos,puntos:totalPts});
    });
  });
  allPart.sort(function(a,b){return b.partidos-a.partidos;});
  allPart.forEach(function(p,i){partData.push([i+1,p.team,p.name,p.dorsal,p.partidos,p.entrenos,p.puntos]);});
  var ws3=XLSX.utils.aoa_to_sheet(partData);
  XLSX.utils.book_append_sheet(wb,ws3,'Ranking Partidos');

  // Sheet 4: Asistencia por equipo
  DB.teams.forEach(function(t){
    var attData=[['Jugador','Dorsal','1','D','I','T','t','J','B','E','C','O','P','% Asist']];
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      attData.push([p.name,p.dorsal,a.bk['1']||0,a.bk['D']||0,a.bk['I']||0,a.bk['T']||0,a.bk['t']||0,a.bk['J']||0,a.bk['B']||0,a.bk['E']||0,a.bk['C']||0,a.bk['O']||0,a.bk['P']||0,a.pct+'%']);
    });
    var wsT=XLSX.utils.aoa_to_sheet(attData);
    var sheetName=t.name.substring(0,31);
    XLSX.utils.book_append_sheet(wb,wsT,sheetName);
  });

  XLSX.writeFile(wb,'BB_Badajoz_Informe_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Excel descargado');
}

function rSchedule(c){
  var scheds=DB.schedules||[];
  if(!scheds.length){c.innerHTML='<div class="card" style="text-align:center;color:var(--text3);padding:20px;">No hay horarios configurados.<br>El administrador puede crearlos desde ⚙️ Administración.</div>';return;}
  var days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  var shortDays=['Lun','Mar','Mié','Jue','Vie'];
  var colors={'MINI':'#3498db','INF':'#e67e22','CAD':'#9b59b6','JUN':'#27ae60','NACIONAL':'#e74c3c','TECNIF':'#95a5a6','BENJAMIN':'#f1c40f','PARTIDO':'#1565C0','DIPUTAC':'#8d6e63'};
  function getColor(name){
    if(!name)return'transparent';
    var n=name.toUpperCase();
    for(var k in colors){if(n.indexOf(k)>=0)return colors[k];}
    return'#555';
  }
  scheds.forEach(function(pav){
    c.innerHTML+='<div class="section-title">'+pav.name+'</div>';
    var tableHtml='<div class="card" style="padding:6px;overflow-x:auto;"><table style="border-collapse:collapse;width:100%;font-size:8px;"><tr><th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">Hora</th>';
    days.forEach(function(d,di){
      for(var cc=1;cc<=pav.courts;cc++){
        tableHtml+='<th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">'+shortDays[di]+(pav.courts>1?' P'+cc:'')+'</th>';
      }
    });
    tableHtml+='</tr>';
    (pav.slots||[]).forEach(function(slot){
      tableHtml+='<tr><td style="padding:2px 3px;border:1px solid var(--line);font-weight:700;white-space:nowrap;">'+slot.time+'</td>';
      days.forEach(function(d){
        for(var cc=1;cc<=pav.courts;cc++){
          var val=slot[d+'_P'+cc]||'';
          var bg=getColor(val);
          tableHtml+='<td style="padding:2px;border:1px solid var(--line);background:'+bg+';color:#fff;font-weight:600;text-align:center;font-size:7px;">'+val+'</td>';
        }
      });
      tableHtml+='</tr>';
    });
    tableHtml+='</table></div>';
    c.innerHTML+=tableHtml;
  });
  c.innerHTML+='<button class="btn btn-outline btn-block btn-sm" style="margin-top:8px;" onclick="exportSchedule()">📄 Exportar horario</button>';
}

window.showClubReport=function(){
  var bg=el('div','modal-bg active');
  var content='<div class="card"><div style="font-weight:700;margin-bottom:8px;">Cuadro de mando del club</div><div class="report-row"><span class="rlbl">Equipos</span><span class="rval">'+DB.teams.length+'</span></div>';
  DB.teams.slice().sort(function(a,b){return categoryRank(a.category)-categoryRank(b.category);}).forEach(function(t){
    var d=Object.keys(t.trainingSessions||{}).length;
    var avg=t.players.length?Math.round(t.players.reduce(function(a,p){return a+calcAtt(t,p.id).pct;},0)/t.players.length):0;
    content+='<div class="report-row"><span class="rlbl">'+t.name+'</span><span class="rval">'+d+' dias - '+avg+'% - '+t.games.length+' part.</span></div>';
  });
  content+='</div>';
  bg.innerHTML='<div class="modal"><h3>📊 Informe del club</h3>'+content+'<button class="btn btn-outline btn-block" style="margin-top:12px;" onclick="this.closest(\'.modal-bg\').remove()">Cerrar</button></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
};

    '</div></div>'+

    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary btn-block" id="saveCoachBtn">Guardar</button>'+
    '<button class="btn btn-outline" id="cancelCoachBtn">Cancelar</button></div></div>';
  document.body.appendChild(bg);

  bg.querySelector('#coachPhotoInput').onchange=function(){handleCoachPhoto(this);};
  bg.querySelector('#cancelCoachBtn').onclick=function(){bg.remove();showCoachPanel();};
  bg.querySelector('#saveCoachBtn').onclick=function(){saveCoach(cid);};
};

window.handleCoachPhoto=function(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=200;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var min=Math.min(img.width,img.height);
      var sx=(img.width-min)/2,sy=(img.height-min)/2;
      ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
      var dataUrl=canvas.toDataURL('image/jpeg',0.85);
      document.getElementById('coachPhotoData').value=dataUrl;
      document.getElementById('coachPhotoPreview').innerHTML='<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;">';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

window.saveCoach=function(cid){
  var name=document.getElementById('cName').value.trim();
  if(!name){toast('Nombre obligatorio');return;}
  if(!cid&&(DB.coaches||[]).some(function(c){return c.name.toLowerCase()===name.toLowerCase();})){toast('Ya existe un entrenador con ese nombre');return;}
  var phone=document.getElementById('cPhone').value.trim();
  var email=document.getElementById('cEmail').value.trim();
  var password=document.getElementById('cPwd').value.trim();
  var photo=document.getElementById('coachPhotoData').value;
  var teams=[];
  document.querySelectorAll('.coachTeamCb:checked').forEach(function(cb){teams.push(cb.value);});
  if(teams.length>4){toast('Maximo 4 equipos');return;}
  if(!DB.coaches)DB.coaches=[];
  if(cid){
    var c=DB.coaches.find(function(x){return x.id===cid;});
    if(c){c.name=name;c.phone=phone;c.email=email;c.photo=photo;c.teams=teams;c.password=password;}
  } else {
    DB.coaches.push({id:gid(),name:name,phone:phone,email:email,photo:photo,teams:teams,password:password});
  }
  saveDB(DB);
  DB.teams.forEach(function(t){
    var coach=DB.coaches.find(function(c){return(c.teams||[]).indexOf(t.id)>=0;});
    if(coach)t.coachName=coach.name;
  });
  saveDB(DB);
  document.querySelector('.modal-bg').remove();
  showCoachPanel();
  toast(cid?'Entrenador actualizado':'Entrenador anadido');
};

window.deleteCoach=function(cid){
  if(!confirm('Eliminar este entrenador?'))return;
  DB.coaches=DB.coaches.filter(function(c){return c.id!==cid;});
  saveDB(DB);
  document.querySelector('.modal-bg').remove();
  showCoachPanel();
  toast('Entrenador eliminado');
};

function renderSchoolsList(app){
  var isCoord=(S.schoolsRole==='coord');
  var schools=isCoord?(DB.schools||[]):(DB.schools||[]).filter(function(s){return s.id===S.mySchoolId;});

  var hdr=el('div','header');
  hdr.innerHTML='<h1>Escuelas Deportivas</h1><button class="btn btn-sm" style="color:var(--text3);font-size:14px;padding:4px 8px;" id="schBack">✕</button>';
  app.appendChild(hdr);

  var content=el('div','content');
  content.innerHTML='<div style="text-align:center;margin-bottom:12px;"><img src="'+ESCUELAS_LOGO+'" style="height:70px;"></div>'+
    '<div class="section-title">'+(isCoord?'Todas las sedes':'Mi sede')+' ('+schools.length+')</div>';

  schools.forEach(function(sc){
    var card=el('div','card');
    card.style.cursor='pointer';
    var monitors=(sc.monitors||[]).filter(function(m){return m;}).join(', ');
    card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:700;font-size:14px;">'+sc.sede+'</div><div style="font-size:11px;color:var(--text3);">'+(monitors||'Sin monitores')+'</div><div style="font-size:10px;color:var(--text3);">'+(sc.kids||[]).length+' ninos/as</div></div><div style="font-size:22px;color:#e67e22;">→</div></div>';
    card.setAttribute('data-scid',sc.id);
    content.appendChild(card);
  });

  if(!schools.length){
    content.innerHTML+='<div class="card" style="text-align:center;color:var(--text3);padding:20px;">No hay sedes'+(isCoord?'. Crea la primera.':' asignadas.')+'</div>';
  }

  if(isCoord){
    var addBtn=el('button','btn btn-primary btn-block');
    addBtn.style.marginTop='10px';
    addBtn.textContent='+ Nueva sede';
    addBtn.id='addSchoolBtn';
    content.appendChild(addBtn);
  }

  app.appendChild(content);

  content.querySelectorAll('[data-scid]').forEach(function(card){
    card.onclick=function(){S.selSchool=card.getAttribute('data-scid');S.view='schooldetail';render();};
  });
  var backBtn=app.querySelector('#schBack');
  if(backBtn)backBtn.onclick=function(){S.view='login';S.schoolsRole=null;render();};
  var addBtn2=app.querySelector('#addSchoolBtn');
  if(addBtn2)addBtn2.onclick=function(){showNewSchoolModal();};
}

window.showNewSchoolModal=function(sc){
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>'+(sc?'Editar sede':'Nueva sede')+'</h3>'+
    '<div class="form-group"><label>Nombre de la sede</label><input id="scSede" value="'+(sc?sc.sede:'')+'"></div>'+
    '<div class="form-group"><label>Clave de acceso de esta sede</label><input id="scPwd" value="'+(sc?sc.password||'':'')+'" placeholder="Clave para los monitores"></div>'+
    '<div class="form-group"><label>Monitor 1</label><input id="scM1" value="'+(sc&&sc.monitors?sc.monitors[0]||'':'')+'"></div>'+
    '<div class="form-group"><label>Monitor 2</label><input id="scM2" value="'+(sc&&sc.monitors?sc.monitors[1]||'':'')+'"></div>'+
    '<div class="form-group"><label>Monitor 3</label><input id="scM3" value="'+(sc&&sc.monitors?sc.monitors[2]||'':'')+'"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary btn-block" id="scSave">Guardar</button><button class="btn btn-outline" id="scCancel">Cancelar</button></div>'+
    (sc?'<button class="btn btn-danger btn-block" style="margin-top:10px;" id="scDelete">Eliminar sede</button>':'')+
    '</div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#scCancel').onclick=function(){bg.remove();};
  bg.querySelector('#scSave').onclick=function(){
    var sede=$('#scSede',bg).value.trim();
    if(!sede){toast('Nombre obligatorio');return;}
    if(!sc&&(DB.schools||[]).some(function(x){return x.sede.toLowerCase()===sede.toLowerCase();})){toast('Ya existe una sede con ese nombre');return;}
    var pwd=$('#scPwd',bg).value.trim();
    var m1=$('#scM1',bg).value.trim(),m2=$('#scM2',bg).value.trim(),m3=$('#scM3',bg).value.trim();
    if(!DB.schools)DB.schools=[];
    if(sc){sc.sede=sede;sc.password=pwd;sc.monitors=[m1,m2,m3];}
    else{DB.schools.push({id:gid(),sede:sede,password:pwd,monitors:[m1,m2,m3],kids:[]});}
    saveDB(DB);bg.remove();render();toast(sc?'Sede actualizada':'Sede creada');
  };
  if(sc){
    bg.querySelector('#scDelete').onclick=function(){
      if(!confirm('Eliminar sede '+sc.sede+' y todos sus datos?'))return;
      DB.schools=DB.schools.filter(function(x){return x.id!==sc.id;});
      saveDB(DB);bg.remove();S.view='schoolslist';render();toast('Sede eliminada');
    };
  }
};

function renderSchoolDetail(app){
  var sc=(DB.schools||[]).find(function(x){return x.id===S.selSchool;});
  if(!sc){S.view='schoolslist';render();return;}
  var isCoord=(S.schoolsRole==='coord');

  var hdr=el('div','header');

  document.body.appendChild(bg);

  bg.querySelector('#cancelPavBtn').onclick=function(){bg.remove();showScheduleEditor();};
  bg.querySelector('#savePavBtn').onclick=function(){
    var name=$('#pavName',bg).value.trim();
    var courts=parseInt($('#pavCourts',bg).value)||1;
    var slotsText=$('#pavSlots',bg).value.trim();
    if(!name||!slotsText){toast('Nombre y franjas obligatorios');return;}
    var slotTimes=slotsText.split('\n').filter(function(s){return s.trim();});
    var slots=slotTimes.map(function(time){
      var row={time:time.trim()};
      ['Lunes','Martes','Miercoles','Jueves','Viernes'].forEach(function(day){
        for(var c=1;c<=courts;c++){row[day+'_P'+c]='';}
      });
      return row;
    });
    if(!DB.schedules)DB.schedules=[];
    DB.schedules.push({name:name,courts:courts,slots:slots});
    saveDB(DB);bg.remove();toast('Pabellón añadido');showScheduleEditor();
  };
};

window.editScheduleGrid=function(pi){
  var pav=DB.schedules[pi];
  var days=['Lunes','Martes','Miercoles','Jueves','Viernes'];
  var shortDays=['Lun','Mar','Mie','Jue','Vie'];
  var teamNames=DB.teams.map(function(t){return t.name;});
  teamNames.push('TECNIFICACIONES','PARTIDOS');
  var options='<option value="">-</option>'+teamNames.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('');
  var bg=el('div','modal-bg active');
  var tbl='<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:8px;"><tr><th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">Hora</th>';
  days.forEach(function(d,di){
    for(var c=1;c<=pav.courts;c++){tbl+='<th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">'+shortDays[di]+(pav.courts>1?' P'+c:'')+'</th>';}
  });
  tbl+='</tr>';
  pav.slots.forEach(function(slot,si){
    tbl+='<tr><td style="padding:2px;border:1px solid var(--line);font-weight:600;white-space:nowrap;">'+slot.time+'</td>';
    days.forEach(function(d){
      for(var c=1;c<=pav.courts;c++){
        var key=d+'_P'+c;var val=slot[key]||'';
        tbl+='<td style="padding:1px;border:1px solid var(--line);"><select data-si="'+si+'" data-key="'+key+'" style="width:100%;font-size:7px;padding:1px;border:none;background:var(--bg3);color:var(--text);">'+options.replace('value="'+val+'"','value="'+val+'" selected')+'</select></td>';
      }
    });
    tbl+='</tr>';
  });
  tbl+='</table></div>';
  bg.innerHTML='<div class="modal" style="max-width:100%;">'+tbl+'<div style="display:flex;gap:8px;margin-top:10px;"><button class="btn btn-primary btn-block" id="saveGridBtn">Guardar</button><button class="btn btn-outline" id="cancelGridBtn">Cancelar</button></div></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#cancelGridBtn').onclick=function(){bg.remove();showScheduleEditor();};
  bg.querySelector('#saveGridBtn').onclick=function(){
    bg.querySelectorAll('[data-si]').forEach(function(sel){
      var si=parseInt(sel.dataset.si);pav.slots[si][sel.dataset.key]=sel.value;
    });
    saveDB(DB);bg.remove();toast('Horario guardado');showScheduleEditor();
  };
};

async function init(){
  render();
  if(CONFIG_URL_GOOGLE_SHEETS!=='AQUÍ_IRÁ_EL_ENLACE'){
    const st=()=>document.getElementById('syncStatus');
    try{
      if(st()) st().textContent='Descargando datos...';
      const res=await gsGet({action:'all'});
      if(res.ok&&res.data){
        // Rebuild DB
        const teamMap={};
        (res.data.equipos||[]).forEach(eq=>{
          teamMap[eq.id]={id:eq.id,name:eq.nombre,category:eq.categoria,coachCode:eq.claveEntrenador,directorCode:eq.claveDirector,coachName:eq.coachName||'',players:[],trainingSessions:{},games:[],trainingDays:{}};
        });
        // If Equipos sheet is empty but we have jugadores, auto-create teams
        const allEquipoIds=new Set();
        (res.data.jugadores||[]).forEach(j=>allEquipoIds.add(j.equipoId));
        (res.data.asistencia||[]).forEach(a=>allEquipoIds.add(a.equipoId));
        allEquipoIds.forEach(eid=>{
          if(!teamMap[eid])teamMap[eid]={id:eid,name:'Equipo '+eid.slice(-4),category:'',coachCode:'1234',directorCode:'5678',players:[],trainingSessions:{},games:[],trainingDays:{}};
        });
        (res.data.jugadores||[]).forEach(j=>{
          if(!teamMap[j.equipoId])return;
          teamMap[j.equipoId].players.push({id:j.id,name:j.nombre,dorsal:parseInt(j.dorsal)||0,birthYear:j.anioNacimiento||'',phone:j.telefono||'',email:j.email||'',obs:j.obs||'',photo:j.photoUrl||j.photo||_getLocalPhoto(j.id)||''});
        });
        (res.data.asistencia||[]).forEach(a=>{
          if(!teamMap[a.equipoId])return;
          const t=teamMap[a.equipoId];
          if(a.jugadorId==='__TEAM_DAY__'){
            if(!t.trainingDays)t.trainingDays={};
            t.trainingDays[normDate(a.fecha)]=(a.incidencia==='TRAIN_DAY');
            return;
          }
          if(!t.trainingSessions[normDate(a.fecha)])t.trainingSessions[normDate(a.fecha)]={};
          t.trainingSessions[normDate(a.fecha)][a.jugadorId]=a.incidencia;
        });
        const gameMap={};
        (res.data.partidos||[]).forEach(p=>{
          if(!gameMap[p.id])gameMap[p.id]={id:p.id,date:p.fecha,equipoId:p.equipoId,opponent:p.rival,players:[]};
          gameMap[p.id].players.push({playerId:p.jugadorId,minutes:p.minutos,points:parseInt(p.puntos)||0});
        });
        Object.values(gameMap).forEach(g=>{
          if(teamMap[g.equipoId])teamMap[g.equipoId].games.push(g);
        });
        DB.teams=Object.values(teamMap);
        saveDB(DB);
        const _savedSel=document.getElementById('selTeam')?.value||'';
        render();
        const _restoredSel=document.getElementById('selTeam');
        if(_restoredSel&&_savedSel){_restoredSel.value=_savedSel;$('#codeS')?.classList.remove('hidden');}
        if(st()) st().innerHTML='<span style="color:var(--green);">✓ Conectado · '+DB.teams.length+' equipos</span>';
      } else {
        if(st()) st().innerHTML='<span style="color:var(--gold);">⚠ Respuesta vacía del servidor</span>';
      }
    }catch(err){
      console.error('Init sync error:',err);
      const s=st();
      if(s) s.innerHTML='<span style="color:var(--red);">Error: '+err.message+'</span>';
    }
    // Sync periódico
    setInterval(async()=>{
      if(!SYNCING&&S.view==='main'){
        try{await syncFromCloud();const c=$('#cnt');if(c)rc();}catch(e){}
      }
    },60000);
  }
}
init();
</script>
</body>
</html>
