      if(!(await customConfirm('¿Quitar a esta persona de la plantilla?')))return;
      t.players=t.players.filter(function(x){return x.id!==pid;});
      saveDB(DB);
      syncEliminarJugador(pid);
      btn.closest('div').remove();
      toast('Eliminado');
    };
  });

  bg.querySelectorAll('.riManualMatch').forEach(function(sel){
    sel.onchange=function(){
      var idx=sel.getAttribute('data-idx');
      var dorsalInput=bg.querySelector('.riNewDorsal[data-idx="'+idx+'"]');
      dorsalInput.style.display=sel.value?'none':'block';
    };
  });

  bg.querySelector('#riConfirm').onclick=async function(){
    const btn=bg.querySelector('#riConfirm');btn.disabled=true;btn.textContent='Aplicando...';
    let actualizados=0,añadidos=0;
    bg.querySelectorAll('.riMatch:checked').forEach(function(cb){
      const m=matched[parseInt(cb.getAttribute('data-idx'))];
      if(m.fila.birthYear)m.pl.birthYear=m.fila.birthYear;
      if(m.fila.phone)m.pl.phone=m.fila.phone;
      if(m.fila.email)m.pl.email=m.fila.email;
      actualizados++;
    });
    for(const cb of bg.querySelectorAll('.riMatch:checked')){
      const m=matched[parseInt(cb.getAttribute('data-idx'))];
      await syncGuardarJugador(t.id,m.pl);
    }
    const nuevosAAgregar=[];
    const actualizadosManual=[];
    bg.querySelectorAll('.riNew:checked').forEach(function(cb){
      const idx=parseInt(cb.getAttribute('data-idx'));
      const manualSel=bg.querySelector('.riManualMatch[data-idx="'+idx+'"]');
      const manualPid=manualSel?manualSel.value:'';
      const f=nuevos[idx].fila;
      if(manualPid){
        // El coordinador ha indicado que en realidad es una persona ya existente en la
        // plantilla (mal emparejada por diferencias de escritura) — se actualiza esa persona
        // en vez de crear una nueva.
        const plExistente=t.players.find(function(x){return x.id===manualPid;});
        if(plExistente){
          if(f.birthYear)plExistente.birthYear=f.birthYear;
          if(f.phone)plExistente.phone=f.phone;
          if(f.email)plExistente.email=f.email;
          actualizadosManual.push(plExistente);
        }
        return;
      }
      const dorsalInput=bg.querySelector('.riNewDorsal[data-idx="'+idx+'"]');
      const dorsal=parseInt(dorsalInput.value);
      if(isNaN(dorsal)){dorsalInput.style.borderColor='var(--red)';return;}
      const np={id:gid(),name:f.name,dorsal:dorsal,birthYear:f.birthYear||'',phone:f.phone||'',email:f.email||''};
      t.players.push(np);
      nuevosAAgregar.push(np);
      añadidos++;
    });
    let vinculados=0;
    bg.querySelectorAll('.riVinculado:checked').forEach(function(cb){
      const idx=parseInt(cb.getAttribute('data-idx'));
      const n=nuevos[idx];
      if(t.players.some(function(pl){return pl.dorsal===n.plOtro.dorsal;}))return; // choque de dorsal, no se añade
      const np={id:gid(),name:n.fila.name,dorsal:n.plOtro.dorsal,birthYear:n.fila.birthYear||'',phone:n.fila.phone||'',email:n.fila.email||'',vinculadoDe:n.otroEquipo.name};
      t.players.push(np);
      nuevosAAgregar.push(np);
      vinculados++;
    });
    saveDB(DB);
    for(const np of nuevosAAgregar){await syncGuardarJugador(t.id,np);}
    for(const pl of actualizadosManual){await syncGuardarJugador(t.id,pl);}
    btn.disabled=false;
    bg.remove();rc();
    toast('✓ '+(actualizados+actualizadosManual.length)+' actualizados, '+añadidos+' añadidos, '+vinculados+' vinculados');
  };
}

function showExcelImport(){
  const bg=el('div','modal-bg active');
  bg.innerHTML=`<div class="modal"><h3>Importar Excel del equipo</h3>
    <p style="font-size:11px;color:var(--text2);margin-bottom:12px;">Sube el archivo .xlsm o .xlsx del equipo (formato estándar del club con hojas "Contro Asistencia" y "Jugadores").</p>
    <div class="import-zone" id="xlsZone">Pulsa para seleccionar archivo Excel<input type="file" accept=".xlsx,.xlsm,.xls" style="display:none;" id="xlsInput"></div>
    <div id="xlsStatus" style="margin-top:10px;font-size:12px;"></div>
    <p style="font-size:10px;color:var(--text3);margin-top:12px;">📄 Ficha oficial de equipo de la Federación, en PDF: se lee sola y te enseña una pantalla para revisar antes de aplicar nada.</p>
    <div class="import-zone" style="margin-top:6px;" id="pdfZone">PDF de la Federación<input type="file" accept=".pdf" style="display:none;" id="pdfJInput"></div>
    <div id="pdfStatus" style="margin-top:6px;font-size:12px;"></div>
    <p style="font-size:10px;color:var(--text3);margin-top:12px;">También puedes importar/actualizar la plantilla con CSV: una fila por persona con formato <b>Nombre,FechaNacimiento,Teléfono,Email</b> (sin dorsal — se pide al confirmar solo para quien sea nuevo). Compara con la plantilla actual antes de aplicar nada.</p>
    <div class="import-zone" style="margin-top:6px;" id="csvZone">CSV de jugadores<input type="file" accept=".csv,.txt" style="display:none;" id="csvJInput"></div>
    <div id="csvStatus" style="margin-top:6px;font-size:12px;"></div>
    <button class="btn btn-outline btn-block" style="margin-top:12px;" onclick="this.closest('.modal-bg').remove()">Cerrar</button></div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  $('#xlsZone',bg).onclick=()=>$('#xlsInput',bg).click();
  $('#csvZone',bg).onclick=()=>$('#csvJInput',bg).click();
  $('#pdfZone',bg).onclick=()=>$('#pdfJInput',bg).click();

  // Ficha oficial de equipo (PDF de la Federación): se lee con pdf.js directamente en el
  // móvil, se agrupan las palabras por fila (misma altura en la página) y se interpretan con
  // patrones (fecha, teléfono, email) — nunca a ciegas: todo pasa por la misma pantalla de
  // revisión que el CSV antes de tocar la plantilla.
  $('#pdfJInput',bg).onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    $('#pdfStatus',bg).innerHTML='<span style="color:var(--accent);">Leyendo PDF...</span>';
    function cargarPdfJs(cb){
      if(window.pdfjsLib){cb();return;}
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        cb();
      };
      s.onerror=function(){$('#pdfStatus',bg).innerHTML='<span style="color:var(--red);">No se pudo cargar el lector de PDF. Revisa tu conexión.</span>';};
      document.head.appendChild(s);
    }
    cargarPdfJs(async function(){
      try{
        const buf=await file.arrayBuffer();
        const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
        var filasTexto=[];
        for(let pn=1;pn<=pdf.numPages;pn++){
          const page=await pdf.getPage(pn);
          const content=await page.getTextContent();
          // Agrupar los trozos de texto por fila: misma altura (Y) aproximada en la página
          const porFila={};
          content.items.forEach(function(it){
            var y=Math.round(it.transform[5]/3)*3; // tolerancia de agrupación
            if(!porFila[y])porFila[y]=[];
            porFila[y].push({x:it.transform[4],str:it.str});
          });
          Object.keys(porFila).sort(function(a,b){return b-a;}).forEach(function(y){
            var linea=porFila[y].sort(function(a,b){return a.x-b.x;}).map(function(x){return x.str;}).join(' ').replace(/\s+/g,' ').trim();
            if(linea)filasTexto.push(linea);
          });
        }
        // De cada línea que sea una fila de JUGADOR, extraer nombre, fecha, teléfono, email
        const filas=[];
        filasTexto.forEach(function(linea){
          if(!/JUGADOR/i.test(linea))return; // se ignoran entrenadores y cabeceras en esta importación
          var fechaM=linea.match(/(\d{2}\/\d{2}\/\d{4})/);
          var emailM=linea.match(/([\w.+-]+@[\w.-]+\.\w+)/);
          var telM=linea.match(/\b(\d{9})\b/);
          // El nombre es el texto entre el NIF (al principio) y la palabra "JUGADOR"
          var sinNif=linea.replace(/^\s*[A-Z0-9]{7,9}\s+/,'');
          var idxJugador=sinNif.toUpperCase().indexOf('JUGADOR');
          var nombre=idxJugador>0?sinNif.slice(0,idxJugador).trim():'';
          if(!nombre)return;
          filas.push({name:nombre,birthYear:fechaM?fechaM[1].slice(-4):'',phone:telM?telM[1]:'',email:emailM?emailM[1]:''});
        });
        if(!filas.length){
          $('#pdfStatus',bg).innerHTML='<span style="color:var(--red);">No se ha reconocido ninguna fila de jugador/a en este PDF. Puede que el formato sea distinto — pruébalo con el CSV en su lugar.</span>';
          return;
        }
        $('#pdfStatus',bg).innerHTML='<span style="color:var(--green);">✓ '+filas.length+' fila(s) leídas. Abriendo revisión...</span>';
        bg.remove();
        showRosterImportConfirm(filas);
      }catch(err){
        console.error('Error leyendo PDF:',err);
        $('#pdfStatus',bg).innerHTML='<span style="color:var(--red);">No se pudo leer este PDF. Prueba con el CSV en su lugar.</span>';
      }
    });
  };

  // CSV import for players — con pantalla de confirmación (igual que partidos): actualiza a
  // quien ya está en la plantilla, añade a quien es nuevo (pidiendo dorsal), y avisa (sin
  // borrar nada solo) de quien está en la plantilla pero no aparece en el documento.
  $('#csvJInput',bg).onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const lines=ev.target.result.split('\n').map(l=>l.trim()).filter(l=>l);
      const filas=[];
      lines.forEach((line,i)=>{
        if(i===0&&line.toLowerCase().includes('nombre'))return;
        const parts=line.split(/[,;\t]/);
        if(!parts[0])return;
        const name=parts[0].trim();
        const fecha=(parts[1]||'').trim();
        const yearMatch=fecha.match(/(\d{4})/);
        const year=yearMatch?yearMatch[1]:(parts[1]?parseInt(parts[1])||'':'');
        const phone=(parts[2]||'').trim();
        const email=(parts[3]||'').trim();
        if(name)filas.push({name,birthYear:year,phone,email});
      });
      bg.remove();
      showRosterImportConfirm(filas);
    };
    reader.readAsText(file);
  };
  
  // Excel import placeholder - needs SheetJS
  $('#xlsInput',bg).onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    $('#xlsStatus',bg).innerHTML='<span style="color:var(--accent);">Procesando...</span>';
    
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        if(typeof XLSX==='undefined'){
          $('#xlsStatus',bg).innerHTML='<span style="color:var(--red);">Cargando librería Excel...</span>';
          const script=document.createElement('script');
          script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          script.onload=()=>processExcel(ev.target.result,bg);
          script.onerror=()=>{$('#xlsStatus',bg).innerHTML='<span style="color:var(--red);">Error cargando librería. Usa CSV como alternativa.</span>';};
          document.head.appendChild(script);
        } else {
          processExcel(ev.target.result,bg);
        }
      }catch(err){
        $('#xlsStatus',bg).innerHTML='<span style="color:var(--red);">Error: '+err.message+'</span>';
      }
    };
    reader.readAsArrayBuffer(file);
  };
}

function processExcel(data,bg){
  try{
    const wb=XLSX.read(data,{type:'array'});
    const t=T();
    let playersAdded=0,attendanceAdded=0;
    
    // Try "Contro Asistencia" sheet for players
    if(wb.SheetNames.includes('Contro Asistencia')){
      const ws=wb.Sheets['Contro Asistencia'];
      // Players start at row 9, col B=name, C=dorsal, A=year
      for(let r=9;r<30;r++){
        const nameCell=ws['B'+r],dorsalCell=ws['C'+r],yearCell=ws['A'+r];
        if(!nameCell||!nameCell.v)break;
        const name=String(nameCell.v).trim();
        const dorsal=dorsalCell?parseInt(dorsalCell.v)||0:0;
        const year=yearCell?parseInt(yearCell.v)||'':'';
        if(name&&!t.players.find(p=>p.name.toLowerCase()===name.toLowerCase())){
          t.players.push({id:gid(),name,dorsal,birthYear:year,phone:'',email:''});
          playersAdded++;
        }
      }
    }
    
    // Try "Jugadores" sheet for daily attendance
    if(wb.SheetNames.includes('Jugadores')){
      const ws=wb.Sheets['Jugadores'];
      const monthMap={'Septiembre':[2026,9],'Octubre':[2026,10],'Noviembre':[2026,11],'Diciembre':[2026,12],'Enero':[2027,1],'Febrero':[2027,2],'Marzo':[2027,3],'Abril':[2027,4],'Mayo':[2027,5],'Junio':[2027,6]};
      const mFull=Object.keys(monthMap);
      
      // Find player blocks
      for(let r=1;r<578;r++){
        const a=ws['A'+r],b=ws['B'+r];
        if(!a||!a.v)continue;
        const nameStr=String(a.v).trim();
        const isDorsal=b&&(typeof b.v==='number'||/^\d+$/.test(String(b.v)));
        if(!isDorsal)continue;
        if(mFull.some(m=>nameStr.toUpperCase()===m.toUpperCase()))continue;
        if(nameStr==='Asistencias')continue;
        
        const pl=t.players.find(p=>p.name.toLowerCase()===nameStr.toLowerCase())||
                  t.players.find(p=>nameStr.toLowerCase().includes(p.name.split(' ')[0].toLowerCase()));
        if(!pl)continue;
        
        // Scan month rows below this player
        for(let mr=r+1;mr<r+30;mr++){
          const mCell=ws['A'+mr];
          if(!mCell||!mCell.v)continue;
          const mLabel=String(mCell.v).trim();
          const mCap=mLabel.charAt(0).toUpperCase()+mLabel.slice(1).toLowerCase();
          if(!monthMap[mCap])continue;
          
          const attRow=mr+1;
          const attCheck=ws['A'+attRow];
          if(!attCheck||String(attCheck.v).trim()!=='Asistencias')continue;
          
          const [yr,mo]=monthMap[mCap];
          for(let col=1;col<32;col++){
            const colLetter=XLSX.utils.encode_col(col);
            const dayCell=ws[colLetter+mr];
            const valCell=ws[colLetter+attRow];
            if(!dayCell||dayCell.v===undefined||dayCell.v===null)continue;
            if(!valCell||valCell.v===undefined||valCell.v===null||valCell.v==='')continue;
            const dayNum=parseInt(dayCell.v);
            if(isNaN(dayNum)||dayNum<1||dayNum>31)continue;
            let code=String(valCell.v).trim();
            if(code==='1'||code==='1.0')code='1';
            if(!['1','D','I','T','t','J','B','E','C','O','P'].includes(code))continue;
            const dateKey=yr+'-'+String(mo).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
            if(!t.trainingSessions[dateKey])t.trainingSessions[dateKey]={};
            t.trainingSessions[dateKey][pl.id]=code;
            attendanceAdded++;
          }
        }
      }
    }
    
    saveDB(DB);
    // Sync to cloud
    if(playersAdded>0){syncImportarJugadoresBulk(t.id,t.players);}
    if(attendanceAdded>0){
      const regs=[];
      Object.entries(t.trainingSessions).forEach(([fecha,sess])=>{
        Object.entries(sess).forEach(([pid,inc])=>{
          const pl=t.players.find(x=>x.id===pid);
          regs.push({fecha,equipoId:t.id,jugadorId:pid,nombre:pl?pl.name:'',dorsal:pl?pl.dorsal:'',incidencia:inc});
        });
      });
      syncAsistenciaBulk(t.id,regs);
    }
    rc();
    $('#xlsStatus',bg).innerHTML=`<span style="color:var(--green);">✓ ${playersAdded} jugadores y ${attendanceAdded} registros de asistencia importados y sincronizados</span>`;
  }catch(err){
    $('#xlsStatus',bg).innerHTML='<span style="color:var(--red);">Error: '+err.message+'</span>';
  }
}

function generateExcel(mode){
  if(mode==='individual'&&!S.repPlayer){toast('Elige primero una jugadora en Individual');return;}

    if(mode==='individual')_doGenerateExcelIndividual();

}

function _doGenerateExcelIndividual(){
  const t=T();const p=t.players.find(function(x){return x.id===S.repPlayer;});
  if(!p){toast('Jugadora no encontrada');return;}
  const a=calcAtt(t,p.id);const gt=_playerGameTotals(t,p);const es=_playerExtraStatsTotals(t,p);
  const noEntrena=Math.max(a.teamDays-a.wTeam,0);
  const tMin=Math.floor(gt.totalSec/60),tSec=gt.totalSec%60;
  var wb=XLSX.utils.book_new();
  var resumen=[
    ['Jugadora',p.name],['Dorsal',p.dorsal],['Equipo',t.name],
    ['Entrenos totales',a.teamDays],['Entrenos con equipo',a.wTeam],['No entrena',noEntrena],
    ['% Asistencia',a.pct+'%'],['Partidos',gt.count],['Minutos jugados',tMin+':'+String(tSec).padStart(2,'0')],
    ['Puntos anotados',gt.totalPts]
  ];
  if(es.p2a+es.p3a+es.p1a+es.reb+es.stl+es.blk>0){
    resumen.push(['Tiros de 2',es.p2m+'/'+es.p2a],['Tiros de 3',es.p3m+'/'+es.p3a],['Tiros libres',es.p1m+'/'+es.p1a],
      ['Rebotes totales',es.reb],['Recuperaciones',es.stl],['Tapones',es.blk]);
  }
  resumen.push([''],['Creado por Chico Almeida']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resumen),'Resumen');
  var pGames=t.games.filter(function(g){return g.players.some(function(gp){return gp.playerId===p.id;});});
  var gamesData=[['Fecha','Rival','Minutos','Puntos']];
  pGames.sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(g){
    var gp=g.players.find(function(x){return x.playerId===p.id;});
    gamesData.push([normDate(g.date),g.opponent,fmtTime(gp.minutes),gp.points||0]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gamesData),'Partidos');
  var incData=[['Código','Significa','Veces']];
  CODES.forEach(function(cd){incData.push([cd.c,cd.l,a.bk[cd.c]||0]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(incData),'Incidencias');
  XLSX.writeFile(wb,p.name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Excel descargado');
}

function _doGenerateExcelClub(){
  var wb=XLSX.utils.book_new();

  // Sheet 1: Resumen Total (all teams)
  var resData=[['Equipo','Jugador','Dorsal','Entrenos','Faltas','Partidos']];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;}).length;
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      var faltas=(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['E']||0)+(a.bk['C']||0)+(a.bk['O']||0);
      resData.push([t.name,p.name,p.dorsal,entrenos,faltas,a.g+eg]);
    });
  });
  var ws1=XLSX.utils.aoa_to_sheet(resData);
  XLSX.utils.book_append_sheet(wb,ws1,'Resumen Total');

  // Sheet 2: Ranking Entrenos
  var entData=[['Pos','Equipo','Jugador','Dorsal','Entrenos','Lesiones','Faltas','Partidos']];
  var allPlayers=[];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      var faltas=(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['E']||0)+(a.bk['C']||0)+(a.bk['O']||0);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;}).length;
      allPlayers.push({team:t.name,name:p.name,dorsal:p.dorsal,entrenos:entrenos,lesion:a.bk['B']||0,faltas:faltas,partidos:a.g+eg});
    });
  });
  allPlayers.sort(function(a,b){return b.entrenos-a.entrenos;});
  allPlayers.forEach(function(p,i){entData.push([i+1,p.team,p.name,p.dorsal,p.entrenos,p.lesion,p.faltas,p.partidos]);});
  var ws2=XLSX.utils.aoa_to_sheet(entData);
  XLSX.utils.book_append_sheet(wb,ws2,'Ranking Entrenos');

  // Sheet 3: Ranking Partidos
  var partData=[['Pos','Equipo','Jugador','Dorsal','Partidos','Entrenos','Puntos']];
  var allPart=[];
  DB.teams.forEach(function(t){
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;});
      var totalG=a.g+eg.length;
      var totalPts=a.pts+eg.reduce(function(s,g){return s+(g.points||0);},0);
      var entrenos=(a.bk['1']||0)+(a.bk['D']||0)*2+(a.bk['I']||0);
      allPart.push({team:t.name,name:p.name,dorsal:p.dorsal,partidos:totalG,entrenos:entrenos,puntos:totalPts});
    });
  });
  allPart.sort(function(a,b){return b.partidos-a.partidos;});
  allPart.forEach(function(p,i){partData.push([i+1,p.team,p.name,p.dorsal,p.partidos,p.entrenos,p.puntos]);});
  var ws3=XLSX.utils.aoa_to_sheet(partData);
  XLSX.utils.book_append_sheet(wb,ws3,'Ranking Partidos');

  // Sheet 4: Asistencia por equipo
  DB.teams.forEach(function(t){
    var attData=[['Jugador','Dorsal','1','D','I','T','t','J','B','E','C','O','P','% Asist']];
    t.players.forEach(function(p){
      var a=calcAtt(t,p.id);
      attData.push([p.name,p.dorsal,a.bk['1']||0,a.bk['D']||0,a.bk['I']||0,a.bk['T']||0,a.bk['t']||0,a.bk['J']||0,a.bk['B']||0,a.bk['E']||0,a.bk['C']||0,a.bk['O']||0,a.bk['P']||0,a.pct+'%']);
    });
    var wsT=XLSX.utils.aoa_to_sheet(attData);
    var sheetName=t.name.substring(0,31);
    XLSX.utils.book_append_sheet(wb,wsT,sheetName);
  });

  // Sheet final: créditos
  var wsSig=XLSX.utils.aoa_to_sheet([['BB Baloncesto Badajoz'],['Creado por Chico Almeida']]);
  XLSX.utils.book_append_sheet(wb,wsSig,'Créditos');

  XLSX.writeFile(wb,'BB_Badajoz_Informe_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Excel descargado');
}

function _timeToMin(s){
  if(!s)return null;
  var parts=String(s).split(':');
  var h=parseInt(parts[0])||0,m=parseInt(parts[1])||0;
  return h*60+m;
}
function _minToTime(m){
  var h=Math.floor(m/60),mm=m%60;
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function _splitPavCourt(pavFullName){
  // "Nuria C. 2" -> {base:"Nuria C.", court:2} ; "Gévora" (sin número, 1 sola pista) -> {base:"Gévora", court:1}
  var m=String(pavFullName||'').match(/^(.*?)\s+(\d+)$/);
  if(m)return{base:m[1],court:parseInt(m[2])};
  return{base:pavFullName,court:1};
}
function _buildPavilionGridsFromTeams(){
  // Agrupa por pabellón BASE (sin el número de pista) — todas las pistas de un mismo
  // pabellón (ej. "Nuria C. 1/2/3") se combinan en un único cuadrante, como pide el club.
  var byPav={}; // {base: {courts:Set, entries:[{day,court,startMin,endMin,teamName}]}}
  (DB.teams||[]).forEach(function(t){
    (t.weeklySchedule||[]).forEach(function(s){
      if(!s.pavilion||!s.startTime)return;
      var norm=_normPav(s.pavilion);
      var sc=_splitPavCourt(norm);
      if(!byPav[sc.base])byPav[sc.base]={courts:{},entries:[]};
      byPav[sc.base].courts[sc.court]=true;
      var startMin=_timeToMin(s.startTime),endMin=_timeToMin(s.endTime)||(startMin+30);
      byPav[sc.base].entries.push({day:s.day,court:sc.court,startMin:startMin,endMin:endMin,teamName:t.name});
    });
  });
  return byPav;
}
function _renderAllPavGridsHTML(){

  var byPav=_buildPavilionGridsFromTeams();
  var pavNames=Object.keys(byPav).sort();
  if(!pavNames.length)return'';
  var colors={'MINI':'#3498db','INFANTIL':'#e67e22','CADETE':'#9b59b6','JUNIOR':'#27ae60','NACIONAL':'#e74c3c','BENJAMIN':'#f1c40f','DIPUTACION':'#8d6e63','TERCERAFEB':'#1565C0'};
  function getColor(name){
    if(!name)return'transparent';
    var n=(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    for(var k in colors){if(n.indexOf(k)>=0)return colors[k];}
    return'#555';
  }
  var out='';
  pavNames.forEach(function(pavName){
    var pav=byPav[pavName];
    var courtNums=Object.keys(pav.courts).map(Number).sort(function(a,b){return a-b;});
    if(!courtNums.length)courtNums=[1];
    var minStart=null,maxEnd=null;

      if(minStart===null||e.startMin<minStart)minStart=e.startMin;
      if(maxEnd===null||e.endMin>maxEnd)maxEnd=e.endMin;
    });
    if(minStart===null){minStart=16*60;maxEnd=21*60;}
    minStart=Math.floor(minStart/30)*30;
    maxEnd=Math.ceil(maxEnd/30)*30;
    var slots=[];

    tableHtml+='<tr><th style="padding:3px;border:1px solid var(--line);background:var(--bg4);" rowspan="2">Hora</th>';
    days.slice(0,5).forEach(function(d){
      tableHtml+='<th colspan="'+courtNums.length+'" style="padding:3px;border:1px solid var(--line);background:var(--bg4);">'+d.l+'</th>';
    });
    tableHtml+='</tr><tr>';
    days.slice(0,5).forEach(function(d){
      courtNums.forEach(function(cn){
        tableHtml+='<th style="padding:2px;border:1px solid var(--line);background:var(--bg3);font-size:6px;">P'+cn+'</th>';
      });
    });
    tableHtml+='</tr>';
    slots.forEach(function(slotStart){
      var slotEnd=slotStart+30;
      tableHtml+='<tr><td style="padding:2px 3px;border:1px solid var(--line);font-weight:700;white-space:nowrap;">'+_minToTime(slotStart)+'</td>';
      days.slice(0,5).forEach(function(d){
        courtNums.forEach(function(cn){
          var match=pav.entries.find(function(e){return e.day===d.k&&e.court===cn&&e.startMin<slotEnd&&e.endMin>slotStart;});
          var val=match?match.teamName:'';
          tableHtml+='<td style="padding:2px;border:1px solid var(--line);background:'+getColor(val)+';color:#fff;font-weight:600;text-align:center;font-size:6px;">'+val+'</td>';
        });
      });
      tableHtml+='</tr>';
    });
    tableHtml+='</table></div>';
    tableHtml+='<button class="btn btn-outline btn-sm" style="margin-bottom:12px;" onclick="exportScheduleImage(\''+pavName.replace(/'/g,"\\'")+'\')">📤 Compartir imagen de '+pavName+'</button>';
    out+=tableHtml;
  });
  return out;
}
function rSchedule(c){
  var t=T();
  var days=[{k:'L',l:'Lunes'},{k:'M',l:'Martes'},{k:'X',l:'Miércoles'},{k:'J',l:'Jueves'},{k:'V',l:'Viernes'},{k:'S',l:'Sábado'},{k:'D',l:'Domingo'}];
  var mySched=t.weeklySchedule||[];
  c.innerHTML='<div class="section-title">Horario de '+t.name+'</div>';
  if(!mySched.length){
    c.innerHTML+='<div class="card" style="text-align:center;color:var(--text3);padding:16px;">Este equipo todavía no tiene horario. '+(S.readOnly?'':'Se pone desde Ajustes del equipo.')+'</div>';
  } else {
    var cardHtml='<div class="card">';
    days.forEach(function(d){
      var s=mySched.find(function(x){return x.day===d.k;});
      if(!s)return;
      cardHtml+='<div class="report-row"><span class="rlbl" style="font-weight:700;">'+d.l+'</span><span class="rval">'+(s.startTime||'?')+(s.endTime?'-'+s.endTime:'')+(s.pavilion?' · '+_normPav(s.pavilion):'')+'</span></div>';
    });
    cardHtml+='</div>';
    c.innerHTML+=cardHtml;
  }
  if(!S.readOnly)c.innerHTML+='<button class="btn btn-outline btn-block btn-sm" style="margin-top:8px;margin-bottom:16px;" onclick="editTeamSettings()">✏️ Editar horario de este equipo</button>';

  c.innerHTML+='<div class="section-title" style="margin-top:16px;">Todos los equipos por pabellón</div>';
  var pavHtml=_renderAllPavGridsHTML();
  if(!pavHtml)return;
  c.innerHTML+=pavHtml;
  c.innerHTML+='<button class="btn btn-primary btn-block btn-sm" style="margin-top:8px;" onclick="exportScheduleImage(null)">📤 Compartir imagen general (todos los pabellones)</button>';
}

window.exportScheduleImage=function(pavName){
  _loadHtml2Canvas(function(){
    var target;
    if(pavName){
      target=document.getElementById('pavgrid_'+pavName.replace(/[^a-zA-Z0-9]/g,'_'));
    } else {
      target=document.createElement('div');
      target.style.position='fixed';target.style.left='-9999px';target.style.background='#fff';target.style.padding='10px';
      document.querySelectorAll('.pav-grid').forEach(function(g){target.appendChild(g.cloneNode(true));});
      document.body.appendChild(target);
    }
    if(!target){toast('No hay tabla que exportar');return;}
    html2canvas(target,{backgroundColor:'#ffffff',scale:2}).then(function(canvas){
      if(!pavName&&target.parentNode)document.body.removeChild(target);
      canvas.toBlob(function(blob){
        var fileName='Horario_'+(pavName||'General').replace(/[^a-zA-Z0-9]/g,'_')+'.jpg';
        var file=new File([blob],fileName,{type:'image/jpeg'});
        var shareData={files:[file],title:'Horario '+(pavName||'BB Baloncesto Badajoz'),text:'Horario de entrenamientos'};
        if(navigator.canShare&&navigator.canShare(shareData)){
          navigator.share(shareData).catch(function(){});
        } else {
          var url=URL.createObjectURL(blob);
          var a=document.createElement('a');a.href=url;a.download=fileName;a.click();
          toast('Imagen descargada');
        }
      },'image/jpeg',0.92);
    }).catch(function(){if(!pavName&&target.parentNode)document.body.removeChild(target);toast('Error generando la imagen');});
  });
};

window.showClubReport=function(){
  var bg=el('div','modal-bg active');
  var content='<div class="card"><div style="font-weight:700;margin-bottom:8px;">Cuadro de mando del club</div><div class="report-row"><span class="rlbl">Equipos</span><span class="rval">'+DB.teams.length+'</span></div>';
  DB.teams.slice().sort(function(a,b){return teamRank(a.name)-teamRank(b.name)||a.name.localeCompare(b.name);}).forEach(function(t){
    var d=Object.keys(t.trainingSessions||{}).length;
    var avg=_teamAttendancePct(t);
    content+='<div class="report-row"><span class="rlbl">'+t.name+'</span><span class="rval">'+d+' dias - '+avg+'% - '+t.games.length+' part.</span></div>';
  });
  content+='</div>';
  bg.innerHTML='<div class="modal"><h3>📊 Informe del club</h3>'+content+'<button class="btn btn-outline btn-block" style="margin-top:12px;" onclick="this.closest(\'.modal-bg\').remove()">Cerrar</button></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
};

window.editTeamFromAdmin=function(tid){
  var t=DB.teams.find(function(x){return x.id===tid;});
  if(!t)return;
  var bg=el('div','modal-bg active');
  var cur=_coachesForTeam(t.id);
  bg.innerHTML='<div class="modal"><h3>Modificar equipo</h3>'+
    '<div class="form-group"><label>Nombre del equipo</label><input id="etName" value="'+t.name+'"></div>'+
    '<div class="form-row"><div class="form-group"><label>1er Entrenador</label>'+_coachDropdown('etCoach1',cur.c1?cur.c1.id:'')+'</div><div class="form-group"><label>2do Entrenador</label>'+_coachDropdown('etCoach2',cur.c2?cur.c2.id:'')+'</div></div>'+
    '<div style="font-size:10px;color:var(--text3);margin:4px 0 8px;">La clave de acceso de cada entrenador se gestiona en Entrenadores, no aquí.</div>'+
    _buildScheduleRowsHTML(t)+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary btn-block" id="etSave">Guardar</button><button class="btn btn-outline" id="etCancel">Cancelar</button></div></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#etCancel').onclick=function(){bg.remove();showTeamManager();};
  bg.querySelector('#etSave').onclick=async function(){
    t.name=$('#etName',bg).value.trim();
    t.weeklySchedule=_readScheduleFromForm(bg);
    var coach1Id=$('#etCoach1',bg).value,coach2Id=$('#etCoach2',bg).value;
    _applyCoachSelection(t.id,'1',coach1Id);
    _applyCoachSelection(t.id,'2',coach2Id);
    saveDB(DB);
    const btn=bg.querySelector('#etSave');btn.disabled=true;btn.textContent='Guardando...';
    const res=await syncCrearEquipo(t);
    btn.disabled=false;btn.textContent='Guardar';
    if(res&&res.ok){bg.remove();toast('✓ Equipo actualizado y guardado en la nube');showTeamManager();}
    else{toast('⚠ No se pudo guardar en la nube. Revisa tu conexión e inténtalo de nuevo (no cierres esta ventana).');}
  };
};


function renderCoachList(app){
  var hdr=el('div','header');
  hdr.innerHTML='<button class="xbtn" id="clBack" style="margin-right:6px;">←</button><h1>Entrenadores</h1><button class="btn btn-sm" style="color:#fff;border:1px solid rgba(255,255,255,.3);font-size:10px;padding:4px 8px;margin-right:4px;" id="clReports">📊 Informes</button><button class="btn btn-sm" style="color:#fff;border:1px solid rgba(255,255,255,.3);font-size:10px;padding:4px 8px;" id="clNew">+ Crear</button>';
  app.appendChild(hdr);

  var content=el('div','content');
  var coaches=DB.coaches||[];
  content.innerHTML='<div class="section-title">'+coaches.length+' entrenadores</div>';

  coaches.forEach(function(c){
    var roleLabel={'1':'1er entrenador','2':'2do entrenador','coord':'Coordinador'};
    var teamsTxt=(c.teamRoles||[]).map(function(tr){
      var tt=DB.teams.find(function(x){return x.id===tr.teamId;});
      return tt?(tt.name+' ('+(roleLabel[tr.role]||tr.role)+')'):'';
    }).filter(function(x){return x;}).join(', ');
    var card=el('div','card');
    var photoHtml=c.photo?'<img src="'+c.photo+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">':'<div style="width:40px;height:40px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text3);">'+c.name.charAt(0)+'</div>';
    card.innerHTML='<div style="display:flex;align-items:center;gap:10px;"><div data-photobtnC="'+c.id+'" style="cursor:pointer;flex-shrink:0;">'+photoHtml+'</div><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;">'+c.name+'</div><div style="font-size:10px;color:var(--text3);">'+(teamsTxt||'Sin equipos asignados')+'</div></div></div><div style="display:flex;gap:6px;margin-top:8px;"><button class="btn btn-outline btn-sm" style="font-size:9px;flex:1;" data-editcoach="'+c.id+'">Modificar</button><button class="btn btn-danger btn-sm" style="font-size:9px;" data-delcoach="'+c.id+'">Eliminar</button></div>';
    content.appendChild(card);
  });

  if(!coaches.length){
    content.innerHTML+='<div class="card" style="text-align:center;color:var(--text3);padding:20px;">Sin entrenadores registrados</div>';
  }

  app.appendChild(content);

  app.querySelector('#clBack').onclick=function(){S.view='adminhome';render();setTimeout(function(){openAdminMenu();},50);};
  app.querySelector('#clNew').onclick=function(){editCoach();};
  app.querySelector('#clReports').onclick=function(){showReportsChoice();};
  content.querySelectorAll('[data-editcoach]').forEach(function(btn){btn.onclick=function(){editCoach(btn.dataset.editcoach);};});
  content.querySelectorAll('[data-delcoach]').forEach(function(btn){btn.onclick=function(){deleteCoach(btn.dataset.delcoach);};});
  content.querySelectorAll('[data-photobtnC]').forEach(function(btn){
    btn.onclick=function(){
      var c=coaches.find(function(x){return x.id===btn.dataset.photobtnC;});
      if(c&&c.photo)showPhotoLightbox(c.photo,c.name);else toast('Sin foto');
    };
  });
}

function renderSchoolsList(app){
  var isCoord=(S.schoolsRole==='coord');
  var schools=isCoord?(DB.schools||[]):(DB.schools||[]).filter(function(s){return s.id===S.mySchoolId;});

  var hdr=el('div','header');
  hdr.innerHTML='<h1>Escuelas Deportivas</h1><button class="btn btn-sm" style="color:var(--text3);font-size:14px;padding:4px 8px;" id="schBack">✕</button>';
  app.appendChild(hdr);

  var content=el('div','content');
  content.innerHTML='<div style="text-align:center;margin-bottom:12px;"><img src="'+ESCUELAS_LOGO+'" style="height:70px;"></div>'+
    '<div class="section-title">'+(isCoord?'Todas las sedes':'Mi sede')+' ('+schools.length+')</div>';

  schools.forEach(function(sc){
    var card=el('div','card');
    card.style.cursor='pointer';
    var monitors=(sc.monitors||[]).filter(function(m){return m;}).join(', ');
    card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:700;font-size:14px;">'+sc.sede+'</div><div style="font-size:11px;color:var(--text3);">'+(monitors||'Sin monitores')+'</div><div style="font-size:10px;color:var(--text3);">'+(sc.kids||[]).length+' ninos/as</div></div><div style="font-size:22px;color:#e67e22;">→</div></div>';
    card.setAttribute('data-scid',sc.id);
    content.appendChild(card);
  });

  if(!schools.length){
    content.innerHTML+='<div class="card" style="text-align:center;color:var(--text3);padding:20px;">No hay sedes'+(isCoord?'. Crea la primera.':' asignadas.')+'</div>';
  }

  if(isCoord){
    var addBtn=el('button','btn btn-primary btn-block');
    addBtn.style.marginTop='10px';
    addBtn.textContent='+ Nueva sede';
    addBtn.id='addSchoolBtn';
    content.appendChild(addBtn);
  }

  app.appendChild(content);

  content.querySelectorAll('[data-scid]').forEach(function(card){
    card.onclick=function(){S.selSchool=card.getAttribute('data-scid');S.view='schooldetail';render();};
  });
  var backBtn=app.querySelector('#schBack');
  if(backBtn)backBtn.onclick=function(){logout();};
  var addBtn2=app.querySelector('#addSchoolBtn');
  if(addBtn2)addBtn2.onclick=function(){showNewSchoolModal();};
}

function renderSchoolDetail(app){
  var sc=(DB.schools||[]).find(function(x){return x.id===S.selSchool;});
  if(!sc){S.view='schoolslist';render();return;}
  var isCoord=(S.schoolsRole==='coord');

  var hdr=el('div','header');
  hdr.innerHTML='<button class="xbtn" id="scdBack" style="margin-right:6px;">←</button><h1>'+sc.sede+'</h1>'+(isCoord?'<button class="btn btn-sm" style="color:#fff;border:1px solid rgba(255,255,255,.3);font-size:10px;padding:4px 8px;" id="scdEdit">Editar</button>':'');
  app.appendChild(hdr);

  var content=el('div','content');
  var monitors=(sc.monitors||[]).filter(function(m){return m;}).join(', ')||'Sin monitores';
  content.innerHTML='<div class="card" style="padding:10px 14px;"><div style="font-size:11px;color:var(--text3);">Monitores</div><div style="font-weight:600;font-size:13px;">'+monitors+'</div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;"><div class="section-title" style="margin:0;">Ninos/as ('+(sc.kids||[]).length+')</div><button class="btn btn-primary btn-sm" id="addKidBtn">+ Anadir</button></div>';

  (sc.kids||[]).forEach(function(k){
    var card=el('div','card');
    var genderIcon=k.gender==='F'?'♀':'♂';
    var genderColor=k.gender==='F'?'#e91e63':'#2196F3';
    card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:600;font-size:13px;"><span style="color:'+genderColor+';font-weight:800;margin-right:4px;">'+genderIcon+'</span>'+k.name+'</div><div style="font-size:11px;color:var(--text3);">'+(k.birthYear||'')+' · '+(k.phone||'Sin telefono')+'</div>'+(k.obs?'<div style="font-size:10px;color:var(--text3);margin-top:2px;">'+k.obs+'</div>':'')+'</div><div style="display:flex;gap:4px;"><button class="btn btn-outline btn-sm" style="font-size:9px;" data-editkid="'+k.id+'">Editar</button><button class="btn btn-danger btn-sm" style="font-size:9px;padding:4px 6px;" data-delkid="'+k.id+'">X</button></div></div>';
    content.appendChild(card);
  });

  if(!(sc.kids||[]).length){
    content.innerHTML+='<div class="card" style="text-align:center;color:var(--text3);padding:16px;">Sin ninos/as registrados</div>';
  }

  app.appendChild(content);

  app.querySelector('#scdBack').onclick=function(){S.view='schoolslist';render();};
  var editBtn=app.querySelector('#scdEdit');
  if(editBtn)editBtn.onclick=function(){showNewSchoolModal(sc);};
  content.querySelector('#addKidBtn').onclick=function(){showKidModal(sc.id);};
  content.querySelectorAll('[data-editkid]').forEach(function(btn){
    btn.onclick=function(){showKidModal(sc.id,btn.dataset.editkid);};
  });
  content.querySelectorAll('[data-delkid]').forEach(function(btn){
    btn.onclick=async function(){
      if(!(await customConfirm('Eliminar este nino/a?')))return;
      var kidId=btn.dataset.delkid;
      sc.kids=sc.kids.filter(function(k){return k.id!==kidId;});
      saveDB(DB);render();toast('Eliminado');
      gsPost({action:'eliminarNino',id:kidId});
    };
  });
}

window.showNewSchoolModal=function(sc){
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>'+(sc?'Editar sede':'Nueva sede')+'</h3>'+
    '<div class="form-group"><label>Nombre de la sede</label><input id="scSede" value="'+(sc?sc.sede:'')+'"></div>'+
    '<div class="form-group"><label>Clave de acceso de esta sede</label><input id="scPwd" value="'+(sc?sc.password||'':'')+'" placeholder="Clave para los monitores"></div>'+
    '<div class="form-group"><label>Monitor 1</label><input id="scM1" value="'+(sc&&sc.monitors?sc.monitors[0]||'':'')+'"></div>'+
    '<div class="form-group"><label>Monitor 2</label><input id="scM2" value="'+(sc&&sc.monitors?sc.monitors[1]||'':'')+'"></div>'+
    '<div class="form-group"><label>Monitor 3</label><input id="scM3" value="'+(sc&&sc.monitors?sc.monitors[2]||'':'')+'"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary btn-block" id="scSave">Guardar</button><button class="btn btn-outline" id="scCancel">Cancelar</button></div>'+
    (sc?'<button class="btn btn-danger btn-block" style="margin-top:10px;" id="scDelete">Eliminar sede</button>':'')+
    '</div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#scCancel').onclick=function(){bg.remove();};
  bg.querySelector('#scSave').onclick=function(){
    var sede=$('#scSede',bg).value.trim();
    if(!sede){toast('Nombre obligatorio');return;}
    if(!sc&&(DB.schools||[]).some(function(x){return x.sede.toLowerCase()===sede.toLowerCase();})){toast('Ya existe una sede con ese nombre');return;}
    var pwd=$('#scPwd',bg).value.trim();
    var m1=$('#scM1',bg).value.trim(),m2=$('#scM2',bg).value.trim(),m3=$('#scM3',bg).value.trim();
    if(!DB.schools)DB.schools=[];
    var scObj;
    if(sc){sc.sede=sede;sc.password=pwd;sc.monitors=[m1,m2,m3];scObj=sc;}
    else{scObj={id:gid(),sede:sede,password:pwd,monitors:[m1,m2,m3],kids:[]};DB.schools.push(scObj);}
    saveDB(DB);bg.remove();render();toast(sc?'Sede actualizada':'Sede creada');
    gsPost({action:'guardarSede',id:scObj.id,sede:scObj.sede,password:scObj.password,monitor1:m1,monitor2:m2,monitor3:m3});
  };
  if(sc){
    bg.querySelector('#scDelete').onclick=async function(){
      if(!(await customConfirm('Eliminar sede '+sc.sede+' y todos sus datos?')))return;
      DB.schools=DB.schools.filter(function(x){return x.id!==sc.id;});
      saveDB(DB);bg.remove();S.view='schoolslist';render();toast('Sede eliminada');
      gsPost({action:'eliminarSede',id:sc.id});
    };
  }
};

window.showKidModal=function(scId,kidId){
  var sc=(DB.schools||[]).find(function(x){return x.id===scId;});
  var k=kidId?sc.kids.find(function(x){return x.id===kidId;}):null;
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>'+(k?'Editar':'Nuevo')+' nino/a</h3>'+
    '<div class="form-group"><label>Nombre y apellidos</label><input id="kName" value="'+(k?k.name:'')+'"></div>'+
    '<div class="form-group"><label>Genero</label><div style="display:flex;gap:8px;">'+
    '<label style="flex:1;display:flex;align-items:center;gap:4px;padding:8px;border:1px solid var(--line2);border-radius:6px;"><input type="radio" name="kGender" value="F" '+(k&&k.gender==='F'?'checked':'')+'> Nina (F)</label>'+
    '<label style="flex:1;display:flex;align-items:center;gap:4px;padding:8px;border:1px solid var(--line2);border-radius:6px;"><input type="radio" name="kGender" value="M" '+(!k||k.gender==='M'?'checked':'')+'> Nino (M)</label>'+

window.generateCoachesReport=function(){

  html+='.cinfo{font-size:11px;color:#555;margin-top:2px;}';
  html+='.cteams{font-size:11px;margin-top:6px;}';
  html+='.cteams span{display:inline-block;background:#e8f1fb;color:#1565C0;border-radius:10px;padding:2px 8px;margin:2px 4px 2px 0;}';
  html+='.footer{margin-top:20px;padding-top:8px;border-top:1px solid #ddd;font-size:9px;color:#999;text-align:center;}';
  html+='@media print{body{padding:0;}}';
  html+='</style></head><body>';
  html+='<h1>BB Baloncesto Badajoz — Listado de entrenadores</h1>';
  html+='<p style="color:#666;font-size:11px;">Generado el '+new Date().toLocaleDateString('es-ES')+' · '+coaches.length+' entrenadores</p>';

  coaches.forEach(function(c){
    var teamsHtml=(c.teamRoles||[]).map(function(tr){

function _tallaFieldHTML(g,current){

  }
  var opts='<option value="">— Sin elegir —</option>';
  TALLA_SCALE.forEach(function(s){
    opts+='<option value="'+s.code+'"'+(current===s.code?' selected':'')+'>'+s.code+' ('+s.cm+' cm)</option>';
  });
  return '<div class="form-group"><label style="font-size:10px;">'+g.label+'</label><select id="tg_'+g.key+'" style="padding:6px;font-size:12px;">'+opts+'</select></div>';

window.generateTallasReport=function(teamId,who,fmt){
  var t=DB.teams.find(function(x){return x.id===teamId;});
  if(!t)return;
  var isPlayer=who==='player';
  var garments=isPlayer?PLAYER_GARMENTS:COACH_GARMENTS;
  var rows=[];
  if(isPlayer){
    t.players.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(p){
      rows.push({label:'#'+p.dorsal+' '+p.name,tallas:p.tallas||{}});
    });
  } else {
    var cc=_coachesForTeam(t.id);
    [cc.c1,cc.c2].filter(function(x){return x;}).forEach(function(co){
      rows.push({label:co.name,tallas:co.tallas||{}});
    });
  }
  if(fmt==='pdf'){
    var html='<html><head><meta charset="UTF-8"><style>';
    html+='body{font-family:Arial,sans-serif;font-size:11px;color:#222;padding:16px;max-width:800px;margin:0 auto;}';
    html+='h1{font-size:17px;border-bottom:3px solid #1565C0;padding-bottom:6px;}';
    html+='table{border-collapse:collapse;width:100%;font-size:9px;}th,td{border:1px solid #ccc;padding:5px;text-align:center;}th{background:#1565C0;color:#fff;}';
    html+='.footer{margin-top:16px;padding-top:8px;border-top:1px solid #ddd;font-size:9px;color:#999;text-align:center;}';
    html+='</style></head><body>';
    html+='<h1>BB Baloncesto Badajoz — Tallas '+(isPlayer?'jugadoras':'entrenadores')+' — '+t.name+'</h1>';
    html+='<table><tr><th style="text-align:left;">'+(isPlayer?'Jugadora':'Entrenador/a')+'</th>';
    garments.forEach(function(g){html+='<th>'+g.label+'</th>';});
    html+='</tr>';
    rows.forEach(function(r){
      html+='<tr><td style="text-align:left;">'+r.label+'</td>';
      garments.forEach(function(g){html+='<td>'+(r.tallas[g.key]||'-')+'</td>';});
      html+='</tr>';
    });
    html+='</table>';
    html+='<div class="footer">BB Baloncesto Badajoz · Generado el '+new Date().toLocaleDateString('es-ES')+'<br><img src="'+SIGNATURE_IMG+'" style="height:22px;opacity:.7;margin-top:4px;"></div>';
    html+='</body></html>';
    var blob=new Blob([html],{type:'text/html'});
    var url=URL.createObjectURL(blob);
    var w=window.open(url,'_blank');
    if(w){w.onload=function(){setTimeout(function(){w.print();},300);};}
    else{var a=document.createElement('a');a.href=url;a.download='Tallas.html';a.click();}
  } else {
    (function ensureXLSX(cb){
      if(typeof XLSX!=='undefined'){cb();return;}
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=cb;document.head.appendChild(s);
    })(function(){
      var aoa=[[(isPlayer?'Jugadora':'Entrenador/a')].concat(garments.map(function(g){return g.label;}))];
      rows.forEach(function(r){
        aoa.push([r.label].concat(garments.map(function(g){return r.tallas[g.key]||'';})));
      });
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Tallas');
      XLSX.writeFile(wb,'Tallas_'+(isPlayer?'Jugadoras':'Entrenadores')+'_'+t.name.replace(/[^a-zA-Z0-9]/g,'_')+'.xlsx');
    });
  }
  toast('Informe generado');
};

// ═══ HISTÓRICO DE TEMPORADAS (solo lectura, solo Coordinadores) ═══
var _histCache=null;
var HIST_CODE_LABEL={'1':'Entrenó','1.0':'Entrenó','D':'Dobla','I':'Otro equipo','T':'Tecnif+Entreno','t':'Solo tecnif.','J':'Justificada','B':'Baja/lesión','E':'Enfermedad','C':'Clase','O':'No avisó','P':'Partido'};
var HIST_MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
async function _loadHistorico(){

    if(!res.ok)return null;

// Entrenadores del histórico: solo se muestran si existen en la hoja HistoricoEntrenadores (no se editan desde la app)
var _histCoaches=null;
async function _loadHistCoaches(){
  if(_histCoaches)return _histCoaches;
  var map={};
  try{

    ((res&&res.ok&&res.data&&res.data.historicoEntrenadores)||[]).forEach(function(r){
      map[String(r.temporada)+'|'+String(r.equipo)]={c1:r.entrenador1||'',c2:r.entrenador2||''};
    });
  }catch(e){}
  _histCoaches=map;
  return map;
}
function _histCoachOf(data,team){return (_histCoaches&&_histCoaches[data.season+'|'+team.name])||{c1:'',c2:''};}
function _histEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function _histNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function _histDorsal(p){return p.dorsal!=null&&p.dorsal!==''?Math.round(p.dorsal):'';}
function _histSortTeams(teams){return teams.slice().sort(function(a,b){return teamRank(a.name)-teamRank(b.name)||a.name.localeCompare(b.name);});}
function _histSortPlayers(arr){return arr.slice().sort(function(a,b){return(a.dorsal==null?999:a.dorsal)-(b.dorsal==null?999:b.dorsal);});}
function _histFmtMin(seg){
  seg=seg||0;
  var m=Math.floor(seg/60),s=seg%60;
  return m+':'+String(s).padStart(2,'0');
}
function _histPlayerStats(team,p){
  var entrenos=p.entrenosConEquipo||p.entrenosTotales||0;
  var entrenosClub=team.entrenosClubTotal||entrenos;
  var pct=p.pctJugador!==undefined?Math.round(p.pctJugador*10)/10:(entrenosClub>0?Math.round(entrenos/entrenosClub*1000)/10:0);
  return{
    entrenos:entrenos,entrenosClub:entrenosClub,noEntrena:p.noEntrena||0,pct:pct,partidos:p.partidos||0,
    minSeg:(p.minutosConEquipoSeg||0)+(p.minutosOtroEquipoSeg||0),minOtroSeg:p.minutosOtroEquipoSeg||0,
    pts:(p.puntosConEquipo||0)+(p.puntosOtroEquipo||0),ptsOtro:p.puntosOtroEquipo||0
  };
}
function _histTeamAvg(team){
  if(!team.players.length)return 0;
  return Math.round(team.players.reduce(function(a,p){return a+_histPlayerStats(team,p).pct;},0)/team.players.length);
}
// Emparejar nombres entre temporadas: el histórico trae nombre y dos apellidos
// ("ANTONIO CARRASCO MASA", "DE ASSIS VIERA, JOAO GABRIEL") y la app a veces solo
// nombre y un apellido ("ANTONIO CARRASCO"). Coinciden si todas las palabras del
// nombre más corto (mínimo 2) están en el más largo, sin tildes ni mayúsculas.
var HIST_STOP={de:1,del:1,la:1,las:1,los:1,da:1,do:1,dos:1,y:1,e:1};
function _histTokens(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w&&!HIST_STOP[w];});
}
function _histSame(a,b){
  var A=_histTokens(a),B=_histTokens(b);
  var small=A.length<=B.length?A:B,big=A.length<=B.length?B:A;
  if(small.length<2)return small.length===1&&big.length===1&&small[0]===big[0];
  return small.every(function(w){return big.indexOf(w)>=0;});
}
function _histSameDorsal(a,b){return a.dorsal!=null&&a.dorsal!==''&&b.dorsal!=null&&b.dorsal!==''&&Math.round(a.dorsal)===Math.round(b.dorsal);}
// Empareja por nombre; si hay varios candidatos con nombre parecido, o el nombre no
// coincide con nadie, el dorsal (que un jugador mantiene siempre en el club) sirve
// para confirmar o desempatar. r debe ser {name, dorsal}.
function _histFind(list,r){
  var byName=list.filter(function(p){return _histSame(p.name,r.name);});
  if(byName.length===1)return byName[0];
  if(byName.length>1){
    var conDorsal=byName.filter(function(p){return _histSameDorsal(p,r);});
    return conDorsal.length===1?conDorsal[0]:byName[0];
  }
  if(r.dorsal!=null&&r.dorsal!==''){
    var byDorsal=list.filter(function(p){return _histSameDorsal(p,r);});
    if(byDorsal.length===1){byDorsal[0]._histPorDorsal=true;return byDorsal[0];}
  }
  return null;
}
// Equipo de esta temporada equivalente: primero por nombre; si no hay, el que comparta más jugadores (mínimo 3)
function _histFindCurrentTeam(data,team){
  var k=_histNorm(team.name);
  var byName=(DB.teams||[]).find(function(t){return _histNorm(t.name)===k;});
  if(byName)return byName;
  // No usar equipos actuales que ya tienen su pareja por nombre en el histórico
  var histNames={};(data.teams||[]).forEach(function(t){histNames[_histNorm(t.name)]=true;});
  var best=null,bestN=0;
  (DB.teams||[]).forEach(function(t){
    if(histNames[_histNorm(t.name)])return;
    var cur=_nonLinkedPlayers(t);
    var n=team.players.filter(function(p){return _histFind(cur,p);}).length;
    if(n>bestN){bestN=n;best=t;}
  });
  return bestN>=3?best:null;
}
// Contraste con la temporada actual (solo si hay un equipo actual con el mismo nombre)
function _histContrast(data,team){
  var cur=_histFindCurrentTeam(data,team);
  if(!cur)return null;
  var antes=_histSortPlayers(team.players),ahora=_histSortPlayers(_nonLinkedPlayers(cur));
  function ahoraEn(p){
    var t=(DB.teams||[]).find(function(tt){return _histFind(_nonLinkedPlayers(tt),p);});
    return t?t.name:'';
  }
  function antesEn(p){
    var t=(data.teams||[]).find(function(tt){return _histFind(tt.players,p);});
    return t?t.name:'';
  }
  return{
    cur:cur,antes:antes,ahora:ahora,
    siguen:ahora.filter(function(p){return _histFind(antes,p);}),
    bajas:antes.filter(function(p){return !_histFind(ahora,p);}),
    altas:ahora.filter(function(p){return !_histFind(antes,p);}),
    ahoraEn:ahoraEn,antesEn:antesEn
  };
}

// ═══ PIRÁMIDE DE EDADES (comparativa histórico vs temporada actual) ═══
function _pyrNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function _pyrCategory(name){
  var n=_pyrNorm(name);
  // Senior/Nacional/Diputación/FEB son todos equipos "mayores" (edad adulta)
  if(n.indexOf('nacional')>=0||n.indexOf('diputac')>=0||n.indexOf('feb')>=0||n.indexOf('senior')>=0)return 'Mayores';
  // "Cadete Junior Femenino" es un equipo Cadete con jugadoras de 2 años, no Junior:
  // por eso Cadete se comprueba antes que Junior.
  if(n.indexOf('cadete')>=0)return 'Cadete';
  if(n.indexOf('junior')>=0)return 'Junior';
  if(n.indexOf('infantil')>=0)return 'Infantil';
  if(n.indexOf('mini')>=0)return 'Mini';
  if(n.indexOf('benjam')>=0)return 'Benjamín';
  return null;
}
// Equipos con erratas conocidas en el nombre (faltan letras) cuyo género real se sabe de antemano
var PYR_GENERO_FIJO={terceafeb:'M','tercerafeb':'M'};
function _pyrGender(name){
  var n=_pyrNorm(name);
  if(PYR_GENERO_FIJO[n.replace(/\s+/g,'')])return PYR_GENERO_FIJO[n.replace(/\s+/g,'')];
  if(/femenin/.test(n))return 'F';
  if(/masculin|maculin|masulin/.test(n))return 'M'; // tolera que falte la 's' o la 'c' (erratas vistas en el club)
  return 'X'; // equipo mixto o sin género reconocible en el nombre (p.ej. Benjamín este curso)
}
var PYR_ORDER=['Mayores','Junior','Cadete','Infantil','Mini','Benjamín'];
// Cuenta jugadores por categoría para una lista de equipos {name, players}, según el filtro F/M/todos.
// Los equipos mixtos (X) solo se cuentan en "todos".
function _pyrCounts(teams,filtro){
  var out={};PYR_ORDER.forEach(function(c){out[c]=0;});
  teams.forEach(function(t){
    var cat=_pyrCategory(t.name);
    if(!cat)return;
    var g=_pyrGender(t.name);
    if(filtro!=='todos'&&g!==filtro)return;
    out[cat]+=(t.players||[]).length;
  });
  return out;
}
function _pyrCurrentSeasonLabel(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
  var y0=m>=7?y:y-1;
  return y0+'-'+String(y0+1).slice(-2);
}
var PYR_FILTRO_LABEL={todos:'Todos',F:'Femenino',M:'Masculino'};
function generatePiramideReport(histData,filtro){
  var curTeams=(DB.teams||[]).map(function(t){return{name:t.name,players:_nonLinkedPlayers(t)};});
  var histTeams=(histData.teams||[]).map(function(t){return{name:t.name,players:t.players};});
  var cA=_pyrCounts(histTeams,filtro), cB=_pyrCounts(curTeams,filtro);
  var maxCount=Math.max(1,PYR_ORDER.reduce(function(m,c){return Math.max(m,cA[c],cB[c]);},0));
  var seasonA=histData.season||'2025-26', seasonB=_pyrCurrentSeasonLabel();
  var barMax=240,scale=barMax/maxCount;
  var titulo='Piramide_'+filtro+'_'+seasonB.replace(/[^0-9]+/g,'-');
  var html='<html><head><meta charset="UTF-8"><title>'+_histEsc(titulo)+'</title><style>'+HIST_REPORT_CSS+
    '.pyrwrap{display:flex;justify-content:center;gap:0;margin-top:10px;}'+
    '.pyrcol{flex:1;max-width:320px;}'+
    '.pyrhead{text-align:center;font-weight:700;font-size:14px;margin-bottom:10px;}'+
    '.pyrrow{margin-bottom:14px;}'+
    '.pyrcat{font-size:11px;color:#666;text-align:center;margin-bottom:4px;}'+
    '.pyrbar{height:26px;border-radius:4px;background:#185FA5;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;}'+
    '.pyrbar.amber{background:#BA7517;}'+
    '</style></head><body>';
  html+='<div style="text-align:center;"><img src="'+LOGO_URL+'" style="height:56px;" crossorigin="anonymous"><h1 style="border:none;margin:6px 0 0;">BB Baloncesto Badajoz</h1>';
  html+='<p style="color:#666;font-size:11px;">Pirámide de categorías por edad · '+PYR_FILTRO_LABEL[filtro]+' · Generado el '+new Date().toLocaleDateString('es-ES')+'</p></div>';
  var totalA=PYR_ORDER.reduce(function(s,c){return s+cA[c];},0);
  var totalB=PYR_ORDER.reduce(function(s,c){return s+cB[c];},0);
  var dif=totalB-totalA;
  html+='<div class="pyrwrap">';
  [[seasonA,cA,totalA],[seasonB,cB,totalB]].forEach(function(pair){
    html+='<div class="pyrcol"><div class="pyrhead">'+_histEsc(pair[0])+'</div>';
    PYR_ORDER.forEach(function(cat){
      var n=pair[1][cat],w=Math.max(n>0?28:0,Math.round(n*scale));
      html+='<div class="pyrrow"><div class="pyrcat">'+cat+'</div>'+
        (n>0?'<div class="pyrbar'+(cat==='Benjamín'?' amber':'')+'" style="width:'+w+'px;">'+n+'</div>':'<div class="pyrcat" style="font-size:10px;">— 0 —</div>')+
        '</div>';
    });
    html+='<div style="border-top:2px solid #185FA5;margin-top:6px;padding-top:8px;text-align:center;">'+
      '<div style="font-size:10px;color:#666;">Total jugadores</div>'+
      '<div style="font-size:22px;font-weight:800;color:#185FA5;">'+pair[2]+'</div></div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div style="text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid #ddd;">'+
    '<span style="font-size:12px;color:#666;">Diferencia total: </span>'+
    '<span style="font-size:16px;font-weight:800;color:'+(dif>0?'#2e7d32':dif<0?'#c62828':'#666')+';">'+(dif>0?'+':dif<0?'−':'')+Math.abs(dif)+'</span></div>';
  if(filtro!=='todos')html+='<p class="sub" style="text-align:center;">Se excluyen los equipos mixtos o sin género indicado en el nombre (cuentan solo en "Todos").</p>';
  html+=HIST_FOOTER()+'</body></html>';
  _histOpenReport(html,titulo);
}

window.showRecordatorios=async function(){

          '<span style="font-size:12px;">'+r.detalle+'</span>'+
          (r.enviadoTs?'<span style="font-size:9px;color:var(--gold);">Ya avisado el '+r.enviadoTs+' — sigue sin registrarse</span>':'')+

      btn.onclick=async function(){

        else{btn.disabled=false;btn.textContent='📤 WhatsApp';}

window.handleCoachPhoto=function(input,cid){
  var file=input.files[0];
  if(!file){toast('No se recibio la foto');return;}
  if(file.size>10000000){toast('Foto demasiado grande, usa galeria');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=300;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var min=Math.min(img.width,img.height);
      var sx=(img.width-min)/2,sy=(img.height-min)/2;
      ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
      var dataUrl=canvas.toDataURL('image/jpeg',0.9);
      var dataField=document.getElementById('coachPhotoData');
      if(dataField)dataField.value=dataUrl;
      var preview=document.getElementById('coachPhotoPreview');
      if(preview)preview.innerHTML='<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
      toast('Foto guardada');
      if(cid){
        var c=(DB.coaches||[]).find(function(x){return x.id===cid;});
        if(c){
          c.photo=dataUrl;
          saveDB(DB);
          gsPost({action:'subirFotoEntrenador',id:c.id,nombre:c.name,photo:dataUrl}).then(function(res){
            if(res.ok&&res.photoUrl){
              c.photo=res.photoUrl;saveDB(DB);
              if(preview)preview.innerHTML='<img src="'+res.photoUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
              toast('Foto subida a Drive');
            } else { toast('Guardada en el movil (no se pudo subir: '+(res.error||'sin respuesta')+')'); }
          }).catch(function(){ toast('Guardada en el movil (sin conexion para subir)'); });
        }
      }
    };
    img.onerror=function(){toast('Error al cargar la imagen');};
    img.src=e.target.result;
  };
  reader.onerror=function(){toast('Error al leer el archivo');};
  reader.readAsDataURL(file);
};

window.saveCoach=function(cid){
  var name=document.getElementById('cName').value.trim();
  if(!name){toast('Nombre obligatorio');return;}
  if(!cid&&(DB.coaches||[]).some(function(c){return c.name.toLowerCase()===name.toLowerCase();})){toast('Ya existe un entrenador con ese nombre');return;}
  var phone=document.getElementById('cPhone').value.trim();
  var email=document.getElementById('cEmail').value.trim();
  var password=document.getElementById('cPwd').value.trim();
  var photo=document.getElementById('coachPhotoData').value;
  var teamRoles=[];
  document.querySelectorAll('.coachTeamRole').forEach(function(sel){
    if(sel.value)teamRoles.push({teamId:sel.dataset.teamid,role:sel.value});
  });
  if(teamRoles.length>4){toast('Maximo 4 equipos');return;}
  if(!DB.coaches)DB.coaches=[];
  var savedCoach;
  if(cid){
    var c=DB.coaches.find(function(x){return x.id===cid;});
    if(c){c.name=name;c.phone=phone;c.email=email;c.photo=photo;c.teamRoles=teamRoles;c.teams=teamRoles.map(function(tr){return tr.teamId;});c.password=password;savedCoach=c;}
  } else {
    savedCoach={id:gid(),name:name,phone:phone,email:email,photo:photo,teamRoles:teamRoles,teams:teamRoles.map(function(tr){return tr.teamId;}),password:password};
    DB.coaches.push(savedCoach);
  }
  saveDB(DB);
  // Actualizar coachName visible en cada equipo (prioriza rol 1, luego 2, luego coord)
  DB.teams.forEach(function(t){
    var primary=null;
    ['1','2','coord'].some(function(role){
      var found=DB.coaches.find(function(c){return(c.teamRoles||[]).some(function(tr){return tr.teamId===t.id&&tr.role===role;});});
      if(found){primary=found;return true;}
      return false;
    });
    if(primary)t.coachName=primary.name;
  });
  saveDB(DB);
  var teamsStr=teamRoles.map(function(tr){return tr.teamId+':'+tr.role;}).join(',');
  gsPost({action:'guardarEntrenador',id:savedCoach.id,nombre:savedCoach.name,telefono:savedCoach.phone,email:savedCoach.email,password:savedCoach.password,teams:teamsStr}).then(function(res){
    console.log('Entrenador sincronizado:',res);
    // Si la foto todavia es local (data:) y no se ha subido a Drive, subirla ahora que el entrenador ya existe en la hoja
    if(savedCoach.photo&&savedCoach.photo.indexOf('data:')===0){
      gsPost({action:'subirFotoEntrenador',id:savedCoach.id,nombre:savedCoach.name,photo:savedCoach.photo}).then(function(res2){
        if(res2.ok&&res2.photoUrl){savedCoach.photo=res2.photoUrl;saveDB(DB);}
      });
    }
  });
  document.querySelector('.modal-bg').remove();
  renderCoachList(document.getElementById('app'));
  toast(cid?'Entrenador actualizado':'Entrenador anadido');
};

window.showRepairBalls=async function(){
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>🔧 Reparar balones de partidos</h3><div id="repairBody" style="max-height:65vh;overflow-y:auto;"><div style="text-align:center;color:var(--text3);padding:20px;">Sincronizando y comprobando...</div></div><button class="btn btn-outline btn-block" style="margin-top:10px;" id="repairClose">Cerrar</button></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#repairClose').onclick=function(){bg.remove();};
  try{await syncFromCloud();}catch(e){}
  if(!document.body.contains(bg))return;

  var faltantes=[]; // {teamId, teamName, date, playerId, playerName, dorsal}
  DB.teams.forEach(function(t){
    (t.games||[]).forEach(function(g){
      var date=normDate(g.date);
      (g.players||[]).forEach(function(gp){
        var cur=(t.trainingSessions[date]&&t.trainingSessions[date][gp.playerId])||'';
        if(!String(cur).split(',').includes('P')){
          var pl=t.players.find(function(x){return x.id===gp.playerId;});
          faltantes.push({teamId:t.id,teamName:t.name,date:date,playerId:gp.playerId,playerName:pl?pl.name:'?',dorsal:pl?pl.dorsal:''});
        }
      });
    });
    (g_teamLinkedPending(t)||[]).forEach(function(x){faltantes.push(x);});
  });

  var body=bg.querySelector('#repairBody');
  if(!faltantes.length){
    body.innerHTML='<div style="text-align:center;color:var(--green);padding:20px;">✓ Todos los partidos tienen su balón bien puesto — no hace falta reparar nada</div>';
    return;
  }
  var html='<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">Se han encontrado '+faltantes.length+' jugadora(s) que aparecen en un partido guardado pero a las que les falta el balón en su calendario de Asistencia — probablemente borrado por error con "Balones huérfanos" antes del último arreglo. Se van a restaurar.</div>';
  faltantes.forEach(function(f){
    html+='<div class="report-row"><span class="rlbl">'+f.playerName+' <span style="color:var(--text3);">('+f.teamName+')</span></span><span class="rval">'+normDate(f.date)+'</span></div>';
  });
  html+='<button class="btn btn-primary btn-block" style="margin-top:12px;" id="repairConfirm">Restaurar todos estos balones</button>';
  body.innerHTML=html;

  bg.querySelector('#repairConfirm').onclick=async function(){
    var btn=bg.querySelector('#repairConfirm');btn.disabled=true;btn.textContent='Reparando...';
    for(const f of faltantes){
      var t=DB.teams.find(function(x){return x.id===f.teamId;});
      if(!t)continue;
      if(!t.trainingSessions[f.date])t.trainingSessions[f.date]={};
      t.trainingSessions[f.date][f.playerId]='P';
      saveDB(DB);
      await syncAsistencia(f.date,t.id,f.playerId,f.playerName,f.dorsal,'P');
    }
    toast('✓ Balones restaurados');
    bg.remove();
    showRepairBalls();
  };
};
function g_teamLinkedPending(t){
  // Comprueba también a las jugadoras de "dobla" (Partidos Adicionales) de este equipo,
  // por si a alguna le hubieran borrado el balón por error de la misma manera.
  var out=[];
  (t.extraGames||[]).forEach(function(eg){
    var cur=(t.trainingSessions[normDate(eg.date)]&&t.trainingSessions[normDate(eg.date)][eg.playerId])||'';
    if(!String(cur).split(',').includes('P')){
      var pl=t.players.find(function(x){return x.id===eg.playerId;});
      out.push({teamId:t.id,teamName:t.name,date:normDate(eg.date),playerId:eg.playerId,playerName:pl?pl.name:'?',dorsal:pl?pl.dorsal:''});
    }
  });
  return out;
}

window.showOrphanFinder=async function(){
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>🧹 Balones huérfanos</h3><div id="orphanBody" style="max-height:65vh;overflow-y:auto;"><div style="text-align:center;color:var(--text3);padding:20px;">Sincronizando con la nube antes de comprobar...</div></div><button class="btn btn-outline btn-block" style="margin-top:10px;" id="orphanClose">Cerrar</button></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#orphanClose').onclick=function(){bg.remove();};

  // Importante: se sincroniza primero con la nube. Si se comprobara con datos del móvil
  // desactualizados (por ejemplo, justo después de importar un partido), un partido
  // recién creado podría no estar aún reflejado localmente, y sus jugadoras se marcarían
  // por error como "huérfanas" sin serlo.
  try{await syncFromCloud();}catch(e){/* si falla, se sigue con lo que haya en local */}
  if(!document.body.contains(bg))return; // el usuario cerró el aviso mientras sincronizaba

  var huerfanos=[]; // {kind, teamId, teamName, date, playerId, playerName, opponent, extraGameId}

  function tieneGameReal(sourceTeamName,date,opponent){
    var srcTeam=DB.teams.find(function(x){return _normTeamKey(x.name)===_normTeamKey(sourceTeamName);});
    if(!srcTeam)return false;
    return (srcTeam.games||[]).some(function(g){return normDate(g.date)===normDate(date)&&_normOpp(g.opponent)===_normOpp(opponent);});
  }

  // 1) Partidos Adicionales que en sí mismos no tienen un partido real detrás en el equipo
  //    de origen que dicen (ej: restos de pruebas antiguas con datos que ya no existen).
  DB.teams.forEach(function(t){
    (t.extraGames||[]).forEach(function(eg){
      if(!tieneGameReal(eg.team,eg.date,eg.opponent)){
        var pl=t.players.find(function(x){return x.id===eg.playerId;});
        huerfanos.push({kind:'extraGame',teamId:t.id,teamName:t.name,date:eg.date,playerId:eg.playerId,playerName:pl?pl.name:'?',opponent:eg.opponent,extraGameId:eg.id,sourceTeam:eg.team});
      }
    });
  });

  // 2) Balones (P) sueltos en el calendario sin ningún partido propio ni partido adicional detrás
  DB.teams.forEach(function(t){
    Object.keys(t.trainingSessions||{}).forEach(function(date){
      Object.keys(t.trainingSessions[date]).forEach(function(pid){
        var codes=String(t.trainingSessions[date][pid]||'').split(',').filter(function(x){return x;});
        if(codes.indexOf('P')<0)return; // solo revisamos el balón, que sí se puede verificar con seguridad
        var tieneJuegoPropio=(t.games||[]).some(function(g){return normDate(g.date)===date;});
        var tieneExtraGameValido=(t.extraGames||[]).some(function(eg){return eg.playerId===pid&&normDate(eg.date)===date&&tieneGameReal(eg.team,eg.date,eg.opponent);});
        if(!tieneJuegoPropio&&!tieneExtraGameValido){
          var pl=t.players.find(function(x){return x.id===pid;});
          huerfanos.push({kind:'ballMark',teamId:t.id,teamName:t.name,date:date,playerId:pid,playerName:pl?pl.name:'?'});
        }
      });
    });
  });

  var body=bg.querySelector('#orphanBody');
  if(!huerfanos.length){
    body.innerHTML='<div style="text-align:center;color:var(--green);padding:20px;">✓ No se ha encontrado ningún balón ni partido adicional huérfano en ningún equipo</div>';
    return;
  }
  var html='<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">Se han encontrado '+huerfanos.length+' elemento(s) sin un partido real que los respalde — probablemente restos de pruebas antiguas. Revisa y confirma el borrado.</div>';
  huerfanos.forEach(function(h,i){
    var detalle=h.kind==='extraGame'?
      ('Partido Adicional vs '+h.opponent+' con "'+h.sourceTeam+'" ('+normDate(h.date)+') — no existe ese partido en '+h.sourceTeam):
      ('Balón suelto en Asistencia ('+normDate(h.date)+')');
    html+='<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;">'+
      '<input type="checkbox" class="orphanCk" data-idx="'+i+'" checked>'+
      '<span>'+h.playerName+' <span style="color:var(--text3);">('+h.teamName+')</span><br><span style="color:var(--gold);font-size:10px;">'+detalle+'</span></span></label>';
  });
  html+='<button class="btn btn-danger btn-block" style="margin-top:12px;" id="orphanConfirm">Borrar lo marcado</button>';
  body.innerHTML=html;

  bg.querySelector('#orphanConfirm').onclick=async function(){
    var checks=bg.querySelectorAll('.orphanCk:checked');
    if(!checks.length){toast('No has marcado nada para borrar');return;}
    if(!(await customConfirm('¿Borrar '+checks.length+' elemento(s) huérfano(s)? Esto no se puede deshacer.')))return;
    var btn=bg.querySelector('#orphanConfirm');btn.disabled=true;btn.textContent='Borrando...';
    for(var i=0;i<checks.length;i++){
      var idx=parseInt(checks[i].getAttribute('data-idx'));
      var h=huerfanos[idx];
      var t=DB.teams.find(function(x){return x.id===h.teamId;});
      if(!t)continue;
      if(h.kind==='extraGame'){
        t.extraGames=(t.extraGames||[]).filter(function(x){return x.id!==h.extraGameId;});
        saveDB(DB);
        await syncEliminarPartidoExtra(h.extraGameId);
        var cur=(t.trainingSessions[normDate(h.date)]&&t.trainingSessions[normDate(h.date)][h.playerId])||'';
        if(cur==='P'){
          delete t.trainingSessions[normDate(h.date)][h.playerId];
          saveDB(DB);
          await syncAsistencia(normDate(h.date),t.id,h.playerId,h.playerName,'','');
        }
      } else if(t.trainingSessions[h.date]){
        delete t.trainingSessions[h.date][h.playerId];
        saveDB(DB);
        await syncAsistencia(h.date,t.id,h.playerId,h.playerName,'','');
      }
    }
    toast('✓ Balones huérfanos borrados');
    bg.remove();
    showOrphanFinder();
  };
};

  try{await syncFromCloud();}catch(e){/* si falla, se sigue con lo que haya en local */}
  if(!document.body.contains(bg))return;

  var grupos=[]; // {teamId, teamName, key, entries:[{eg}], playerName}
  DB.teams.forEach(function(t){
    var porClave={};
    (t.extraGames||[]).forEach(function(eg){
      var key=eg.playerId+'|'+normDate(eg.date)+'|'+_normOpp(eg.opponent);
      (porClave[key]=porClave[key]||[]).push(eg);
    });
    Object.keys(porClave).forEach(function(key){
      if(porClave[key].length>1){
        var pl=t.players.find(function(x){return x.id===porClave[key][0].playerId;});
        grupos.push({teamId:t.id,teamName:t.name,entries:porClave[key],playerName:pl?pl.name:'?'});
      }
    });
  });

  var body=bg.querySelector('#cleanupBody');
  if(!grupos.length){
    body.innerHTML='<div style="text-align:center;color:var(--green);padding:20px;">✓ No se han encontrado partidos adicionales duplicados en ningún equipo</div>';
    return;
  }

  var html='<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">Se han encontrado '+grupos.length+' grupo(s) con partidos adicionales duplicados (misma jugadora, misma fecha, mismo rival). Por defecto se deja marcada para conservar la primera entrada de cada grupo, y para borrar el resto — revisa y cambia lo que necesites antes de confirmar.</div>';
  grupos.forEach(function(grp,gi){
    html+='<div class="card" style="margin-bottom:10px;padding:10px;"><div style="font-weight:700;font-size:12px;margin-bottom:2px;">'+grp.playerName+' <span style="color:var(--text3);font-weight:400;">('+grp.teamName+')</span></div>';
    html+='<div style="font-size:10px;color:var(--text3);margin-bottom:6px;">vs '+grp.entries[0].opponent+' · '+normDate(grp.entries[0].date)+' · '+grp.entries.length+' copias</div>';
    grp.entries.forEach(function(eg,ei){
      html+='<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;">'+
        '<input type="checkbox" class="cleanupCk" data-g="'+gi+'" data-e="'+ei+'" '+(ei>0?'checked':'')+'>'+
        '<span>'+fmtTime(eg.minutes)+' · '+eg.points+' pts'+(ei===0?' <span style="color:var(--green);">(se conserva por defecto)</span>':' <span style="color:var(--red);">(se borra por defecto)</span>')+'</span></label>';
    });
    html+='</div>';
  });
  html+='<button class="btn btn-danger btn-block" id="cleanupConfirm">Borrar lo marcado</button>';
  body.innerHTML=html;

  bg.querySelector('#cleanupConfirm').onclick=async function(){
    var checks=bg.querySelectorAll('.cleanupCk:checked');
    if(!checks.length){toast('No has marcado nada para borrar');return;}
    if(!(await customConfirm('¿Borrar '+checks.length+' partido(s) adicional(es) duplicado(s)? Esto no se puede deshacer.')))return;
    var btn=bg.querySelector('#cleanupConfirm');btn.disabled=true;btn.textContent='Borrando...';
    for(var i=0;i<checks.length;i++){
      var gi=parseInt(checks[i].getAttribute('data-g')),ei=parseInt(checks[i].getAttribute('data-e'));
      var grp=grupos[gi],eg=grp.entries[ei];
      var t=DB.teams.find(function(x){return x.id===grp.teamId;});
      if(t){
        t.extraGames=t.extraGames.filter(function(x){return x.id!==eg.id;});
        saveDB(DB);
        await syncEliminarPartidoExtra(eg.id);
      }
    }
    toast('✓ Duplicados borrados');
    bg.remove();
    showCleanupDuplicates();
  };
};
