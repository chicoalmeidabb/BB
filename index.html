<style>
:root{
  --bg:#1E88E5;--bg2:#0d3f73;--bg3:#0f4a85;--bg4:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.2);--line2:rgba(255,255,255,.32);
  --text:#ffffff;--text2:rgba(255,255,255,.78);--text3:rgba(255,255,255,.6);
  --accent:#1565C0;--accent2:#1E88E5;--accent-dim:rgba(255,255,255,.85);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,.12);
  --gold:#f1c40f;--gold-dim:rgba(241,196,15,.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,.12);
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;width:100%;background:var(--bg3);color:var(--text);}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
option{background:var(--bg3);}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.header{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.header img{height:36px;}
.header h1{font-size:14px;font-weight:700;flex:1;color:var(--text);}
.header .badge{background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.header .xbtn{color:var(--text3);font-size:18px;padding:4px 8px;}

.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;padding:8px 2px 6px;text-align:center;font-size:9.5px;font-weight:500;color:var(--text3);transition:.15s;}
.tab.active{color:var(--accent);}
.tab svg{display:block;margin:0 auto 2px;width:20px;height:20px;}
.tab span{font-size:17px;display:block;margin-bottom:1px;}
.content{flex:1;padding:12px 14px 76px;overflow-y:auto;}.content.att-bg{background:#124d87;}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.kpi .val{font-size:28px;font-weight:800;color:var(--accent);}
.kpi .lbl{font-size:10px;color:var(--text3);margin-top:2px;}

.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.player-row:last-child{border:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.player-row .info{flex:1;min-width:0;}
.player-row .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-row .meta{font-size:11px;color:var(--text3);}
.player-row .stat{font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;}

.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-nav button{font-size:22px;padding:6px 10px;color:var(--accent);font-weight:700;}
.week-nav .label{font-size:13px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,36px);gap:1px;font-size:11px;overflow-x:auto;}
@media (max-width:400px){
  .cal-grid{grid-template-columns:minmax(92px,1fr) repeat(7,31px);}
  .cal-name{font-size:11px;min-width:92px;}
  .cal-name img,.cal-name .avatar{width:20px!important;height:20px!important;}
  .cal-cell{font-size:10px;padding:4px 1px;min-height:28px;}
}
.cal-head{text-align:center;font-weight:700;font-size:10px;color:var(--text3);padding:4px 0;cursor:pointer;border-radius:4px;transition:.12s;}
.cal-head.training-day{background:var(--accent);color:#fff;border-radius:4px;}
.cal-head.match-day{background:#e67e22!important;color:#fff!important;border-radius:4px;}
.cal-head:active{transform:scale(.92);}
.cal-head.weekend{color:var(--gold);}
.cal-head.festivo{color:var(--red);}
.cal-name{font-size:12px;font-weight:600;padding:8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:110px;}
.cal-cell{text-align:center;padding:5px 1px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;min-height:30px;display:flex;align-items:center;justify-content:center;}
.cal-cell:active{transform:scale(.9);}
.cal-cell[data-val="1"]{background:#27ae60;color:#fff;font-weight:800;}
.cal-cell[data-val="D"]{background:#2980ff;color:#fff;font-weight:800;}
.cal-cell[data-val="I"]{background:#9b59b6;color:#fff;font-weight:800;}
.cal-cell[data-val="T"]{background:#8e44ad;color:#fff;font-weight:800;}
.cal-cell[data-val="t"]{background:#c0392b;color:#fff;font-weight:800;}
.cal-cell[data-val="J"]{background:#1565C0;color:#fff;font-weight:800;}
.cal-cell[data-val="B"]{background:#e60000;color:#fff;font-weight:800;}
.cal-cell[data-val="E"]{background:#e67e22;color:#fff;font-weight:800;}
.cal-cell[data-val="C"]{background:#607d8b;color:#fff;font-weight:800;}
.cal-cell[data-val="O"]{background:#d32f2f;color:#fff;font-weight:800;}
.cal-cell[data-val="N"]{background:#607d8b;color:#fff;font-weight:800;}
.cal-cell[data-val="P"]{background:var(--accent);color:#fff;font-size:14px;font-weight:800;}

.code-picker{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--line);padding:6px 10px 8px;z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:none;}
.code-picker.active{display:block;}
.code-picker h4{font-size:9px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.code-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.code-btn{padding:6px 2px;border-radius:5px;font-weight:700;font-size:10px;text-align:center;border:1px solid var(--line);}
.code-btn[data-val="1"]{background:#27ae60;color:#fff;border-color:#27ae60;}
.code-btn[data-val="D"]{background:#2980ff;color:#fff;border-color:#2980ff;}
.code-btn[data-val="I"]{background:#9b59b6;color:#fff;border-color:#9b59b6;}
.code-btn[data-val="T"]{background:#8e44ad;color:#fff;border-color:#8e44ad;}
.code-btn[data-val="t"]{background:#c0392b;color:#fff;border-color:#c0392b;}
.code-btn[data-val="J"]{background:#1565C0;color:#fff;border-color:#1565C0;}
.code-btn[data-val="B"]{background:#e60000;color:#fff;border-color:#e60000;}
.code-btn[data-val="E"]{background:#e67e22;color:#fff;border-color:#e67e22;}
.code-btn[data-val="C"]{background:#607d8b;color:#fff;border-color:#607d8b;}
.code-btn[data-val="O"]{background:#d32f2f;color:#fff;border-color:#d32f2f;}
.code-btn[data-val="N"]{background:#607d8b;color:#fff;border-color:#607d8b;}
.code-btn[data-val="P"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.code-btn[data-val=""]{background:var(--bg3);color:var(--text3);}
.code-btn:active{transform:scale(.92);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{filter:brightness(.85);}
.btn-outline{border:1px solid var(--line2);color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 10px;font-size:12px;}

.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.stat-bar{margin-bottom:8px;}
.stat-bar .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.stat-bar .top .lbl{color:var(--text2);}
.stat-bar .top .val{font-weight:700;}
.stat-bar .track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.stat-bar .fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 16px 24px;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}

.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center;background:var(--bg2);}
.login-screen img{height:80px;margin-bottom:16px;}
.login-screen h2{font-size:18px;margin-bottom:4px;}
.login-screen p{color:var(--text3);font-size:12px;margin-bottom:24px;}

.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line);}
.report-row:last-child{border:none;}
.report-row .rlbl{color:var(--text2);}
.report-row .rval{font-weight:700;}

.import-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;cursor:pointer;}

.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:99;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hidden{display:none!important;}
</style>
</head>

      <p style="margin-bottom:4px;"><b>3. Toca el d\xEDa que has entrenado.</b> Se marca el d\xEDa y todas las jugadoras se ponen autom\xE1ticamente con "1" (entrenaron) \u2014 no hay que ir una por una.</p>
      <p style="margin-bottom:4px;"><b>4. Corrige solo las excepciones:</b> toca la casilla de quien no entren\xF3 normal (falt\xF3, se lesion\xF3...) y elige el c\xF3digo correcto \u2014 sustituye al "1" solo, sin borrar nada antes.</p>
      <p style="margin-bottom:4px;"><b>5. Si te equivocas de d\xEDa</b>, t\xF3calo de nuevo y confirma que quieres borrarlo entero; vuelve a marcarlo bien despu\xE9s.</p>
      <p style="margin-bottom:8px;"><b>6. Para un partido</b>, ve a "Partidos": si tienes el Excel oficial de la Federaci\xF3n, usa "\u{1F4E5} Importar Excel/CSV" (reconoce a tus jugadoras solo); si no, "+ Nuevo partido" a mano.</p>
      <p style="margin-bottom:0;">\u{1F4A1} Sin wifi en el pabell\xF3n no pasa nada: se guarda en el m\xF3vil y se sube solo en cuanto recuperas conexi\xF3n. El resto de esta pantalla explica todo con m\xE1s detalle si lo necesitas.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F4CB} ASISTENCIA</div>
      <p style="margin-bottom:8px;">Pantalla principal para registrar la asistencia diaria de cada jugadora. Arriba a la izquierda aparece la foto y nombre del entrenador/a del equipo.</p>
      <div style="font-weight:600;margin-bottom:4px;">Marcar un d\xEDa de entreno:</div>
      <p style="margin-bottom:8px;">Pulsa el <span style="color:var(--accent);font-weight:600;">d\xEDa de la semana</span> (L, M, X...). Se pone en azul y <b>autom\xE1ticamente pone "1" a todas las jugadoras</b> \u2014 solo tienes que corregir las que tengan una incidencia distinta (falta, lesi\xF3n...), tocando su casilla concreta.</p>
      <div style="font-weight:600;margin-bottom:4px;">Quitar un d\xEDa de entreno:</div>
      <p style="margin-bottom:8px;">Vuelve a pulsar el d\xEDa. Antes de borrar, la app sincroniza con la nube por si otro dispositivo acaba de guardar algo que t\xFA a\xFAn no ten\xEDas. Si hay datos, te pregunta "\xBFseguir?" antes de borrarlos.</p>
      <div style="font-weight:600;margin-bottom:4px;">D\xEDas de partido, en naranja:</div>
      <p style="margin-bottom:8px;">Cuando el equipo tiene un partido registrado (importado o creado a mano en Partidos), ese d\xEDa se pinta de <b>naranja</b> con un bal\xF3n \u{1F3C0}. Poner una "P" suelta en una sola jugadora no pinta el d\xEDa \u2014 solo cuenta un partido real dado de alta.</p>
      <div style="font-weight:600;margin-bottom:4px;">C\xF3digos de asistencia:</div>
      <div style="font-size:12px;line-height:2;">
        <span style="background:var(--green-dim);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;">1</span> Entren\xF3 con su equipo (c\xF3digo exclusivo, nunca se combina con otro)<br>
        <span style="background:var(--blue-dim);color:var(--blue);padding:2px 8px;border-radius:4px;font-weight:700;">D</span> Dobla: entrena con su equipo + otro equipo el mismo d\xEDa \u2192 cuenta como <b>2 entrenos</b><br>
        <span style="background:var(--purple-dim);color:var(--purple);padding:2px 8px;border-radius:4px;font-weight:700;">I</span> Entrena solo con otro equipo (no con el suyo) \u2192 cuenta <b>1 entreno para ella</b>, pero no para el % del equipo<br>
        <span style="background:rgba(142,68,173,.15);color:#8e44ad;padding:2px 8px;border-radius:4px;font-weight:700;">T</span> Tecnificaci\xF3n + entrenamiento<br>
        <span style="background:rgba(192,57,43,.12);color:#c0392b;padding:2px 8px;border-radius:4px;font-weight:700;">t</span> Solo tecnificaci\xF3n<br>
        <span style="background:rgba(21,101,192,.2);color:#2196F3;padding:2px 8px;border-radius:4px;font-weight:700;">J</span> Falta justificada (avis\xF3)<br>
        <span style="background:rgba(231,76,60,.25);color:#ff3b30;padding:2px 8px;border-radius:4px;font-weight:700;">B</span> Baja por lesi\xF3n<br>
        <span style="background:rgba(230,126,34,.12);color:#e67e22;padding:2px 8px;border-radius:4px;font-weight:700;">E</span> Enfermedad<br>
        <span style="background:rgba(149,165,166,.12);color:#95a5a6;padding:2px 8px;border-radius:4px;font-weight:700;">C</span> Falta por clase/estudios<br>
        <span style="background:rgba(231,76,60,.2);color:var(--red);padding:2px 8px;border-radius:4px;font-weight:700;">O</span> No avis\xF3<br>
        <span style="background:#607d8b;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;">N</span> No convocado: el entrenador decide no convocarlo a ese entreno (no es falta). <b>No baja su % de asistencia</b> ni cuenta como entreno hecho. Solo aparece en 1\xAA Nacional Masculina, Junior Masculino Negro y 3\xAA FEB. No es lo mismo que <b>J</b>, que es cuando el jugador avisa de que no viene.<br>
        <span style="background:var(--accent-dim);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:700;">\u{1F3C0}</span> Partido jugado
      </div>
      <p style="margin-top:8px;">No puedes marcar como entrenado un d\xEDa futuro.</p>
      <p style="margin-top:8px;"><b>\u{1F512} Semanas cerradas:</b> los entrenadores pueden cambiar la asistencia de la <b>semana en curso</b> (de lunes a domingo) y de los <b>3 \xFAltimos entrenamientos</b> anteriores a hoy (aunque sean de la semana pasada). Lo anterior se cambia con una <b>clave temporal</b> (la genera el coordinador para tu equipo y abre la semana anterior durante 24 horas) o con la <b>clave del coordinador</b> (la Clave de Restauraci\xF3n de Botiqu\xEDn): al tocar una casilla de una semana cerrada la app la pide, y el desbloqueo dura mientras se est\xE1 en la pantalla de Asistencia. <b>Excepci\xF3n:</b> si en la <b>semana anterior</b> el equipo no marc\xF3 ninguna asistencia, el entrenador puede rellenarla sin clave. Los coordinadores no tienen ning\xFAn bloqueo.</p>
    </div>

    <div class="card" style="border:1.5px solid #2e86de;">
      <div style="font-weight:700;font-size:15px;color:#2e86de;margin-bottom:8px;">\u{1F4C5} CALENDARIOS DE PARTIDOS</div>
      <p style="margin-bottom:8px;">Solo para coordinadores: Coordinadores \u2192 <b>\u{1F4C5} Calendarios (partidos)</b>.</p>
      <p style="margin-bottom:4px;"><b>1.</b> Elige el equipo y pulsa <b>\u2B06 Subir calendario</b>.</p>
      <p style="margin-bottom:4px;"><b>2.</b> Pon el nombre de la fase (Fase 1, Fase 2\u2026) y c\xF3mo aparece tu equipo en el archivo (por ejemplo "Badajoz"). Elige el PDF de la FEB, el CSV o el Excel, o pega el texto.</p>
      <p style="margin-bottom:4px;"><b>3.</b> La app se queda <b>solo con los partidos de tu equipo</b> y descarta el resto. Revisa la lista y pulsa Guardar.</p>
      <p style="margin-bottom:4px;"><b>4.</b> Toca un partido para cambiar la fecha, la hora, el pabell\xF3n o el tipo (Liga, Copa, Amistoso, Otro), o para eliminarlo.</p>
      <p style="margin-bottom:4px;"><b>Si cambian las fechas:</b> sube el archivo nuevo con el mismo nombre de fase y la app te ense\xF1a qu\xE9 ha cambiado antes de guardar.</p>
      <p style="margin-bottom:4px;"><b>Segunda fase:</b> sube otro archivo con otro nombre de fase (por ejemplo "Fase 2") y se guardan las dos.</p>
      <p style="margin-bottom:4px;">Los partidos que ya tienen datos en la app salen marcados con \u2705 registrado.</p>
      <p><b>Entrenadores:</b> al entrar con su clave ven en Inicio los pr\xF3ximos partidos de su equipo y el bot\xF3n <b>Ver calendario</b> (solo para ver, no pueden cambiarlo).</p>
    </div>

    <div class="card" style="border:1.5px solid #4aa3ff;">
      <div style="font-weight:700;font-size:15px;color:#4aa3ff;margin-bottom:8px;">\u{1F3C0} 1\xAA NACIONAL MASCULINA Y 3\xAA FEB: JUGADORES QUE ENTRENAN CON LOS DOS</div>
      <p style="margin-bottom:8px;">Esta regla es <b>solo</b> para 1\xAA Nacional Masculina y 3\xAA FEB. En el resto de equipos (infantil, cadete, junior, femeninos\u2026) todo sigue igual: un jugador puede entrenar y jugar con un equipo superior cuando su entrenador quiera, sin l\xEDmite ni aviso.</p>
      <div style="font-weight:600;margin-bottom:4px;">1. Marcar con qui\xE9n entrena habitualmente</div>
      <p style="margin-bottom:8px;">En 1\xAA Nacional Masculina \u2192 Plantilla \u2192 toca al jugador \u2192 desplegable <b>"\xBFCon qui\xE9n entrena habitualmente?"</b> \u2192 elige <b>"Con 3\xAA FEB"</b> \u2192 Guardar. Ver\xE1s una etiqueta azul <b>3\xAA FEB</b> junto a su nombre en Asistencia. Si entrena casi siempre con su equipo, se deja en "Con su equipo" (no hay que tocar nada).</p>
      <div style="font-weight:600;margin-bottom:4px;">2. Qu\xE9 marcar en la asistencia</div>
      <p style="margin-bottom:4px;"><b>Entren\xF3 solo con 3\xAA FEB:</b> en 1\xAA Nacional va una <b>I</b> (otro equipo). La pone sola la app cuando el entrenador de 3\xAA FEB lo marca, si en 1\xAA Nacional no hay nada puesto ese d\xEDa. <b>No hace falta que el entrenador de 1\xAA Nacional haga nada.</b></p>
      <p style="margin-bottom:4px;"><b>Entren\xF3 con los dos equipos el mismo d\xEDa:</b> en 1\xAA Nacional va una <b>D</b> (dobla). Cuenta como 2 entrenos.</p>
      <p style="margin-bottom:8px;"><b>Entren\xF3 solo con 1\xAA Nacional:</b> va un <b>1</b>. No pongas un 1 si entren\xF3 solo con 3\xAA FEB: si ya hay un 1, la app no lo cambia sola; hay que cambiarlo a <b>I</b> o borrarlo.</p>
      <p style="margin-bottom:8px;">La <b>I</b> suma un entreno al jugador pero <b>no baja ni sube el % de asistencia del equipo</b>, y no genera recordatorios de "entreno sin marcar". As\xED 1\xAA Nacional no sale perjudicado.</p>
      <div style="font-weight:600;margin-bottom:4px;">3. L\xEDmite de 6 partidos con 3\xAA FEB</div>
      <p style="margin-bottom:4px;">Cuando un jugador de 1\xAA Nacional juega con 3\xAA FEB, se apunta en el partido de 3\xAA FEB con <b>"+ Jugador/a de otro equipo (dobla)"</b>. La app cuenta solo esos partidos: lo ver\xE1s en su ficha y en la plantilla como <b>"partidos con 3\xAA FEB: 4/6"</b>.</p>
      <p style="margin-bottom:4px;">\u{1F7E0} En el partido 5 avisa: <b>le queda 1</b>.</p>
      <p style="margin-bottom:4px;">\u{1F534} En el partido 6 avisa: <b>ya no puede jugar con 1\xAA Nacional</b>.</p>
      <p style="margin-bottom:8px;">Si despu\xE9s intentas guardar un partido de 1\xAA Nacional con ese jugador, la app te pregunta antes si quieres guardarlo igualmente. Un partido se cuenta una sola vez (por fecha y rival), aunque se edite.</p>
      <p style="margin-bottom:8px;">\u{1F6AB} Cuando un jugador llega a 6, aparece en <b>rojo</b> "NO PUEDE JUGAR CON 1\xAA NACIONAL" en la plantilla, en Asistencia y en la lista de jugadores al crear un partido de 1\xAA Nacional.</p>
      <p style="margin-bottom:8px;"><b>Panel del coordinador:</b> Men\xFA de Coordinadores \u2192 Informes \u2192 <b>\u{1F3C0} L\xEDmite 3\xAA FEB (6 partidos)</b>. Muestra a todos los jugadores de 1\xAA Nacional con partidos con 3\xAA FEB (4/6, 5/6, 6/6...). Mira este panel antes de cada jornada.</p>
      <p style="margin-bottom:8px;"><b>Solo cuentan los partidos de Liga.</b> Cada partido tiene un <b>Tipo de partido</b>: Liga, Copa, Amistoso u Otro. Al crear o editar un partido se elige en el desplegable. En un partido importado del acta (\u{1F512}) tambi\xE9n se puede cambiar el tipo: \xE1brelo, elige el tipo y pulsa Guardar. <b>Los partidos que ya tienes guardados est\xE1n como Liga</b>: si alguno es de Copa o amistoso, c\xE1mbialo, o se contar\xE1 de m\xE1s. Un partido que no es de Liga se ve con una etiqueta morada en la lista.</p>
      <p style="font-size:11px;color:var(--text3);">Importante: para que cuente, el jugador tiene que aparecer en el partido de 3\xAA FEB con minutos o puntos, y el partido de 3\xAA FEB tiene que estar registrado en la app. Si se registra tarde, el contador va por detr\xE1s.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F465} PLANTILLA</div>
      <p style="margin-bottom:8px;">Lista de jugadoras del equipo, con el entrenador/a y su foto arriba.</p>
      <div style="font-weight:600;margin-bottom:4px;">A\xF1adir jugadora:</div>
      <p style="margin-bottom:8px;">"+ A\xF1adir" \u2192 nombre, dorsal, a\xF1o de nacimiento (tel\xE9fono/email opcionales). Si el nombre ya existe en otro equipo del club, te avisa y puedes a\xF1adirla como <b>vinculada</b> (misma jugadora, mismos datos en los dos equipos; en su equipo principal se ve en qu\xE9 equipos est\xE1 vinculada). En Benjam\xEDn y Mini Blanco, cada jugador lleva un campo <b>F / M</b> por si el equipo es mixto.</p>
      <div style="font-weight:600;margin-bottom:4px;">Contacto de responsables:</div>
      <p style="margin-bottom:8px;">En la ficha de cada jugadora hay un bloque con Responsable 1 y Responsable 2 (nombre, tel\xE9fono, email de cada uno). En equipos Senior se puede dejar vac\xEDo, ya que el contacto es la propia jugadora.</p>
      <div style="font-weight:600;margin-bottom:4px;">Foto:</div>
      <p style="margin-bottom:8px;">Pulsa el recuadro de la foto \u2192 C\xE1mara o Galer\xEDa.</p>
      <p>Tambi\xE9n puedes escribir <b>Observaciones</b> libres sobre cada jugadora.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F3C0} PARTIDOS</div>
      <p style="margin-bottom:8px;">Registra los partidos del equipo, con minutos y puntos por jugadora.</p>
      <div style="font-weight:600;margin-bottom:4px;">Crear a mano:</div>
      <p style="margin-bottom:8px;">"+ Nuevo partido" \u2192 fecha, rival, puntos del rival, y el tiempo de cada jugadora como <b>MMSS</b> (ej: 1530 = 15 min 30 seg). Hay un bot\xF3n "+ Jugador/a de otro equipo (dobla)" que ofrece cualquier equipo de tu misma secci\xF3n, por debajo o por encima en la categor\xEDa (nunca femenino si eres masculino, ni al rev\xE9s): un jugador puede doblar con cualquier equipo superior, no solo con el siguiente.</p>
      <div style="font-weight:600;margin-bottom:4px;">Importar el acta de la Federaci\xF3n:</div>
      <p style="margin-bottom:8px;">"\u{1F4E5} Importar Excel/CSV" \u2192 sube el Excel del acta. La app reconoce a tus jugadoras <b>por el nombre</b> (nunca por el n\xFAmero del acta, que es propio de la Federaci\xF3n y no coincide con el dorsal del club). Tienes que elegir t\xFA la fecha real del partido \u2014 no se rellena sola.</p>
      <div style="font-weight:600;margin-bottom:4px;">Jugadoras del acta que no son de tu plantilla:</div>
      <p style="margin-bottom:8px;">Nunca se asignan solas. Para cada una, eliges t\xFA de un desplegable a qu\xE9 equipo pertenece \u2014 aparecen todos los equipos de su misma secci\xF3n (masculino o femenino, nunca se cruzan), tanto por debajo como por encima en la categor\xEDa, porque un jugador puede doblar con cualquier equipo superior, no solo con el siguiente escal\xF3n (ej: un jugador de Cadete puede aparecer en el acta de Junior, de 1\xAA Nacional o de Tercera FEB) \u2014 y despu\xE9s a qu\xE9 jugadora concreta de ese equipo corresponde. Si la dejas sin asignar, no se importa. Al confirmar, se le crea un <b>Partido Adicional</b> en su equipo real con el bal\xF3n puesto ese d\xEDa.</p>
      <div style="font-weight:600;margin-bottom:4px;">Un partido importado no se puede editar:</div>
      <p style="margin-bottom:8px;">Una vez importado desde un Excel, el partido queda <b>bloqueado</b> \u2014 el acta es la que es. Al abrirlo solo se puede consultar (\u{1F512}) o borrarlo entero para reimportarlo si algo estuviera mal. Los partidos creados a mano ("+ Nuevo partido", sin Excel) s\xED se pueden editar siempre, porque ah\xED no hay ning\xFAn documento oficial detr\xE1s.</p>
      <div style="font-weight:600;margin-bottom:4px;">Marcador del partido:</div>
      <p style="margin-bottom:8px;">Arriba se ven los dos resultados (tu equipo y el rival) \u2014 el de tu equipo ya incluye los puntos de quien dobl\xF3 desde otro equipo.</p>
      <div style="font-weight:600;margin-bottom:4px;">No se puede repetir un partido:</div>
      <p>Si ya existe un partido contra ese rival en esa fecha, la app no te deja importarlo/crearlo otra vez \u2014 hay que borrar el anterior primero si quieres sustituirlo.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u2795 P.ADICIONAL</div>
      <p style="margin-bottom:8px;">Partidos que juegan tus jugadoras <b>con otros equipos</b> del club (categor\xEDa superior, selecci\xF3n...). Normalmente se rellenan solos al importar el acta del otro equipo, pero tambi\xE9n puedes a\xF1adirlos a mano.</p>
      <p>En la ficha de cada jugadora se ven separados: partidos "CON SU EQUIPO" y "CON OTRO EQUIPO", cada uno con sus minutos y puntos.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F4CA} INFORMES</div>
      <p style="margin-bottom:8px;">Tres niveles: <b>Individual</b> (una jugadora), <b>Equipo</b> (estad\xEDsticas de toda la plantilla) y <b>Club</b> (comparativa de todos los equipos). Se exportan en \u{1F4C4} PDF o \u{1F4CA} Excel.</p>
      <div style="font-weight:600;margin-bottom:4px;">Informe de equipo:</div>
      <p style="margin-bottom:8px;">Por jugadora: entrenamientos, partidos, minutos, puntos, tiros de 3/2/1, rebotes y lesiones. El % de asistencia solo se muestra como media del equipo arriba del todo, no fila por fila.</p>
      <div style="font-weight:600;margin-bottom:4px;">Informe individual:</div>
      <p>Incluye sus datos de partidos y, al final, un desglose de cu\xE1ntas veces se ha marcado cada incidencia de asistencia (1, D, I, J, B, E, C, O...).</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F455} TALLAS Y EQUIPACI\xD3N</div>
      <p style="margin-bottom:8px;">Aparte de los informes deportivos (Coordinadores \u2192 \u{1F455} Tallas y equipaci\xF3n). Gestiona tallas de jugadoras y entrenadores: camiseta, pantal\xF3n, cubre, ch\xE1ndal, mochila, calcetines / pantal\xF3n y chaqueta de ch\xE1ndal, polo, sudadera. Para vaciar un campo, elige "\u2014 Sin elegir \u2014" en el desplegable y guarda.</p>
      <div style="font-weight:600;margin-bottom:4px;">Tres formas de verlo:</div>
      <p style="margin-bottom:8px;"><b>Individual</b>: eliges equipo y persona, para consultar o editar una a una.<br><b>Informe por equipo</b>: PDF/Excel de un equipo completo, ordenado por nombre \u2014 tambi\xE9n genera una plantilla en blanco para mandar a las familias por WhatsApp o email.<br><b>Informe de todo el club</b>: PDF con todos los equipos seguidos (por equipo, y dentro de cada uno por nombre), y Excel con <b>una pesta\xF1a por equipo</b>.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F4C5} HORARIOS</div>
      <p style="margin-bottom:8px;">Se rellena directamente en Ajustes del equipo (d\xEDa, hora de inicio/fin y pabell\xF3n) \u2014 no hace falta configurarlo dos veces. Aqu\xED se ve el horario de tu equipo, y debajo el cuadro conjunto de todos los equipos que comparten pabell\xF3n, generado autom\xE1ticamente.</p>
      <p>Bot\xF3n <b>"\u{1F4E4} Compartir imagen"</b> para enviar el horario de un pabell\xF3n (o el general) directamente por WhatsApp o email.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F4E4} FICHA WHATSAPP / EMAIL</div>
      <p>Desde la ficha de cada jugadora, "\u{1F4E4} WhatsApp" o "\u{1F4E7} Email" genera una imagen con su calendario de temporada y estad\xEDsticas, y abre el selector para compartir directamente.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u2699\uFE0F COORDINADORES</div>
      <p style="margin-bottom:8px;">Panel con todo lo de gesti\xF3n general del club, organizado en grupos:</p>
      <p style="margin-bottom:4px;"><b>Equipos:</b> gestionar equipos, crear equipo nuevo, horarios de todos los equipos con PDF para compartir.</p>
      <p style="margin-bottom:4px;"><b>Entrenadores:</b> gestionar entrenadores (nombre, tel\xE9fono, email, foto, clave personal y hasta varios equipos asignados) y Recordatorios de asistencia.</p>
      <p style="margin-bottom:4px;"><b>Informes:</b> informes por equipo, Hist\xF3rico 2025-26 y Tallas y equipaci\xF3n (por separado, ver m\xE1s abajo).</p>
      <p style="margin-bottom:8px;"><b>Otros:</b> Escuelas y \u{1FA79} Botiqu\xEDn (ver m\xE1s abajo).</p>
      <div style="font-weight:600;margin-bottom:4px;">Entrenadores y equipos, unificado:</div>
      <p style="margin-bottom:8px;">Cada entrenador se da de alta <b>una sola vez</b> en Entrenadores, con su propia clave \u2014 esa misma clave le sirve para todos los equipos que tenga asignados. Al crear o modificar un equipo, el entrenador se elige de una lista desplegable de los ya dados de alta, en vez de escribirlo a mano.</p>
      <div style="font-weight:600;margin-bottom:4px;">\u{1F4AC} Mensaje al entrenador:</div>
      <p style="margin-bottom:8px;">Desde Gestionar equipos, bot\xF3n \u{1F4AC} en cada equipo: escribe un mensaje corto que ver\xE1 el entrenador la pr\xF3xima vez que entre. \xC9l puede marcarlo como le\xEDdo/borrarlo, pero queda guardado en el historial para el coordinador.</p>
      <div style="font-weight:600;margin-bottom:4px;">\u{1F514} Recordatorios de asistencia:</div>
      <p style="margin-bottom:8px;">Si un equipo acumula <b>2 o m\xE1s entrenos sin registrar</b> (seg\xFAn su horario), sale un recordatorio por cada uno. Se revisa cada d\xEDa a las 9:00 (con un email resumen al coordinador) y tambi\xE9n cada vez que se abre esta pantalla. Desde aqu\xED se decide, l\xEDnea a l\xEDnea, si avisar al entrenador por email o WhatsApp o descartarlo; si lo descartas, ese d\xEDa no vuelve a salir. Nunca se avisa autom\xE1ticamente al entrenador. Cada aviso enviado se cuenta en <b>\u{1F4CB} Veces recordado por equipo</b>.</p>
      <div style="font-weight:600;margin-bottom:4px;">\u{1F4DC} Hist\xF3rico de temporadas:</div>
      <p>Consulta de temporadas anteriores: equipo \u2192 jugadora \u2192 partidos, minutos, puntos y % de asistencia. Dos pesta\xF1as: <b>Por equipo</b> (\u{1F4C4} informe de cada equipo con todos sus jugadores) y <b>Todo el club</b>. Al final de cada equipo sale el contraste con esta temporada: antes, ahora, altas y bajas.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1FA79} BOTIQU\xCDN</div>
      <p style="margin-bottom:8px;">Herramientas puntuales, que no se usan en el d\xEDa a d\xEDa \u2014 por eso est\xE1n apartadas del men\xFA principal de Coordinadores, y protegidas con su propia clave.</p>
      <div style="font-weight:600;margin-bottom:4px;">\u{1F512} Acceso protegido:</div>
      <p style="margin-bottom:8px;">Para entrar hace falta la <b>Clave de Restauraci\xF3n</b> (distinta de la clave de Coordinadores) \u2014 as\xED solo la persona que la conoce puede entrar, aunque varios coordinadores compartan la clave normal. La primera vez que se entra, si todav\xEDa no hay clave puesta, se deja pasar una vez para configurarla.</p>
      <div style="font-weight:600;margin-bottom:4px;">Claves y avisos:</div>
      <p style="margin-bottom:8px;">Cambiar la clave de Coordinadores, de Coordinador de Escuelas, de Directiva, y el email al que llegan los avisos de Recordatorios.</p>
      <div style="font-weight:600;margin-bottom:4px;">\u{1F5C4}\uFE0F Restaurar backup:</div>
      <p style="margin-bottom:8px;">Cada noche se guarda una copia autom\xE1tica de todos los datos del club, con rotaci\xF3n de 7 d\xEDas (una por cada d\xEDa de la semana). Al restaurar se vuelve a pedir la Clave de Restauraci\xF3n como confirmaci\xF3n extra, dado lo destructiva que es esta acci\xF3n. Despu\xE9s eliges el d\xEDa (solo se pueden elegir los que tengan copia disponible) y si quieres restaurar todo el club o solo un equipo. <b>Importante: es una sustituci\xF3n completa</b>, no se mezcla nada \u2014 todo lo guardado despu\xE9s de esa copia, en ese \xE1mbito, desaparece.</p>
      <div style="font-weight:600;margin-bottom:4px;">Limpieza de datos:</div>
      <p style="margin-bottom:8px;">"Buscar balones hu\xE9rfanos", "Limpiar Partidos Adicionales duplicados" y "Reparar balones de partidos" \u2014 herramientas de mantenimiento por si alg\xFAn dato queda mal tras una prueba o un error de conexi\xF3n. No hace falta usarlas en el uso normal.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F3EB} ESCUELAS</div>
      <p>Gesti\xF3n de las escuelas deportivas del club (sedes, monitores y alumnado), separada de los equipos federados. Cada sede tiene su propia clave de acceso para el monitor.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F441} DIRECTIVA</div>
      <p>Acceso de solo consulta. Al entrar tiene dos botones: <b>Ver equipos</b> y el <b>Men\xFA de Coordinadores (solo consulta)</b>, con todo lo de Coordinadores <b>salvo el Botiqu\xEDn</b> (y sin \xABCrear equipo\xBB). Puede ver equipos, jugadoras, asistencia, partidos, calendarios, entrenadores, escuelas y sacar todos los informes, pero <b>no puede guardar, editar, borrar ni enviar nada</b>: si toca algo por error, sale \xAB\u{1F512} Solo lectura\xBB y no cambia nada.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">\u{1F504} SINCRONIZACI\xD3N Y SESI\xD3N</div>
      <p style="margin-bottom:8px;">Todo se guarda en Google Sheets. Cualquier persona con la clave ve los mismos datos desde cualquier dispositivo.</p>
      <div style="font-weight:600;margin-bottom:4px;">Sin conexi\xF3n:</div>
      <p style="margin-bottom:8px;">Puedes seguir marcando asistencia sin internet \u2014 se guarda en el m\xF3vil, y en cuanto recupera conexi\xF3n se sube solo a la nube (ver\xE1s un aviso "\u23F3 cambios sin subir" mientras tanto). Toca el aviso para ver el detalle y forzar un reintento. Si algo falla repetidamente por un motivo que no es de conexi\xF3n, te lo dice claramente en vez de reintentar en silencio para siempre.</p>
      <div style="font-weight:600;margin-bottom:4px;">No hace falta poner la clave cada vez:</div>
      <p style="margin-bottom:8px;">Cada dispositivo recuerda la \xFAltima clave usada para cada acceso \u2014 solo se vuelve a pedir si cambias de clave o borras los datos de la app.</p>
      <div style="font-weight:600;margin-bottom:4px;">Aviso de versi\xF3n nueva:</div>
      <p>Si sale un cartel naranja arriba diciendo que hay una versi\xF3n nueva, pulsa "Recargar" cuando te venga bien.</p>
    </div>

      BB Baloncesto Badajoz \xB7 v${APP_VERSION}<br><img src="${SIGNATURE_IMG}" style="height:28px;opacity:.6;margin-top:6px;">
    </div>
