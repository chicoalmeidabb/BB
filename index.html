<style>
:root{
  --bg:#1E88E5;--bg2:#0d3f73;--bg3:#0f4a85;--bg4:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.2);--line2:rgba(255,255,255,.32);
  --text:#ffffff;--text2:rgba(255,255,255,.78);--text3:rgba(255,255,255,.6);
  --accent:#1565C0;--accent2:#1E88E5;--accent-dim:rgba(255,255,255,.85);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,.12);
  --gold:#f1c40f;--gold-dim:rgba(241,196,15,.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,.12);
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;width:100%;background:var(--bg3);color:var(--text);}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
option{background:var(--bg3);}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.header{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.header img{height:36px;}
.header h1{font-size:14px;font-weight:700;flex:1;color:var(--text);}
.header .badge{background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.header .xbtn{color:var(--text3);font-size:18px;padding:4px 8px;}

.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;padding:8px 2px 6px;text-align:center;font-size:9.5px;font-weight:500;color:var(--text3);transition:.15s;}
.tab.active{color:var(--accent);}
.tab svg{display:block;margin:0 auto 2px;width:20px;height:20px;}
.tab span{font-size:17px;display:block;margin-bottom:1px;}
.content{flex:1;padding:12px 14px 76px;overflow-y:auto;}.content.att-bg{background:#124d87;}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.kpi .val{font-size:28px;font-weight:800;color:var(--accent);}
.kpi .lbl{font-size:10px;color:var(--text3);margin-top:2px;}

.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.player-row:last-child{border:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.player-row .info{flex:1;min-width:0;}
.player-row .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-row .meta{font-size:11px;color:var(--text3);}
.player-row .stat{font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;}

.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-nav button{font-size:22px;padding:6px 10px;color:var(--accent);font-weight:700;}
.week-nav .label{font-size:13px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,36px);gap:1px;font-size:11px;overflow-x:auto;}
@media (max-width:400px){
  .cal-grid{grid-template-columns:minmax(92px,1fr) repeat(7,31px);}
  .cal-name{font-size:11px;min-width:92px;}
  .cal-name img,.cal-name .avatar{width:20px!important;height:20px!important;}
  .cal-cell{font-size:10px;padding:4px 1px;min-height:28px;}
}
.cal-head{text-align:center;font-weight:700;font-size:10px;color:var(--text3);padding:4px 0;cursor:pointer;border-radius:4px;transition:.12s;}
.cal-head.training-day{background:var(--accent);color:#fff;border-radius:4px;}
.cal-head.match-day{background:#e67e22!important;color:#fff!important;border-radius:4px;}
.cal-head:active{transform:scale(.92);}
.cal-head.weekend{color:var(--gold);}
.cal-head.festivo{color:var(--red);}
.cal-name{font-size:12px;font-weight:600;padding:8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:110px;}
.cal-cell{text-align:center;padding:5px 1px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;min-height:30px;display:flex;align-items:center;justify-content:center;}
.cal-cell:active{transform:scale(.9);}
.cal-cell[data-val="1"]{background:#27ae60;color:#fff;font-weight:800;}
.cal-cell[data-val="D"]{background:#2980ff;color:#fff;font-weight:800;}
.cal-cell[data-val="I"]{background:#9b59b6;color:#fff;font-weight:800;}
.cal-cell[data-val="T"]{background:#8e44ad;color:#fff;font-weight:800;}
.cal-cell[data-val="t"]{background:#c0392b;color:#fff;font-weight:800;}
.cal-cell[data-val="J"]{background:#1565C0;color:#fff;font-weight:800;}
.cal-cell[data-val="B"]{background:#e60000;color:#fff;font-weight:800;}
.cal-cell[data-val="E"]{background:#e67e22;color:#fff;font-weight:800;}
.cal-cell[data-val="C"]{background:#607d8b;color:#fff;font-weight:800;}
.cal-cell[data-val="O"]{background:#d32f2f;color:#fff;font-weight:800;}
.cal-cell[data-val="P"]{background:var(--accent);color:#fff;font-size:14px;font-weight:800;}

.code-picker{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--line);padding:6px 10px 8px;z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:none;}
.code-picker.active{display:block;}
.code-picker h4{font-size:9px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.code-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.code-btn{padding:6px 2px;border-radius:5px;font-weight:700;font-size:10px;text-align:center;border:1px solid var(--line);}
.code-btn[data-val="1"]{background:#27ae60;color:#fff;border-color:#27ae60;}
.code-btn[data-val="D"]{background:#2980ff;color:#fff;border-color:#2980ff;}
.code-btn[data-val="I"]{background:#9b59b6;color:#fff;border-color:#9b59b6;}
.code-btn[data-val="T"]{background:#8e44ad;color:#fff;border-color:#8e44ad;}
.code-btn[data-val="t"]{background:#c0392b;color:#fff;border-color:#c0392b;}
.code-btn[data-val="J"]{background:#1565C0;color:#fff;border-color:#1565C0;}
.code-btn[data-val="B"]{background:#e60000;color:#fff;border-color:#e60000;}
.code-btn[data-val="E"]{background:#e67e22;color:#fff;border-color:#e67e22;}
.code-btn[data-val="C"]{background:#607d8b;color:#fff;border-color:#607d8b;}
.code-btn[data-val="O"]{background:#d32f2f;color:#fff;border-color:#d32f2f;}
.code-btn[data-val="P"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.code-btn[data-val=""]{background:var(--bg3);color:var(--text3);}
.code-btn:active{transform:scale(.92);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{filter:brightness(.85);}
.btn-outline{border:1px solid var(--line2);color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 10px;font-size:12px;}

.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.stat-bar{margin-bottom:8px;}
.stat-bar .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.stat-bar .top .lbl{color:var(--text2);}
.stat-bar .top .val{font-weight:700;}
.stat-bar .track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.stat-bar .fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 16px 24px;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}

.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center;background:var(--bg2);}
.login-screen img{height:80px;margin-bottom:16px;}
.login-screen h2{font-size:18px;margin-bottom:4px;}
.login-screen p{color:var(--text3);font-size:12px;margin-bottom:24px;}

.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line);}
.report-row:last-child{border:none;}
.report-row .rlbl{color:var(--text2);}
.report-row .rval{font-weight:700;}

.import-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;cursor:pointer;}

.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:99;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hidden{display:none!important;}
</style>
</head>

e sube solo en cuanto recuperas conexión. El resto de esta pantalla explica todo con más detalle si lo necesitas.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">📋 ASISTENCIA</div>\n      <p style="margin-bottom:8px;">Pantalla principal para registrar la asistencia diaria de cada jugadora. Arriba a la izquierda aparece la foto y nombre del entrenador/a del equipo.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Marcar un día de entreno:</div>\n      <p style="margin-bottom:8px;">Pulsa el <span style="color:var(--accent);font-weight:600;">día de la semana</span> (L, M, X...). Se pone en azul y <b>automáticamente pone "1" a todas las jugadoras</b> — solo tienes que corregir las que tengan una incidencia distinta (falta, lesión...), tocando su casilla concreta.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Quitar un día de entreno:</div>\n      <p style="margin-bottom:8px;">Vuelve a pulsar el día. Antes de borrar, la app sincroniza con la nube por si otro dispositivo acaba de guardar algo que tú aún no tenías. Si hay datos, te pregunta "¿seguir?" antes de borrarlos.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Días de partido, en naranja:</div>\n      <p style="margin-bottom:8px;">Cuando el equipo tiene un partido registrado (importado o creado a mano en Partidos), ese día se pinta de <b>naranja</b> con un balón 🏀. Poner una "P" suelta en una sola jugadora no pinta el día — solo cuenta un partido real dado de alta.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Códigos de asistencia:</div>\n      <div style="font-size:12px;line-height:2;">\n        <span style="background:var(--green-dim);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;">1</span> Entrenó con su equipo (código exclusivo, nunca se combina con otro)<br>\n        <span style="background:var(--blue-dim);color:var(--blue);padding:2px 8px;border-radius:4px;font-weight:700;">D</span> Dobla: entrena con su equipo + otro equipo el mismo día → cuenta como <b>2 entrenos</b><br>\n        <span style="background:var(--purple-dim);color:var(--purple);padding:2px 8px;border-radius:4px;font-weight:700;">I</span> Entrena solo con otro equipo (no con el suyo) → cuenta <b>1 entreno para ella</b>, pero no para el % del equipo<br>\n        <span style="background:rgba(142,68,173,.15);color:#8e44ad;padding:2px 8px;border-radius:4px;font-weight:700;">T</span> Tecnificación + entrenamiento<br>\n        <span style="background:rgba(192,57,43,.12);color:#c0392b;padding:2px 8px;border-radius:4px;font-weight:700;">t</span> Solo tecnificación<br>\n        <span style="background:rgba(21,101,192,.2);color:#2196F3;padding:2px 8px;border-radius:4px;font-weight:700;">J</span> Falta justificada (avisó)<br>\n        <span style="background:rgba(231,76,60,.25);color:#ff3b30;padding:2px 8px;border-radius:4px;font-weight:700;">B</span> Baja por lesión<br>\n        <span style="background:rgba(230,126,34,.12);color:#e67e22;padding:2px 8px;border-radius:4px;font-weight:700;">E</span> Enfermedad<br>\n        <span style="background:rgba(149,165,166,.12);color:#95a5a6;padding:2px 8px;border-radius:4px;font-weight:700;">C</span> Falta por clase/estudios<br>\n        <span style="background:rgba(231,76,60,.2);color:var(--red);padding:2px 8px;border-radius:4px;font-weight:700;">O</span> No avisó<br>\n        <span style="background:var(--accent-dim);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:700;">🏀</span> Partido jugado\n      </div>\n      <p style="margin-top:8px;">No puedes marcar como entrenado un día futuro.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">👥 PLANTILLA</div>\n      <p style="margin-bottom:8px;">Lista de jugadoras del equipo, con el entrenador/a y su foto arriba.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Añadir jugadora:</div>\n      <p style="margin-bottom:8px;">"+ Añadir" → nombre, dorsal, año de nacimiento (teléfono/email opcionales). Si el nombre ya existe en otro equipo del club, te avisa y puedes añadirla como <b>vinculada</b> (misma jugadora, mismos datos en los dos equipos; en su equipo principal se ve en qué equipos está vinculada). En Benjamín y Mini Blanco, cada jugador lleva un campo <b>F / M</b> por si el equipo es mixto.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Contacto de responsables:</div>\n      <p style="margin-bottom:8px;">En la ficha de cada jugadora hay un bloque con Responsable 1 y Responsable 2 (nombre, teléfono, email de cada uno). En equipos Senior se puede dejar vacío, ya que el contacto es la propia jugadora.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Foto:</div>\n      <p style="margin-bottom:8px;">Pulsa el recuadro de la foto → Cámara o Galería.</p>\n      <p>También puedes escribir <b>Observaciones</b> libres sobre cada jugadora.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">🏀 PARTIDOS</div>\n      <p style="margin-bottom:8px;">Registra los partidos del equipo, con minutos y puntos por jugadora.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Crear a mano:</div>\n      <p style="margin-bottom:8px;">"+ Nuevo partido" → fecha, rival, puntos del rival, y el tiempo de cada jugadora como <b>MMSS</b> (ej: 1530 = 15 min 30 seg). Hay un botón "+ Jugador/a de otro equipo (dobla)" que ofrece cualquier equipo de tu misma sección, por debajo o por encima en la categoría (nunca femenino si eres masculino, ni al revés): un jugador puede doblar con cualquier equipo superior, no solo con el siguiente.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Importar el acta de la Federación:</div>\n      <p style="margin-bottom:8px;">"📥 Importar Excel/CSV" → sube el Excel del acta. La app reconoce a tus jugadoras <b>por el nombre</b> (nunca por el número del acta, que es propio de la Federación y no coincide con el dorsal del club). Tienes que elegir tú la fecha real del partido — no se rellena sola.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Jugadoras del acta que no son de tu plantilla:</div>\n      <p style="margin-bottom:8px;">Nunca se asignan solas. Para cada una, eliges tú de un desplegable a qué equipo pertenece — aparecen todos los equipos de su misma sección (masculino o femenino, nunca se cruzan), tanto por debajo como por encima en la categoría, porque un jugador puede doblar con cualquier equipo superior, no solo con el siguiente escalón (ej: un jugador de Cadete puede aparecer en el acta de Junior, de 1ª Nacional o de Tercera FEB) — y después a qué jugadora concreta de ese equipo corresponde. Si la dejas sin asignar, no se importa. Al confirmar, se le crea un <b>Partido Adicional</b> en su equipo real con el balón puesto ese día.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Un partido importado no se puede editar:</div>\n      <p style="margin-bottom:8px;">Una vez importado desde un Excel, el partido queda <b>bloqueado</b> — el acta es la que es. Al abrirlo solo se puede consultar (🔒) o borrarlo entero para reimportarlo si algo estuviera mal. Los partidos creados a mano ("+ Nuevo partido", sin Excel) sí se pueden editar siempre, porque ahí no hay ningún documento oficial detrás.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Marcador del partido:</div>\n      <p style="margin-bottom:8px;">Arriba se ven los dos resultados (tu equipo y el rival) — el de tu equipo ya incluye los puntos de quien dobló desde otro equipo.</p>\n      <div style="font-weight:600;margin-bottom:4px;">No se puede repetir un partido:</div>\n      <p>Si ya existe un partido contra ese rival en esa fecha, la app no te deja importarlo/crearlo otra vez — hay que borrar el anterior primero si quieres sustituirlo.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">➕ P.ADICIONAL</div>\n      <p style="margin-bottom:8px;">Partidos que juegan tus jugadoras <b>con otros equipos</b> del club (categoría superior, selección...). Normalmente se rellenan solos al importar el acta del otro equipo, pero también puedes añadirlos a mano.</p>\n      <p>En la ficha de cada jugadora se ven separados: partidos "CON SU EQUIPO" y "CON OTRO EQUIPO", cada uno con sus minutos y puntos.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">📊 INFORMES</div>\n      <p style="margin-bottom:8px;">Tres niveles: <b>Individual</b> (una jugadora), <b>Equipo</b> (estadísticas de toda la plantilla) y <b>Club</b> (comparativa de todos los equipos). Se exportan en 📄 PDF o 📊 Excel.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Informe de equipo:</div>\n      <p style="margin-bottom:8px;">Por jugadora: entrenamientos, partidos, minutos, puntos, tiros de 3/2/1, rebotes y lesiones. El % de asistencia solo se muestra como media del equipo arriba del todo, no fila por fila.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Informe individual:</div>\n      <p>Incluye sus datos de partidos y, al final, un desglose de cuántas veces se ha marcado cada incidencia de asistencia (1, D, I, J, B, E, C, O...).</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">👕 TALLAS Y EQUIPACIÓN</div>\n      <p style="margin-bottom:8px;">Aparte de los informes deportivos (Coordinadores → 👕 Tallas y equipación). Gestiona tallas de jugadoras y entrenadores: camiseta, pantalón, cubre, chándal, mochila, calcetines / pantalón y chaqueta de chándal, polo, sudadera. Para vaciar un campo, elige "— Sin elegir —" en el desplegable y guarda.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Tres formas de verlo:</div>\n      <p style="margin-bottom:8px;"><b>Individual</b>: eliges equipo y persona, para consultar o editar una a una.<br><b>Informe por equipo</b>: PDF/Excel de un equipo completo, ordenado por nombre — también genera una plantilla en blanco para mandar a las familias por WhatsApp o email.<br><b>Informe de todo el club</b>: PDF con todos los equipos seguidos (por equipo, y dentro de cada uno por nombre), y Excel con <b>una pestaña por equipo</b>.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">📅 HORARIOS</div>\n      <p style="margin-bottom:8px;">Se rellena directamente en Ajustes del equipo (día, hora de inicio/fin y pabellón) — no hace falta configurarlo dos veces. Aquí se ve el horario de tu equipo, y debajo el cuadro conjunto de todos los equipos que comparten pabellón, generado automáticamente.</p>\n      <p>Botón <b>"📤 Compartir imagen"</b> para enviar el horario de un pabellón (o el general) directamente por WhatsApp o email.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">📤 FICHA WHATSAPP / EMAIL</div>\n      <p>Desde la ficha de cada jugadora, "📤 WhatsApp" o "📧 Email" genera una imagen con su calendario de temporada y estadísticas, y abre el selector para compartir directamente.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">⚙️ COORDINADORES</div>\n      <p style="margin-bottom:8px;">Panel con todo lo de gestión general del club, organizado en grupos:</p>\n      <p style="margin-bottom:4px;"><b>Equipos:</b> gestionar equipos, crear equipo nuevo, horarios de todos los equipos con PDF para compartir.</p>\n      <p style="margin-bottom:4px;"><b>Entrenadores:</b> gestionar entrenadores (nombre, teléfono, email, foto, clave personal y hasta varios equipos asignados) y Recordatorios de asistencia.</p>\n      <p style="margin-bottom:4px;"><b>Informes:</b> informes por equipo, Histórico 2025-26 y Tallas y equipación (por separado, ver más abajo).</p>\n      <p style="margin-bottom:8px;"><b>Otros:</b> Escuelas y 🩹 Botiquín (ver más abajo).</p>\n      <div style="font-weight:600;margin-bottom:4px;">Entrenadores y equipos, unificado:</div>\n      <p style="margin-bottom:8px;">Cada entrenador se da de alta <b>una sola vez</b> en Entrenadores, con su propia clave — esa misma clave le sirve para todos los equipos que tenga asignados. Al crear o modificar un equipo, el entrenador se elige de una lista desplegable de los ya dados de alta, en vez de escribirlo a mano.</p>\n      <div style="font-weight:600;margin-bottom:4px;">💬 Mensaje al entrenador:</div>\n      <p style="margin-bottom:8px;">Desde Gestionar equipos, botón 💬 en cada equipo: escribe un mensaje corto que verá el entrenador la próxima vez que entre. Él puede marcarlo como leído/borrarlo, pero queda guardado en el historial para el coordinador.</p>\n      <div style="font-weight:600;margin-bottom:4px;">🔔 Recordatorios de asistencia:</div>\n      <p style="margin-bottom:8px;">Si un equipo acumula <b>2 o más entrenos sin registrar</b> (según su horario), sale un recordatorio por cada uno. Se revisa cada día a las 9:00 (con un email resumen al coordinador) y también cada vez que se abre esta pantalla. Desde aquí se decide, línea a línea, si avisar al entrenador por email o WhatsApp o descartarlo; descartar no lo silencia: si sigue sin registrarse, vuelve a salir. Nunca se avisa automáticamente al entrenador. Cada aviso enviado se cuenta en <b>📋 Veces recordado por equipo</b>.</p>\n      <div style="font-weight:600;margin-bottom:4px;">📜 Histórico de temporadas:</div>\n      <p>Consulta de temporadas anteriores: equipo → jugadora → partidos, minutos, puntos y % de asistencia. Dos pestañas: <b>Por equipo</b> (📄 informe de cada equipo con todos sus jugadores) y <b>Todo el club</b>. Al final de cada equipo sale el contraste con esta temporada: antes, ahora, altas y bajas.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">🩹 BOTIQUÍN</div>\n      <p style="margin-bottom:8px;">Herramientas puntuales, que no se usan en el día a día — por eso están apartadas del menú principal de Coordinadores, y protegidas con su propia clave.</p>\n      <div style="font-weight:600;margin-bottom:4px;">🔒 Acceso protegido:</div>\n      <p style="margin-bottom:8px;">Para entrar hace falta la <b>Clave de Restauración</b> (distinta de la clave de Coordinadores) — así solo la persona que la conoce puede entrar, aunque varios coordinadores compartan la clave normal. La primera vez que se entra, si todavía no hay clave puesta, se deja pasar una vez para configurarla.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Claves y avisos:</div>\n      <p style="margin-bottom:8px;">Cambiar la clave de Coordinadores, de Coordinador de Escuelas, de Directiva, y el email al que llegan los avisos de Recordatorios.</p>\n      <div style="font-weight:600;margin-bottom:4px;">🗄️ Restaurar backup:</div>\n      <p style="margin-bottom:8px;">Cada noche se guarda una copia automática de todos los datos del club, con rotación de 7 días (una por cada día de la semana). Al restaurar se vuelve a pedir la Clave de Restauración como confirmación extra, dado lo destructiva que es esta acción. Después eliges el día (solo se pueden elegir los que tengan copia disponible) y si quieres restaurar todo el club o solo un equipo. <b>Importante: es una sustitución completa</b>, no se mezcla nada — todo lo guardado después de esa copia, en ese ámbito, desaparece.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Limpieza de datos:</div>\n      <p style="margin-bottom:8px;">"Buscar balones huérfanos", "Limpiar Partidos Adicionales duplicados" y "Reparar balones de partidos" — herramientas de mantenimiento por si algún dato queda mal tras una prueba o un error de conexión. No hace falta usarlas en el uso normal.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">🏫 ESCUELAS</div>\n      <p>Gestión de las escuelas deportivas del club (sedes, monitores y alumnado), separada de los equipos federados. Cada sede tiene su propia clave de acceso para el monitor.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">👁 DIRECTIVA</div>\n      <p>Acceso de solo consulta: ve todos los equipos, jugadoras, asistencia, partidos e informes, pero <b>no puede guardar, editar ni borrar nada</b> — aunque toque algo por error, la app lo bloquea.</p>\n    </div>\n\n    <div class="card">\n      <div style="font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px;">🔄 SINCRONIZACIÓN Y SESIÓN</div>\n      <p style="margin-bottom:8px;">Todo se guarda en Google Sheets. Cualquier persona con la clave ve los mismos datos desde cualquier dispositivo.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Sin conexión:</div>\n      <p style="margin-bottom:8px;">Puedes seguir marcando asistencia sin internet — se guarda en el móvil, y en cuanto recupera conexión se sube solo a la nube (verás un aviso "⏳ cambios sin subir" mientras tanto). Toca el aviso para ver el detalle y forzar un reintento. Si algo falla repetidamente por un motivo que no es de conexión, te lo dice claramente en vez de reintentar en silencio para siempre.</p>\n      <div style="font-weight:600;margin-bottom:4px;">No hace falta poner la clave cada vez:</div>\n      <p style="margin-bottom:8px;">Cada dispositivo recuerda la última clave usada para cada acceso — solo se vuelve a pedir si cambias de clave o borras los datos de la app.</p>\n      <div style="font-weight:600;margin-bottom:4px;">Aviso de versión nueva:</div>\n      <p>Si sale un cartel naranja arriba diciendo que hay una versión nueva, pulsa "Recargar" cuando te venga bien.</p>\n
