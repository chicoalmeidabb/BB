window.generateAllSchedulesPDF=function(teams,byPav,days){
  var colors={'MINI':'#3498db','INFANTIL':'#e67e22','CADETE':'#9b59b6','JUNIOR':'#27ae60','NACIONAL':'#e74c3c','BENJAMIN':'#f1c40f','DIPUTACION':'#8d6e63','TERCERAFEB':'#1565C0'};
  function getColor(name){
    if(!name)return'#fff';
    var n=(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    for(var k in colors){if(n.indexOf(k)>=0)return colors[k];}
    return'#999';
  }
  var html='<html><head><meta charset="UTF-8"><style>';
  html+='body{font-family:Arial,sans-serif;font-size:11px;color:#222;padding:16px;max-width:800px;margin:0 auto;}';
  html+='h1{font-size:18px;border-bottom:3px solid #1565C0;padding-bottom:6px;}';
  html+='h2{font-size:13px;color:#1565C0;margin:14px 0 6px;}';
  html+='table{border-collapse:collapse;width:100%;margin-bottom:10px;font-size:9px;}';
  html+='th,td{border:1px solid #ccc;padding:4px;text-align:center;}th{background:#1565C0;color:#fff;}';
  html+='.teamcard{border:1px solid #ddd;border-radius:6px;padding:8px;margin-bottom:8px;}';
  html+='.footer{margin-top:20px;padding-top:8px;border-top:1px solid #ddd;font-size:9px;color:#999;text-align:center;}';
  html+='@media print{body{padding:0;}}';
  html+='</style></head><body>';
  html+='<h1>BB Baloncesto Badajoz — Horarios de todos los equipos</h1>';
  html+='<p style="color:#666;">Generado el '+new Date().toLocaleDateString('es-ES')+'</p>';

  html+='<h2>Por equipo</h2>';
  teams.forEach(function(t){
    var sched=t.weeklySchedule||[];
    html+='<div class="teamcard"><b>'+t.name+'</b><br>';
    if(!sched.length){html+='<span style="color:#999;">Sin horario configurado</span>';}
    else{
      days.forEach(function(d){
        var s=sched.find(function(x){return x.day===d.k;});
        if(!s)return;
        html+=d.l+': '+(s.startTime||'?')+(s.endTime?'-'+s.endTime:'')+(s.pavilion?' · '+_normPav(s.pavilion):'')+'<br>';
      });
    }
    html+='</div>';
  });

  var pavNames=Object.keys(byPav).sort();
  if(pavNames.length){
    html+='<h2>Por pabellón</h2>';
    pavNames.forEach(function(pavName){
      var pav=byPav[pavName];
      var courtNums=Object.keys(pav.courts).map(Number).sort(function(a,b){return a-b;});
      if(!courtNums.length)courtNums=[1];
      var minStart=null,maxEnd=null;
      pav.entries.forEach(function(e){
        if(minStart===null||e.startMin<minStart)minStart=e.startMin;
        if(maxEnd===null||e.endMin>maxEnd)maxEnd=e.endMin;
      });
      if(minStart===null){minStart=16*60;maxEnd=21*60;}
      minStart=Math.floor(minStart/30)*30;maxEnd=Math.ceil(maxEnd/30)*30;
      html+='<h3 style="font-size:11px;">'+pavName+'</h3><table><tr><th rowspan="2">Hora</th>';
      days.slice(0,5).forEach(function(d){html+='<th colspan="'+courtNums.length+'">'+d.l+'</th>';});
      html+='</tr><tr>';
      days.slice(0,5).forEach(function(d){courtNums.forEach(function(cn){html+='<th>P'+cn+'</th>';});});
      html+='</tr>';
      for(var slotStart=minStart;slotStart<maxEnd;slotStart+=30){
        var slotEnd=slotStart+30;
        html+='<tr><td style="font-weight:bold;">'+_minToTime(slotStart)+'</td>';
        days.slice(0,5).forEach(function(d){
          courtNums.forEach(function(cn){
            var match=pav.entries.find(function(e){return e.day===d.k&&e.court===cn&&e.startMin<slotEnd&&e.endMin>slotStart;});
            var val=match?match.teamName:'';
            html+='<td style="background:'+getColor(val)+';color:'+(val?'#fff':'#000')+';">'+val+'</td>';
          });
        });
        html+='</tr>';
      }
      html+='</table>';
    });
  }

  html+='<div class="footer">BB Baloncesto Badajoz · Horarios generados automáticamente<br><img src="'+SIGNATURE_IMG+'" style="height:24px;opacity:.7;margin-top:4px;"></div>';
  html+='</body></html>';

  var blob=new Blob([html],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var w=window.open(url,'_blank');
  if(w){w.onload=function(){setTimeout(function(){w.print();},300);};}
  else{var a=document.createElement('a');a.href=url;a.download='Horarios_BB_Badajoz.html';a.click();}
  toast('Informe generado — usa "Guardar como PDF" al imprimir para compartirlo');
};

  };
};

  var pav=DB.schedules[pi];
  var days=['Lunes','Martes','Miercoles','Jueves','Viernes'];
  var shortDays=['Lun','Mar','Mie','Jue','Vie'];
  var teamNames=DB.teams.map(function(t){return t.name;});
  teamNames.push('TECNIFICACIONES','PARTIDOS');
  var options='<option value="">-</option>'+teamNames.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('');
  var bg=el('div','modal-bg active');
  var tbl='<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:8px;"><tr><th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">Hora</th>';
  days.forEach(function(d,di){
    for(var c=1;c<=pav.courts;c++){tbl+='<th style="padding:3px;border:1px solid var(--line);background:var(--bg4);">'+shortDays[di]+(pav.courts>1?' P'+c:'')+'</th>';}
  });
  tbl+='</tr>';
  pav.slots.forEach(function(slot,si){
    tbl+='<tr><td style="padding:2px;border:1px solid var(--line);font-weight:600;white-space:nowrap;">'+slot.time+'</td>';
    days.forEach(function(d){
      for(var c=1;c<=pav.courts;c++){
        var key=d+'_P'+c;var val=slot[key]||'';
        tbl+='<td style="padding:1px;border:1px solid var(--line);"><select data-si="'+si+'" data-key="'+key+'" style="width:100%;font-size:7px;padding:1px;border:none;background:var(--bg3);color:var(--text);">'+options.replace('value="'+val+'"','value="'+val+'" selected')+'</select></td>';
      }
    });
    tbl+='</tr>';
  });
  tbl+='</table></div>';
  bg.innerHTML='<div class="modal" style="max-width:100%;">'+tbl+'<div style="display:flex;gap:8px;margin-top:10px;"><button class="btn btn-primary btn-block" id="saveGridBtn">Guardar</button><button class="btn btn-outline" id="cancelGridBtn">Cancelar</button></div></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#cancelGridBtn').onclick=function(){bg.remove();showScheduleEditor();};
  bg.querySelector('#saveGridBtn').onclick=function(){
    bg.querySelectorAll('[data-si]').forEach(function(sel){
      var si=parseInt(sel.dataset.si);pav.slots[si][sel.dataset.key]=sel.value;
    });
    saveDB(DB);bg.remove();toast('Horario guardado');showScheduleEditor();
  };
};

window.showRestoreBackup=async function(){
  var bg=el('div','modal-bg active');
  bg.innerHTML='<div class="modal"><h3>🗄️ Restaurar backup</h3><div id="rbBody"><div style="text-align:center;color:var(--text3);padding:20px;">Comprobando...</div></div><button class="btn btn-outline btn-block" style="margin-top:10px;" id="rbClose">Cerrar</button></div>';
  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#rbClose').onclick=function(){bg.remove();};
  var body=bg.querySelector('#rbBody');

  var cfgRes=await gsGet({action:'config'});
  var restorePwd=(cfgRes&&cfgRes.ok&&cfgRes.data&&cfgRes.data.config&&cfgRes.data.config.restorePwd)||'';
  if(!restorePwd){
    body.innerHTML='<div style="color:var(--gold);font-size:12px;">Todavía no has puesto una Clave de Restauración. Ve a Botiquín → "🔑 Clave de Restauración de backup" para ponerla antes de poder usar esto.</div>';
    return;
  }
  body.innerHTML='<div class="form-group"><label>Clave de Restauración</label><input id="rbPwdInput" type="password" style="font-size:16px;text-align:center;padding:12px;"></div><button class="btn btn-primary btn-block" id="rbPwdOk">Continuar</button>';
  body.querySelector('#rbPwdInput').focus();
  body.querySelector('#rbPwdOk').onclick=verificarClave;
  body.querySelector('#rbPwdInput').onkeydown=function(e){if(e.key==='Enter')verificarClave();};
  async function verificarClave(){
    var v=body.querySelector('#rbPwdInput').value;
    if(v!==restorePwd){toast('Clave incorrecta');return;}
    await mostrarDias();
  }

  async function mostrarDias(){
  body.innerHTML='<div style="text-align:center;color:var(--text3);padding:20px;">Comprobando qué días hay disponibles...</div>';
  var res=await gsGet({action:'listarBackups'});
  if(!res||!res.ok||!res.data||!res.data.backups){
    body.innerHTML='<div style="color:var(--red);font-size:12px;">No se pudo comprobar los backups disponibles. Revisa tu conexión e inténtalo de nuevo.</div>';
    return;
  }
  var backups=res.data.backups;
  var html='<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">Cada noche se hace una copia automática. Elige el día del que quieres traer los datos — sustituirá por completo lo que haya ahora, no se mezcla nada.</div>';
  backups.forEach(function(b){
    html+='<button class="btn btn-outline btn-block" style="margin-bottom:6px;'+(b.disponible?'':'opacity:.4;')+'" data-rbday="'+b.dia+'" '+(b.disponible?'':'disabled')+'>'+b.dia+(b.disponible?'':' (sin copia disponible)')+'</button>';
  });
  body.innerHTML=html;
  body.querySelectorAll('[data-rbday]').forEach(function(btn){
    btn.onclick=function(){
      var dia=btn.getAttribute('data-rbday');
      // Paso 2: ¿todo el club, o un equipo concreto?
      var scopeHtml='<div style="font-size:12px;font-weight:600;margin-bottom:10px;">Backup del '+dia+' — ¿qué quieres restaurar?</div>'+
        '<button class="btn btn-primary btn-block" style="margin-bottom:6px;" id="rbClub">🏆 Todo el club</button>'+
        '<button class="btn btn-outline btn-block" id="rbOneTeam">🏀 Solo un equipo</button>'+
        '<button class="btn btn-outline btn-block" style="margin-top:10px;" id="rbBack">← Volver</button>';
      body.innerHTML=scopeHtml;
      body.querySelector('#rbBack').onclick=function(){mostrarDias();};
      function confirmarYRestaurar(equipoId,nombreAmbito){
        var msg='⚠️ Vas a restaurar "'+nombreAmbito+'" con la copia del '+dia+'.\n\nTODO lo que se haya guardado después de esa copia en ese ámbito DESAPARECERÁ — no se combina con los datos actuales, se sustituye por completo.\n\n¿Seguro que quieres continuar?';
        customConfirm(msg).then(async function(ok){
          if(!ok)return;
          body.innerHTML='<div style="text-align:center;color:var(--text3);padding:20px;">Restaurando...</div>';
          var r=await gsPost({action:'restaurarBackup',dia:dia,equipoId:equipoId||''});
          if(r&&r.ok){
            body.innerHTML='<div style="text-align:center;color:var(--text3);padding:10px;">Descargando los datos restaurados...</div>';
            await syncFromCloud().catch(function(){});
            body.innerHTML='<div style="color:var(--green);font-weight:600;font-size:13px;text-align:center;padding:10px;">✓ Restaurado correctamente desde el '+dia+'.</div><button class="btn btn-outline btn-block" style="margin-top:10px;" id="rbDone">Cerrar</button>';
            body.querySelector('#rbDone').onclick=function(){bg.remove();S.view='login';render();};
          } else {
            body.innerHTML='<div style="color:var(--red);font-size:12px;text-align:center;padding:10px;">⚠ No se pudo restaurar. Revisa tu conexión e inténtalo de nuevo.</div><button class="btn btn-outline btn-block" style="margin-top:10px;" id="rbRetryClose">Cerrar</button>';
            body.querySelector('#rbRetryClose').onclick=function(){bg.remove();};
          }
        });
      }
      body.querySelector('#rbClub').onclick=function(){confirmarYRestaurar('','todo el club');};
      body.querySelector('#rbOneTeam').onclick=function(){
        var teams=(DB.teams||[]).slice().sort(function(a,b){return teamRank(a.name)-teamRank(b.name)||a.name.localeCompare(b.name);});
        var teamHtml='<div style="font-size:12px;font-weight:600;margin-bottom:8px;">¿Qué equipo?</div>'+
          teams.map(function(t){return'<button class="btn btn-outline btn-block" style="margin-bottom:6px;" data-rbteam="'+t.id+'" data-rbname="'+t.name.replace(/"/g,'&quot;')+'">'+t.name+'</button>';}).join('')+
          '<button class="btn btn-outline btn-block" style="margin-top:6px;" id="rbBack2">← Volver</button>';
        body.innerHTML=teamHtml;
        body.querySelector('#rbBack2').onclick=function(){mostrarDias();};
        body.querySelectorAll('[data-rbteam]').forEach(function(tbtn){
          tbtn.onclick=function(){confirmarYRestaurar(tbtn.getAttribute('data-rbteam'),tbtn.getAttribute('data-rbname'));};
        });
      };
    };
  });
  } // fin mostrarDias
};

async function init(){
  render();
  if(CONFIG_URL_GOOGLE_SHEETS!=='AQUÍ_IRÁ_EL_ENLACE'){
    const st=()=>document.getElementById('syncStatus');
    try{
      if(st()) st().textContent='Descargando datos...';
      const res=await gsGet({action:'all'});
      if(res.ok&&res.data){
        // Rebuild DB
        const teamMap={};
        (res.data.equipos||[]).forEach(eq=>{
          teamMap[eq.id]={id:eq.id,name:eq.nombre,category:eq.categoria,coachCode:eq.claveEntrenador,directorCode:eq.claveDirector,coachName:eq.coachName||'',coach1:eq.coach1||'',coach2:eq.coach2||'',weeklySchedule:_parseHorario(eq.horario),players:[],trainingSessions:{},games:[],trainingDays:{},extraGames:[]};
        });
        // If Equipos sheet is empty but we have jugadores, auto-create teams
        const allEquipoIds=new Set();
        (res.data.jugadores||[]).forEach(j=>allEquipoIds.add(j.equipoId));
        (res.data.asistencia||[]).forEach(a=>allEquipoIds.add(a.equipoId));
        allEquipoIds.forEach(eid=>{
          if(!teamMap[eid])teamMap[eid]={id:eid,name:'Equipo '+eid.slice(-4),category:'',coachCode:'1234',directorCode:'5678',players:[],trainingSessions:{},games:[],trainingDays:{}};
        });
        (res.data.jugadores||[]).forEach(j=>{
          if(!teamMap[j.equipoId])return;
          teamMap[j.equipoId].players.push({id:j.id,name:j.nombre,dorsal:parseInt(j.dorsal)||0,birthYear:j.anioNacimiento||'',phone:j.telefono||'',email:j.email||'',obs:j.obs||'',photo:j.photoUrl||j.photo||_getLocalPhoto(j.id)||'',fatherName:j.nombrePadre||'',fatherPhone:j.telefonoPadre||'',fatherEmail:j.emailPadre||'',motherName:j.nombreMadre||'',motherPhone:j.telefonoMadre||'',motherEmail:j.emailMadre||'',tallas:_parseTallas(j.tallas),vinculadoDe:j.vinculadoDe||''});
        });
        (res.data.asistencia||[]).forEach(a=>{
          if(!teamMap[a.equipoId])return;
          const t=teamMap[a.equipoId];
          if(a.jugadorId==='__TEAM_DAY__'){
            if(!t.trainingDays)t.trainingDays={};
            t.trainingDays[normDate(a.fecha)]=(a.incidencia==='TRAIN_DAY');
            return;
          }
          if(!t.trainingSessions[normDate(a.fecha)])t.trainingSessions[normDate(a.fecha)]={};
          t.trainingSessions[normDate(a.fecha)][a.jugadorId]=a.incidencia;
        });
        const gameMap={};
        (res.data.partidos||[]).forEach(p=>{
          if(!gameMap[p.id])gameMap[p.id]={id:p.id,date:normDate(p.fecha),equipoId:p.equipoId,opponent:p.rival,rivalPoints:parseInt(p.rivalPoints)||0,players:[],linkedExtra:_parseLinkedExtra(p.linkedExtra),imported:String(p.importado)==='true'};
          const gp={playerId:p.jugadorId,minutes:p.minutos,points:parseInt(p.puntos)||0};
          const hasStats=(p.p2m||p.p2a||p.p3m||p.p3a||p.p1m||p.p1a||p.reb||p.ast||p.stl||p.blk);
          if(hasStats)gp.stats={p2m:parseInt(p.p2m)||0,p2a:parseInt(p.p2a)||0,p3m:parseInt(p.p3m)||0,p3a:parseInt(p.p3a)||0,p1m:parseInt(p.p1m)||0,p1a:parseInt(p.p1a)||0,reb:parseInt(p.reb)||0,ast:parseInt(p.ast)||0,stl:parseInt(p.stl)||0,blk:parseInt(p.blk)||0};
          gameMap[p.id].players.push(gp);
        });
        Object.values(gameMap).forEach(g=>{
          if(teamMap[g.equipoId])teamMap[g.equipoId].games.push(g);
        });
        (res.data.partidosExtra||[]).forEach(function(pe){
          if(teamMap[pe.equipoId])teamMap[pe.equipoId].extraGames.push({id:pe.id,playerId:pe.playerId,date:normDate(pe.fecha),opponent:pe.rival,team:pe.equipoJugado,minutes:pe.minutos,points:parseInt(pe.puntos)||0});
        });
        DB.teams=Object.values(teamMap);
        if(res.data.entrenadores)DB.coaches=_hydrateCoaches(res.data.entrenadores);
        if(res.data.config){
          if(res.data.config.adminPwd)DB.adminPwd=res.data.config.adminPwd;
          if(res.data.config.schoolsCoordPwd)DB.schoolsCoordPwd=res.data.config.schoolsCoordPwd;
          if(res.data.config.directivaPwd)DB.directivaPwd=res.data.config.directivaPwd;
        }
        DB.teamMessages=res.data.mensajes||[];
        if(res.data.escuelas){
          DB.schools=res.data.escuelas.map(function(e){
            return{id:e.id,sede:e.sede,password:e.password||'',monitors:[e.monitor1||'',e.monitor2||'',e.monitor3||''],
              kids:(res.data.escuelasNinos||[]).filter(function(k){return k.sedeId===e.id;}).map(function(k){
                return{id:k.id,name:k.nombre,gender:k.genero||'M',phone:k.telefono||'',birthYear:k.anioNacimiento||'',obs:k.obs||''};
              })};
          });
        }
        saveDB(DB);
        const _savedSel=document.getElementById('selTeam')?.value||'';
        render();
        const _restoredSel=document.getElementById('selTeam');
        if(_restoredSel&&_savedSel){_restoredSel.value=_savedSel;$('#codeS')?.classList.remove('hidden');}
        if(st()) st().innerHTML='<span style="color:var(--green);">✓ Conectado · '+DB.teams.length+' equipos</span>';
      } else {
        if(st()) st().innerHTML='<span style="color:var(--gold);">⚠ Respuesta vacía del servidor</span>';
      }
    }catch(err){
      console.error('Init sync error:',err);
      const s=st();
      if(s) s.innerHTML='<span style="color:var(--red);">Error: '+err.message+'</span>';
    }
    // Sync periódico
    setInterval(async()=>{
      if(!SYNCING&&S.view==='main'){
        try{await syncFromCloud();const c=$('#cnt');if(c)rc();}catch(e){}
      }
    },60000);
  }
}
// ═══ AVISO DE VERSIÓN NUEVA ═══
// Comprueba si el index.html publicado en el servidor tiene una versión más
// nueva que la que está corriendo ahora mismo en este dispositivo. Solo avisa
// si de verdad es más nueva (no solo "distinta" — GitHub Pages a veces tarda
// en propagar el cambio a todos sus servidores, y una comprobación aislada
// puede toparse con una copia todavía vieja) y si se confirma dos veces
// seguidas, para no avisar por un fallo puntual de red.
function versionIsNewer(remote,local){
  var r=String(remote).split('.').map(Number),l=String(local).split('.').map(Number);
  for(var i=0;i<Math.max(r.length,l.length);i++){
    var rv=r[i]||0,lv=l[i]||0;
    if(rv>lv)return true;
    if(rv<lv)return false;
  }
  return false;
}
function showUpdateBanner(newVer){
  if(document.getElementById('updateBanner'))return;
  var b=document.createElement('div');
  b.id='updateBanner';
  b.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#e67e22;color:#fff;padding:10px 14px;z-index:9999;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  b.innerHTML='<span>🔄 Hay una versión nueva de la app</span><span style="display:flex;gap:6px;"><button id="updBtnReload" style="background:#fff;color:#e67e22;border:none;border-radius:6px;padding:5px 10px;font-weight:700;">Recargar</button><button id="updBtnDismiss" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:5px 8px;">✕</button></span>';
  document.body.appendChild(b);
  document.getElementById('updBtnReload').onclick=function(){location.reload();};
  document.getElementById('updBtnDismiss').onclick=function(){b.remove();};
}
var _pendingUpdateVer=null;
async function checkForUpdate(){
  try{
    var res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    var txt=await res.text();
    var m=txt.match(/const APP_VERSION=['"]([\d.]+)['"]/);
    if(!m||!m[1])return;
    if(!versionIsNewer(m[1],APP_VERSION)){_pendingUpdateVer=null;return;}
    if(_pendingUpdateVer===m[1]){showUpdateBanner(m[1]);} // confirmado dos veces seguidas
    else{_pendingUpdateVer=m[1];} // primera vez que se ve esta versión, se confirma en la siguiente comprobación
  }catch(e){/* sin conexión: no pasa nada, se reintenta luego */}
}
