<style>
:root{
  --bg:#1E88E5;--bg2:#0d3f73;--bg3:#0f4a85;--bg4:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.2);--line2:rgba(255,255,255,.32);
  --text:#ffffff;--text2:rgba(255,255,255,.78);--text3:rgba(255,255,255,.6);
  --accent:#1565C0;--accent2:#1E88E5;--accent-dim:rgba(255,255,255,.85);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,.12);
  --gold:#f1c40f;--gold-dim:rgba(241,196,15,.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,.12);
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;width:100%;background:var(--bg3);color:var(--text);}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
option{background:var(--bg3);}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.header{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.header img{height:36px;}
.header h1{font-size:14px;font-weight:700;flex:1;color:var(--text);}
.header .badge{background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}
.header .xbtn{color:var(--text3);font-size:18px;padding:4px 8px;}

.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;padding:8px 2px 6px;text-align:center;font-size:9.5px;font-weight:500;color:var(--text3);transition:.15s;}
.tab.active{color:var(--accent);}
.tab svg{display:block;margin:0 auto 2px;width:20px;height:20px;}
.tab span{font-size:17px;display:block;margin-bottom:1px;}
.content{flex:1;padding:12px 14px 76px;overflow-y:auto;}.content.att-bg{background:#124d87;}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.kpi .val{font-size:28px;font-weight:800;color:var(--accent);}
.kpi .lbl{font-size:10px;color:var(--text3);margin-top:2px;}

.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.player-row:last-child{border:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.player-row .info{flex:1;min-width:0;}
.player-row .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-row .meta{font-size:11px;color:var(--text3);}
.player-row .stat{font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;}

.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-nav button{font-size:22px;padding:6px 10px;color:var(--accent);font-weight:700;}
.week-nav .label{font-size:13px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,36px);gap:1px;font-size:11px;overflow-x:auto;}
@media (max-width:400px){
  .cal-grid{grid-template-columns:minmax(92px,1fr) repeat(7,31px);}
  .cal-name{font-size:11px;min-width:92px;}
  .cal-name img,.cal-name .avatar{width:20px!important;height:20px!important;}
  .cal-cell{font-size:10px;padding:4px 1px;min-height:28px;}
}
.cal-head{text-align:center;font-weight:700;font-size:10px;color:var(--text3);padding:4px 0;cursor:pointer;border-radius:4px;transition:.12s;}
.cal-head.training-day{background:var(--accent);color:#fff;border-radius:4px;}
.cal-head.match-day{background:#e67e22!important;color:#fff!important;border-radius:4px;}
.cal-head:active{transform:scale(.92);}
.cal-head.weekend{color:var(--gold);}
.cal-head.festivo{color:var(--red);}
.cal-name{font-size:12px;font-weight:600;padding:8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:110px;}
.cal-cell{text-align:center;padding:5px 1px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;min-height:30px;display:flex;align-items:center;justify-content:center;}
.cal-cell:active{transform:scale(.9);}
.cal-cell[data-val="1"]{background:#27ae60;color:#fff;font-weight:800;}
.cal-cell[data-val="D"]{background:#2980ff;color:#fff;font-weight:800;}
.cal-cell[data-val="I"]{background:#9b59b6;color:#fff;font-weight:800;}
.cal-cell[data-val="T"]{background:#8e44ad;color:#fff;font-weight:800;}
.cal-cell[data-val="t"]{background:#c0392b;color:#fff;font-weight:800;}
.cal-cell[data-val="J"]{background:#1565C0;color:#fff;font-weight:800;}
.cal-cell[data-val="B"]{background:#e60000;color:#fff;font-weight:800;}
.cal-cell[data-val="E"]{background:#e67e22;color:#fff;font-weight:800;}
.cal-cell[data-val="C"]{background:#607d8b;color:#fff;font-weight:800;}
.cal-cell[data-val="O"]{background:#d32f2f;color:#fff;font-weight:800;}
.cal-cell[data-val="P"]{background:var(--accent);color:#fff;font-size:14px;font-weight:800;}

.code-picker{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--line);padding:10px 12px 14px;z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:none;}
.code-picker.active{display:block;}
.code-picker h4{font-size:10px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.code-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.code-btn{padding:10px 2px;border-radius:6px;font-weight:700;font-size:12px;text-align:center;border:1px solid var(--line);}
.code-btn[data-val="1"]{background:#27ae60;color:#fff;border-color:#27ae60;}
.code-btn[data-val="D"]{background:#2980ff;color:#fff;border-color:#2980ff;}
.code-btn[data-val="I"]{background:#9b59b6;color:#fff;border-color:#9b59b6;}
.code-btn[data-val="T"]{background:#8e44ad;color:#fff;border-color:#8e44ad;}
.code-btn[data-val="t"]{background:#c0392b;color:#fff;border-color:#c0392b;}
.code-btn[data-val="J"]{background:#1565C0;color:#fff;border-color:#1565C0;}
.code-btn[data-val="B"]{background:#e60000;color:#fff;border-color:#e60000;}
.code-btn[data-val="E"]{background:#e67e22;color:#fff;border-color:#e67e22;}
.code-btn[data-val="C"]{background:#607d8b;color:#fff;border-color:#607d8b;}
.code-btn[data-val="O"]{background:#d32f2f;color:#fff;border-color:#d32f2f;}
.code-btn[data-val="P"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.code-btn[data-val=""]{background:var(--bg3);color:var(--text3);}
.code-btn:active{transform:scale(.92);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{filter:brightness(.85);}
.btn-outline{border:1px solid var(--line2);color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 10px;font-size:12px;}

.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.stat-bar{margin-bottom:8px;}
.stat-bar .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.stat-bar .top .lbl{color:var(--text2);}
.stat-bar .top .val{font-weight:700;}
.stat-bar .track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.stat-bar .fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 16px 24px;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}

.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center;background:var(--bg2);}
.login-screen img{height:80px;margin-bottom:16px;}
.login-screen h2{font-size:18px;margin-bottom:4px;}
.login-screen p{color:var(--text3);font-size:12px;margin-bottom:24px;}

.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line);}
.report-row:last-child{border:none;}
.report-row .rlbl{color:var(--text2);}
.report-row .rval{font-weight:700;}

.import-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;cursor:pointer;}

.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:99;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hidden{display:none!important;}
</style>
</head>

const DB_KEY='cbb_v4_cache';
const SESSION_KEY='cbb_session';
function saveSession(sess){try{localStorage.setItem(SESSION_KEY,JSON.stringify(sess));}catch(e){}}
function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}
function _tryLoginCoach(pwd,preserveView){
  var myTeams=[];
  (DB.coaches||[]).forEach(function(c){
    if(String(c.password)===String(pwd)&&pwd!==''){
      (c.teams||[]).forEach(function(tid){
        var t=DB.teams.find(function(x){return x.id===tid;});
        if(t&&!myTeams.find(function(x){return x.id===t.id;}))myTeams.push(t);
      });
    }
  });
  DB.teams.forEach(function(t){
    if(String(t.coachCode)===pwd&&pwd!==''&&!myTeams.find(function(x){return x.id===t.id;})){
      myTeams.push(t);
    }
  });
  if(!myTeams.length)return false;
  S.role='coach';S.readOnly=false;S.coachPwd=pwd;S.teamListData=myTeams;
  if(!preserveView)S.view='teamlist';
  return true;
}
window.logout=function(){
  clearSession();
  S.role=null;S.readOnly=false;S.team=null;S.schoolsRole=null;S.coachPwd=null;S.mySchoolId=null;S.view='login';
  render();
};
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||defaultDB();}catch(e){return defaultDB();}}
function saveDB(db){if(typeof S!=='undefined'&&S.readOnly){toast('🔒 Solo lectura: la directiva no puede modificar datos');return;}localStorage.setItem(DB_KEY,JSON.stringify(db));}
function defaultDB(){return{teams:[],clubName:'BB Baloncesto Badajoz'};}
let DB=loadDB();
let SYNCING=false;
let _pendingSyncOps=0; // contador real de peticiones en curso (a diferencia de SYNCING, que es solo para el indicador visual y una sola bandera puede pisarse entre varias escrituras seguidas)

// ── Google Sheets API ──
const PENDING_KEY='cbb_pending_sync';
function _loadPending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY))||[];}catch(e){return[];}}
function _savePending(arr){try{localStorage.setItem(PENDING_KEY,JSON.stringify(arr));}catch(e){}}
function _queuePending(body){
  var q=_loadPending();
  q.push({body:body,ts:Date.now()});
  _savePending(q);
  _updatePendingBadge();
}
function _updatePendingBadge(){
  var n=_loadPending().length;
  var el=document.getElementById('pendingBadge');
  if(n>0){
    if(!el){
      el=document.createElement('div');
      el.id='pendingBadge';
      el.style.cssText='position:fixed;top:6px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px;z-index:9998;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;';
      el.title='Toca para ver el detalle o forzar reintento/borrado';
      el.onclick=async function(){
        var q=_loadPending();
        var resumen=q.map(function(item,i){return(i+1)+'. '+(item.body&&item.body.action||'?')+(item.intentos?' — fallado '+item.intentos+' vez/veces: '+(item.ultimoError||''):' — aún sin poder conectar');}).join('\n');
        var conFallosReales=q.some(function(it){return(it.intentos||0)>=3;});
        var msg='Pendientes de subir ('+q.length+'):\n\n'+resumen+'\n\n¿Reintentar ahora?'+(conFallosReales?'\n\n(Cancelar aquí, y si quieres descartarlos del todo porque ya no valen, dímelo y te doy una opción para borrarlos.)':'');
        if(await customConfirm(msg)){
          flushPendingSync();
        }
      };
      document.body.appendChild(el);
    }
    el.textContent='⏳ '+n+' cambio(s) sin subir — toca para ver/reintentar';
  } else if(el){
    el.remove();
  }
}
let _flushingPending=false;
async function flushPendingSync(){
  if(_flushingPending)return;
  var q=_loadPending();
  if(!q.length)return;
  _flushingPending=true;
  var restantes=[];
  var huboFalloReal=false;
  for(const item of q){
    try{
      const r=await fetch(CONFIG_URL_GOOGLE_SHEETS,{method:'POST',redirect:'follow',body:JSON.stringify(item.body),headers:{'Content-Type':'text/plain'}});
      const d=await r.json();
      if(!d||!d.ok){
        item.intentos=(item.intentos||0)+1;
        item.ultimoError=(d&&d.error)||'el servidor respondió que no';
        huboFalloReal=true;
        restantes.push(item);
      }
    }catch(e){
      // esto sí es de verdad "sin conexión": no cuenta como intento fallido
      restantes.push(item);
    }
  }
  _savePending(restantes);
  _updatePendingBadge();
  _flushingPending=false;
  if(restantes.length<q.length)toast('✓ Datos pendientes sincronizados con la nube');
  else if(huboFalloReal&&restantes.some(function(it){return(it.intentos||0)>=3;})){
    toast('⚠ Hay cambios que no se pueden subir (no es un problema de conexión) — toca el aviso rojo para ver el detalle');
  }
}
window.addEventListener('online',function(){flushPendingSync();});
async function gsPost(body){
  if(typeof S!=='undefined'&&S.readOnly){toast('🔒 Solo lectura: la directiva no puede modificar datos');return{ok:false,blocked:true};}
  if(CONFIG_URL_GOOGLE_SHEETS==='AQUÍ_IRÁ_EL_ENLACE'){return{ok:false};}
  _pendingSyncOps++;
  try{
    SYNCING=true;showSync(true);
    const r=await fetch(CONFIG_URL_GOOGLE_SHEETS,{method:'POST',redirect:'follow',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});
    const d=await r.json();
    if(d&&d.ok&&_loadPending().length)setTimeout(flushPendingSync,500);
    return d;
  }catch(e){
    console.error('gsPost:',e);
    _queuePending(body);
    return{ok:false,error:e.message,queued:true};
  }finally{_pendingSyncOps--;SYNCING=false;showSync(false);}
}

async function gsGet(params={}){
  if(CONFIG_URL_GOOGLE_SHEETS==='AQUÍ_IRÁ_EL_ENLACE'){return{ok:false};}
  _pendingSyncOps++;
  try{
    SYNCING=true;showSync(true);
    const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const url=CONFIG_URL_GOOGLE_SHEETS+(qs?'?'+qs:'');
    const r=await fetch(url,{redirect:'follow'});
    const d=await r.json();
    if(d&&d.ok&&_loadPending().length)setTimeout(flushPendingSync,500); // hay conexión de verdad: aprovecha para reintentar lo pendiente
    return d;
  }catch(e){
    console.error('gsGet:',e);
    return{ok:false,error:e.message};
  }finally{_pendingSyncOps--;SYNCING=false;showSync(false);}
}

let _syncTimeout=null;
function showSync(on){
  let el=document.getElementById('syncBadge');
  if(!el){el=document.createElement('div');el.id='syncBadge';el.style.cssText='position:fixed;top:4px;right:4px;background:var(--accent);color:#fff;font-size:9px;padding:2px 8px;border-radius:10px;z-index:99;display:none;';el.textContent='Sincronizando...';document.body.appendChild(el);}
  if(_syncTimeout){clearTimeout(_syncTimeout);_syncTimeout=null;}
  el.style.display=on?'block':'none';
  // Seguridad: si en 15s no se ha quitado, forzar ocultarlo
  if(on){_syncTimeout=setTimeout(()=>{el.style.display='none';SYNCING=false;},15000);}
}

async function syncFromCloud(){
  const res=await gsGet({action:'all'});
  if(!res.ok)return false;
  const d=res.data;
  // Rebuild DB from cloud data
  const teamMap={};
  (d.equipos||[]).forEach(eq=>{
    teamMap[eq.id]={id:eq.id,name:eq.nombre,category:eq.categoria,coachCode:eq.claveEntrenador,directorCode:eq.claveDirector,coachName:eq.coachName||'',coach1:eq.coach1||'',coach2:eq.coach2||'',weeklySchedule:_parseHorario(eq.horario),players:[],trainingSessions:{},games:[],trainingDays:{},extraGames:[]};
  });
  (d.jugadores||[]).forEach(j=>{
    if(!teamMap[j.equipoId])return;
    teamMap[j.equipoId].players.push({id:j.id,name:j.nombre,dorsal:parseInt(j.dorsal)||0,birthYear:j.anioNacimiento||'',phone:j.telefono||'',email:j.email||'',obs:j.obs||'',photo:j.photoUrl||j.photo||_getLocalPhoto(j.id)||'',fatherName:j.nombrePadre||'',fatherPhone:j.telefonoPadre||'',fatherEmail:j.emailPadre||'',motherName:j.nombreMadre||'',motherPhone:j.telefonoMadre||'',motherEmail:j.emailMadre||'',tallas:_parseTallas(j.tallas),vinculadoDe:j.vinculadoDe||''});
  });
  (d.asistencia||[]).forEach(a=>{
    if(!teamMap[a.equipoId])return;
    const t=teamMap[a.equipoId];
    if(a.jugadorId==='__TEAM_DAY__'){
      if(!t.trainingDays)t.trainingDays={};
      t.trainingDays[normDate(a.fecha)]=(a.incidencia==='TRAIN_DAY');
      return;
    }
    if(!t.trainingSessions[normDate(a.fecha)])t.trainingSessions[normDate(a.fecha)]={};
    t.trainingSessions[normDate(a.fecha)][a.jugadorId]=a.incidencia;
  });
  // Group partidos by id
  const gameMap={};
  (d.partidos||[]).forEach(p=>{
    if(!gameMap[p.id])gameMap[p.id]={id:p.id,date:normDate(p.fecha),equipoId:p.equipoId,opponent:p.rival,rivalPoints:parseInt(p.rivalPoints)||0,players:[],linkedExtra:_parseLinkedExtra(p.linkedExtra),imported:String(p.importado)==='true'};
    const gp={playerId:p.jugadorId,minutes:p.minutos,points:parseInt(p.puntos)||0};
    const hasStats=(p.p2m||p.p2a||p.p3m||p.p3a||p.p1m||p.p1a||p.reb||p.ast||p.stl||p.blk);
    if(hasStats)gp.stats={p2m:parseInt(p.p2m)||0,p2a:parseInt(p.p2a)||0,p3m:parseInt(p.p3m)||0,p3a:parseInt(p.p3a)||0,p1m:parseInt(p.p1m)||0,p1a:parseInt(p.p1a)||0,reb:parseInt(p.reb)||0,ast:parseInt(p.ast)||0,stl:parseInt(p.stl)||0,blk:parseInt(p.blk)||0};
    gameMap[p.id].players.push(gp);
  });
  Object.values(gameMap).forEach(g=>{
    if(teamMap[g.equipoId])teamMap[g.equipoId].games.push(g);
  });
  (d.partidosExtra||[]).forEach(function(pe){
    if(teamMap[pe.equipoId])teamMap[pe.equipoId].extraGames.push({id:pe.id,playerId:pe.playerId,date:normDate(pe.fecha),opponent:pe.rival,team:pe.equipoJugado,minutes:pe.minutos,points:parseInt(pe.puntos)||0});
  });
  DB.teams=Object.values(teamMap);
  if(d.entrenadores)DB.coaches=_hydrateCoaches(d.entrenadores);
  if(d.config){
    if(d.config.adminPwd)DB.adminPwd=d.config.adminPwd;
    if(d.config.schoolsCoordPwd)DB.schoolsCoordPwd=d.config.schoolsCoordPwd;
    if(d.config.directivaPwd)DB.directivaPwd=d.config.directivaPwd;
  }
  DB.teamMessages=d.mensajes||DB.teamMessages||[];
  DB.pabellones=(d.pabellones||[]).map(function(p){return{id:p.id,name:p.nombre,courts:parseInt(p.pistas)||1};});
  if(d.escuelas){
    DB.schools=d.escuelas.map(function(e){
      return{id:e.id,sede:e.sede,password:e.password||'',monitors:[e.monitor1||'',e.monitor2||'',e.monitor3||''],
        kids:(d.escuelasNinos||[]).filter(function(k){return k.sedeId===e.id;}).map(function(k){
          return{id:k.id,name:k.nombre,gender:k.genero||'M',phone:k.telefono||'',birthYear:k.anioNacimiento||'',obs:k.obs||''};
        })};
    });
  }
  saveDB(DB);
  // Status updated by init() after render
  return true;
}

function _parseHorario(v){
  if(!v)return[];

}
var _DAY_LABELS=[{k:'L',l:'Lunes'},{k:'M',l:'Martes'},{k:'X',l:'Miércoles'},{k:'J',l:'Jueves'},{k:'V',l:'Viernes'},{k:'S',l:'Sábado'},{k:'D',l:'Domingo'}];
var _PABELLONES_FIJOS=[{name:'Palmeras',courts:1},{name:'Nuria C.',courts:3},{name:'Gévora',courts:1},{name:'La Granadilla',courts:1}];
// El pabellón "Nuria Cabanillas" se renombró a "Nuria C." — esto hace que los horarios ya
// guardados con el nombre largo se sigan agrupando bien con el nombre corto nuevo.
function _normPav(s){return String(s||'').replace(/^Nuria Cabanillas/,'Nuria C.');}
function _pavCourtVariants(name,courts){
  var n=parseInt(courts)||1;
  if(n<=1)return[name];
  var out=[];
  for(var i=1;i<=n;i++)out.push(name+' '+i);
  return out;
}
function _buildScheduleRowsHTML(t){
  var sched=t.weeklySchedule||[];
  function schedFor(k){return sched.find(function(s){return s.day===k;})||{};}
  var pavNames=[];

  (DB.pabellones||[]).forEach(function(p){_pavCourtVariants(p.name,p.courts||1).forEach(function(v){if(pavNames.indexOf(v)<0)pavNames.push(v);});});
  var pavOptions=pavNames.map(function(n){return'<option value="'+n+'">';}).join('');
  var rows=_DAY_LABELS.map(function(d){
    var s=schedFor(d.k);
    var active=!!(s.startTime||s.pavilion);

      '<input class="schedPav" data-day="'+d.k+'" list="pavList" placeholder="Pabellón" value="'+(s.pavilion||'')+'" style="flex:1;min-width:0;padding:5px;font-size:11px;">'+
      '</div></div>';
  }).join('');
  return '<div style="font-weight:700;font-size:12px;margin:14px 0 6px;">Horario semanal de entrenamiento</div>'+

function isH(d){return HOLIDAYS.has(ds(d));}

function getWk(off=0){const n=new Date();const m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7)+off*7);m.setHours(0,0,0,0);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}

const DIAS_LARGOS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function _coachesForTeam(teamId){
  var c1=null,c2=null;
  (DB.coaches||[]).forEach(function(c){
    (c.teamRoles||[]).forEach(function(tr){
      if(tr.teamId===teamId){
        if(tr.role==='1')c1=c;
        else if(tr.role==='2')c2=c;
      }
    });
  });
  return{c1:c1,c2:c2};
}
function _coachDropdown(id,selectedId){
  var opts='<option value="">— Ninguno —</option>';
  (DB.coaches||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(c){
    opts+='<option value="'+c.id+'"'+(c.id===selectedId?' selected':'')+'>'+c.name+'</option>';
  });
  return '<select id="'+id+'" style="width:100%;">'+opts+'</select>';
}
async function _applyCoachSelection(teamId,role,newCoachId){
  // Quita este equipo/rol de cualquier entrenador que lo tuviera antes, y lo asigna al nuevo (si hay)
  var changed=[];
  (DB.coaches||[]).forEach(function(c){
    var had=(c.teamRoles||[]).some(function(tr){return tr.teamId===teamId&&tr.role===role;});
    if(had&&c.id!==newCoachId){
      c.teamRoles=(c.teamRoles||[]).filter(function(tr){return!(tr.teamId===teamId&&tr.role===role);});
      c.teams=c.teamRoles.map(function(tr){return tr.teamId;});
      changed.push(c);
    }
  });
  if(newCoachId){
    var nc=(DB.coaches||[]).find(function(c){return c.id===newCoachId;});
    if(nc){
      if(!nc.teamRoles)nc.teamRoles=[];
      var existing=nc.teamRoles.find(function(tr){return tr.teamId===teamId;});
      if(existing)existing.role=role;
      else nc.teamRoles.push({teamId:teamId,role:role});
      nc.teams=nc.teamRoles.map(function(tr){return tr.teamId;});
      if(changed.indexOf(nc)<0)changed.push(nc);
    }
  }
  // Uno detrás de otro, nunca todos a la vez — si se mandan varios avisos simultáneos al mismo
  // tiempo a Apps Script, alguno puede quedarse sin aplicar sin avisar de nada.
  for(const c of changed){
    var teamsStr=(c.teamRoles||[]).map(function(tr){return tr.teamId+':'+tr.role;}).join(',');
    await gsPost({action:'guardarEntrenador',id:c.id,nombre:c.name,telefono:c.phone||'',email:c.email||'',password:c.password||'',teams:teamsStr});
  }
}
function teamRank(name){
  var n=(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  var cats=['BENJAMIN','PREMINI','MINI','INFANTIL','CADETE','JUNIOR','SENIOR','NACIONAL','DIPUTACION','TERCERAFEB','SEGUNDAFEB','PRIMERAFEB','FEB'];
  var catRank=cats.length;
  cats.forEach(function(o,i){if(n.indexOf(o)>=0&&i<catRank)catRank=i;});
  var genRank=n.indexOf('FEMEN')>=0?0:(n.indexOf('MASCUL')>=0?1:0.5);
  return catRank*10+genRank;
}
function _nonLinkedPlayers(t){return t.players.filter(function(p){return!p.vinculadoDe;});}
function _teamAttendancePct(team){
  var sumEntrenos=0,sumFaltas=0;
  _nonLinkedPlayers(team).forEach(function(p){
    var a=calcAtt(team,p.id);
    sumEntrenos+=a.wTeam;
    sumFaltas+=(a.bk['C']||0)+(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['O']||0)+(a.bk['E']||0);
  });
  var denom=sumEntrenos+sumFaltas;
  return denom>0?Math.round(100*sumEntrenos/denom):0;
}
function calcAtt(team,pid){
  const bk={};CODES.forEach(c=>{if(c.c)bk[c.c]=0;});
  let wTeam=0;
  let iExtra=0; // días "I" puestos en un día que el equipo NO entrenó: cuentan para la jugadora, no para el equipo
  // Contar días de entrenamiento marcados por el equipo
  const td=team.trainingDays||{};
  const teamDays=Object.keys(td).filter(k=>td[k]).length;
  Object.entries(team.trainingSessions).forEach(([date,s])=>{
    const v=s[pid];if(v){const cs=String(v||'').split(',').filter(x=>x);let sesiones=0;let hasI=false;cs.forEach(c=>{if(bk[c]!==undefined)bk[c]++;if(c==='D')sesiones+=2;else if(c==='1'||c==='T')sesiones+=1;if(c==='I')hasI=true;});
      if(sesiones>0)wTeam+=sesiones;
      else if(hasI&&!td[date]){wTeam++;iExtra++;} // "I": entrena solo con otro equipo — sube el % de la jugadora, no el del equipo
    }
  });
  const playerDays=teamDays+iExtra;
  const g=team.games.filter(g=>g.players.some(gp=>gp.playerId===pid)).length;
  const pts=team.games.reduce((a,g)=>{const gp=g.players.find(x=>x.playerId===pid);return a+(gp?gp.points:0);},0);
  return{pct:playerDays>0?Math.round(wTeam/playerDays*100):0,wTeam,teamDays,g,pts,bk};
}

        html+=`<tr><td>${p.dorsal}</td><td>${p.name}${p.vinculadoDe?' 🔗':''}</td><td>${a.wTeam}</td><td>${pctInd}%</td><td>${a.bk['I']||0}</td><td>${a.bk['C']||0}</td><td>${a.bk['J']||0}</td><td>${a.bk['B']||0}</td><td>${a.bk['O']||0}</td><td>${a.bk['E']||0}</td><td>${gt.count}</td><td>${tMin}</td><td>${gt.totalPts}</td></tr>`;
      });
      html+='</table>';
    });
  }

  html+=`<div class="footer">BB Baloncesto Badajoz · baloncestobadajoz.es · Informe generado automáticamente<br><img src="${SIGNATURE_IMG}" style="height:26px;opacity:.7;margin-top:4px;"></div>`;
  html+='</body></html>';

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){w.onload=()=>{setTimeout(()=>w.print(),300);};}
  else{const a=document.createElement('a');a.href=url;a.download=`Informe_${type}_${team.name.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.html`;a.click();}
  toast('Informe generado');
}

let _lastSync=0;
function rc(){
  const c=$('#cnt');if(!c)return;c.innerHTML='';
  $$('.tab').forEach(t=>{const id=t.textContent.includes('Inicio')?'home':t.textContent.includes('Plantilla')?'players':t.textContent.includes('Asistencia')?'attendance':t.textContent.includes('Partidos')?'games':'reports';t.classList.toggle('active',S.sub===id||(S.sub==='playerDetail'&&id==='players'));});
  const fn={home:rHome,players:rPlayers,playerDetail:rPlayerDetail,attendance:rAttendance,games:rGames,extragames:rExtraGames,reports:rReports,schedule:rSchedule,help:rHelp};
  (fn[S.sub]||rHome)(c);
  // Fondo más claro en asistencia
  const cnt=$('#cnt');
  if(cnt){if(S.sub==='attendance')cnt.classList.add('att-bg');else cnt.classList.remove('att-bg');}
  // Auto-sync cada 30 segundos al cambiar de pestaña
  const now=Date.now();
  if(now-_lastSync>30000&&!SYNCING&&_pendingSyncOps===0){
    _lastSync=now;
    syncFromCloud().then(ok=>{if(ok)rc();});
  }
}
// También sincronizar cuando la app vuelve al primer plano
// Delegación de eventos para el selector de asistencia: se conecta UNA SOLA VEZ, sobre
// el documento entero, en vez de sobre cada botón cada vez que se reconstruye la pantalla.
// Así, aunque la pantalla se reconstruya por dentro justo entre abrir el selector y tocar
// un código (por una sincronización de fondo, por ejemplo), el toque siempre se procesa.
document.addEventListener('click',function(e){
 try{
  const b=e.target.closest('.code-btn');
  if(!b)return;
  if(!S.selCell)return;
  const tt=T();if(!tt)return;
  const{pid,date}=S.selCell;
  if(!tt.trainingSessions[date])tt.trainingSessions[date]={};
  if(b.dataset.val){
    if(date>ds(new Date())){toast('No se puede poner un código en un día futuro — solo Borrar');return;}
    const existing=String(tt.trainingSessions[date][pid]||'');
    const codes=existing.split(',').filter(x=>x);
    if(b.dataset.val==='1'){
      // "1" (Entrenó) es exclusivo: nunca se combina con ningún otro código
      tt.trainingSessions[date][pid]='1';
    } else if(!codes.includes(b.dataset.val)){
      const sinUno=codes.filter(x=>x!=='1'); // si había un "1" puesto, se quita al añadir otro código
      sinUno.push(b.dataset.val);tt.trainingSessions[date][pid]=sinUno.join(',');
    } else {
      tt.trainingSessions[date][pid]=b.dataset.val;
    }
    const pl=tt.players.find(x=>x.id===pid);
    syncAsistencia(date,tt.id,pid,pl?pl.name:'',pl?pl.dorsal:'',b.dataset.val);
    _propagateDuplicatePlayerTraining(tt,pid,date,b.dataset.val);
  } else {
    delete tt.trainingSessions[date][pid];
    syncAsistencia(date,tt.id,pid,'','','');
  }
  saveDB(DB);
  rc();
 }catch(err){
  console.error('Error marcando asistencia:',err);
  toast('⚠ No se pudo guardar: '+err.message);
 }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.view==='main'&&!SYNCING&&_pendingSyncOps===0){
    syncFromCloud().then(ok=>{if(ok){_lastSync=Date.now();rc();}}).catch(()=>{});
  }
});

function showPM(eid){
  const t=T();const p=eid?t.players.find(x=>x.id===eid):null;
  const bg=el('div','modal-bg active');
  bg.innerHTML=`<div class="modal"><h3>${p?'Editar':'Añadir'} jugador/a</h3>
    <div class="form-group"><label>Nombre</label><input id="mN" value="${p?p.name:''}"></div>
    <div class="form-row"><div class="form-group"><label>Dorsal</label><input id="mD" type="number" value="${p?p.dorsal:''}"></div><div class="form-group"><label>Año nac.</label><input id="mY" type="number" value="${p?p.birthYear:''}"></div></div>
    <div class="form-group"><label>Teléfono</label><input id="mP" value="${p?p.phone||'':''}"></div>
    <div class="form-group"><label>Email</label><input id="mE" value="${p?p.email||'':''}"></div>
    <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary btn-block" id="mS">Guardar</button><button class="btn btn-outline" id="mC">Cancelar</button></div></div>`;
  document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove();};$('#mC',bg).onclick=()=>bg.remove();
  $('#mS',bg).onclick=async()=>{const nm=$('#mN',bg).value.trim();let d=parseInt($('#mD',bg).value);if(!nm||isNaN(d))return toast('Nombre y dorsal obligatorios');
    if(!p&&t.players.some(function(pl){return _normNombre(pl.name)===_normNombre(nm);})){toast('Ya existe una jugadora con ese nombre en este equipo');return;}
    if(!p&&t.players.some(function(pl){return pl.dorsal===d;})){toast('Ya existe una jugadora con ese dorsal');return;}
    let vinculadoDe=null;
    if(!p){
      var otroEquipo=DB.teams.find(function(ot){return ot.id!==t.id&&ot.players.some(function(pl){return _normNombre(pl.name)===_normNombre(nm);});});
      if(otroEquipo){
        var plOrigen=otroEquipo.players.find(function(pl){return _normNombre(pl.name)===_normNombre(nm);});
        var accion=await customTwoChoice(
          '"'+nm+'" ya está dada de alta en el equipo "'+otroEquipo.name+'".\n\nSi de verdad entrena también con este equipo, añádela como vinculada — se guardará con el mismo dorsal que ya tiene (#'+plOrigen.dorsal+'), y no contará para el % de asistencia de este equipo, solo queda registrado que entrenó aquí también.',
          'Cancelar','Añadir como vinculado'
        );
        if(!accion)return;
        d=plOrigen.dorsal;
        if(t.players.some(function(pl){return pl.dorsal===d;})){toast('Ya existe una jugadora con el dorsal #'+d+' en este equipo — no se puede vincular');return;}
        vinculadoDe=otroEquipo.name;
      }
    }

window.handlePhoto=(input,id)=>{

      ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.9);
      const t=T();const p=t.players.find(x=>x.id===id);
      if(p){

        toast('Foto guardada');

          console.log('Respuesta subirFoto:',res);

          } else {

function _propagateDuplicatePlayerTraining(tt,pid,date,code){
  // Si esta jugadora está dada de alta también en OTRO equipo (caso típico: entrenadores
  // que no se coordinan y la apuntan en los dos), y hoy ha entrenado aquí, se le pone
  // automáticamente una "I" (Otro equipo) en su equipo de origen ese mismo día, para que
  // no aparezca como falta sin motivo ni se pisen los datos entre los dos equipos.
  if(!['1','D','T'].includes(code))return;
  const pl=tt.players.find(x=>x.id===pid);
  if(!pl)return;
  const otros=DB.teams.filter(function(ot){return ot.id!==tt.id&&ot.players.some(function(p2){return _normNombre(p2.name)===_normNombre(pl.name);});});
  if(!otros.length)return;
  const todos=[tt].concat(otros);
  const origen=todos.slice().sort(function(a,b){return teamRank(a.name)-teamRank(b.name);})[0];
  if(origen.id===tt.id)return; // este ES el equipo de origen, no hay que tocar nada más
  const p2=origen.players.find(function(p3){return _normNombre(p3.name)===_normNombre(pl.name);});
  if(!p2)return;
  const yaHay=(origen.trainingSessions[date]&&origen.trainingSessions[date][p2.id])||'';
  if(yaHay)return; // si el equipo de origen ya tiene algo puesto ese día, no se pisa
  if(!origen.trainingSessions[date])origen.trainingSessions[date]={};
  origen.trainingSessions[date][p2.id]='I';
  saveDB(DB);
  syncAsistencia(date,origen.id,p2.id,p2.name,p2.dorsal,'I');
}

function _gameFullScore(t,g){
  var pts=g.players.reduce((a,p)=>a+(p.points||0),0);
  if(g.linkedExtra&&g.linkedExtra.length){
    g.linkedExtra.forEach(function(link){
      var ot=DB.teams.find(function(x){return x.id===link.teamId;});
      var eg=ot&&(ot.extraGames||[]).find(function(x){return x.id===link.extraGameId;});
      if(eg)pts+=(eg.points||0);
    });
    return pts;
  }
  // Compatibilidad con partidos guardados antes de que existiera "linkedExtra":
  // se sigue buscando por fecha y rival solo en ese caso, no en los nuevos.
  DB.teams.forEach(function(ot){
    if(ot.id===t.id)return;
    (ot.extraGames||[]).forEach(function(eg){
      if(eg.team===t.name&&normDate(eg.date)===normDate(g.date)&&_normOpp(eg.opponent)===_normOpp(g.opponent)){
        pts+=(eg.points||0);
      }
    });
  });
  return pts;
}

function fmtTime(v){
  if(!v)return'';
  const s=String(v).replace(/[^0-9]/g,'');
  if(s.length<=2)return s+':00';
  return s.slice(0,-2)+':'+s.slice(-2);
}
function parseTime(v){
  if(!v)return 0;
  const s=String(v).replace(/[^0-9]/g,'');
  if(s.length<=2)return parseInt(s)||0;
  const min=parseInt(s.slice(0,-2))||0;
  const sec=parseInt(s.slice(-2))||0;
  return min*60+sec;
}

      if(String(cur).split(',').includes('P')){

    (g.linkedExtra||[]).forEach(function(link){

function normalizeImportDate(s){
  if(typeof s==='number'){
    const d=new Date(Date.UTC(1899,11,30)+Math.round(s)*86400000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  s=String(s||'').trim();if(!s)return'';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s;
}
function processGameRows(rows,bg){
  const t=T();let imp=0;const gm={};
  rows.forEach((p,i)=>{

    if(i===0&&String(p[0]||'').toLowerCase().includes('fecha'))return;
    const date=normalizeImportDate(p[0]),opp=String(p[1]||'').trim(),pn=String(p[2]||'').trim(),min=String(p[3]||'').trim(),pts=p[4];
    if(!date||!opp||!pn)return;
    const k=date+'|'+opp;if(!gm[k])gm[k]={date,opponent:opp,players:[]};
    const pl=t.players.find(x=>_normNombre(x.name)===_normNombre(pn));
    if(pl){gm[k].players.push({playerId:pl.id,minutes:min,points:parseInt(pts)||0});imp++;}
  });
  let omitidos=0;
  Object.values(gm).forEach(g=>{
    const yaExisteG=t.games.find(function(gg){return normDate(gg.date)===normDate(g.date)&&gg.opponent.trim().toLowerCase()===g.opponent.toLowerCase();});
    if(yaExisteG){omitidos++;return;}
    g.id=gid();g.imported=true;t.games.push(g);g.players.forEach(gp=>{if(!t.trainingSessions[g.date])t.trainingSessions[g.date]={};t.trainingSessions[g.date][gp.playerId]='P';});syncGuardarPartido(t.id,g);
  });

  rc();
}
function febNum(v){
  if(v===null||v===undefined||v==='')return 0;
  if(typeof v==='number')return Math.round(v);
  const n=parseInt(String(v).replace(/[^0-9\-]/g,''),10);
  return isNaN(n)?0:n;
}
function febMinStr(v){
  if(v===null||v===undefined||v==='')return'';
  if(typeof v==='number'){
    // Excel time-of-day serial value (fraction of a day)
    const totalSeconds=Math.round(v*86400);
    if(totalSeconds<=0)return'00:00';
    const m=Math.floor(totalSeconds/60),s=totalSeconds%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,3}):(\d{2})/);
  if(m)return m[1].padStart(2,'0')+':'+m[2];
  m=s.match(/T(\d{2}):(\d{2})/); // garbled ISO datetime fallback
  if(m)return m[1]+':'+m[2];
  m=s.match(/(\d{1,3})[.:](\d{2})\s*$/);
  if(m)return m[1].padStart(2,'0')+':'+m[2];
  return s;
}
function febFrac(v){
  const s=String(v||'').trim();
  const m=s.match(/^(\d+)\s*\/\s*(\d+)/);
  if(m)return{m:parseInt(m[1])||0,a:parseInt(m[2])||0};
  return{m:0,a:0};
}
function parseFebBoxScore(rows){
  let rivalName=null,ourName=null;
  for(const r of rows){
    const cell=String(r[0]||'');
    if(/estad[ií]sticas/i.test(cell)&&/\bvs\b/i.test(cell)){
      const m=cell.match(/estad[ií]sticas\s*-\s*(.+?)\s+vs\s+(.+?)\s*-/i);
      if(m){
        const teamA=m[1].trim(),teamB=m[2].trim();
        if(/badajoz/i.test(teamA)){ourName=teamA;rivalName=teamB;}
        else{ourName=teamB;rivalName=teamA;}
      }
      break;
    }
  }
  const headerIdxs=[];
  rows.forEach(function(r,i){if(r.some(function(v){return String(v).trim()==='Num.';}))headerIdxs.push(i);});
  if(!headerIdxs.length)return null;
  const blocks=[];
  headerIdxs.forEach(function(hIdx){
    let teamName='';
    for(let k=hIdx-1;k>=Math.max(0,hIdx-4);k--){
      const v=String((rows[k]||[])[0]||'').trim();
      if(v&&v.toUpperCase()!=='TOTALES'&&!/^tc\b|^tl$|^rebotes|^tap|^fal/i.test(v)){teamName=v;break;}
    }
    const players=[];let teamPts=0;
    for(let i=hIdx+1;i<rows.length;i++){
      const row=rows[i]||[];
      const c0=String(row[0]||'').trim(),c1=String(row[1]||'').trim();
      if(c1.toUpperCase()==='TOTALES'){teamPts=febNum(row[3]);break;}
      if(!c0&&!c1){if(players.length)break;else continue;}
      const dorsal=parseInt(c0);if(isNaN(dorsal))continue;
      const p2=febFrac(row[4]),p3=febFrac(row[6]),p1=febFrac(row[8]);
      players.push({
        dorsal:dorsal,name:c1,minutes:febMinStr(row[2]),points:febNum(row[3]),
        stats:{p2m:p2.m,p2a:p2.a,p3m:p3.m,p3a:p3.a,p1m:p1.m,p1a:p1.a,
          reb:febNum(row[12]),ast:febNum(row[13]),stl:febNum(row[14]),blk:febNum(row[16])}
      });
    }
    blocks.push({teamName:teamName,players:players,teamPts:teamPts});
  });
  if(blocks.length<2)return null;
  let ourBlock=blocks.find(function(b){return /badajoz/i.test(b.teamName);});
  let rivalBlock=blocks.find(function(b){return b!==ourBlock;});
  if(!ourBlock){ourBlock=blocks[0];rivalBlock=blocks[1];}
  return{
    rival:rivalName||(rivalBlock?rivalBlock.teamName:'')||'Rival',
    rivalPoints:rivalBlock?rivalBlock.teamPts:0,
    ourPlayers:ourBlock.players
  };
}

function _normTeamKey(s){

  '1ªNacionalMasculina':['DiputaciónMasculina','JuniorMasculinoNegro','JuniorMasculinoBlanco'],
  'DiputaciónMasculina':['1ªNacionalMasculina','JuniorMasculinoNegro','JuniorMasculinoBlanco'],
  'JuniorMasculinoNegro':['CadeteMasculinoNegro','CadeteMasculinoBlanco'],
  'JuniorMasculinoBlanco':['CadeteMasculinoNegro','CadeteMasculinoBlanco'],
  'CadeteMasculinoNegro':['InfantilMasculinoNegro','InfantilMasculinoBlanco'],
  'CadeteMasculinoBlanco':['InfantilMasculinoNegro','InfantilMasculinoBlanco'],
  'InfantilMasculinoNegro':['MiniMasculinoNegro','MiniMasculinoBlanco','Benjamin'],
  'InfantilMasculinoBlanco':['MiniMasculinoNegro','MiniMasculinoBlanco'],
  'MiniMasculinoNegro':['MiniMasculinoBlanco','Benjamin'],
  'MiniMasculinoBlanco':['Benjamin'],
  '1ªNacionalFemenina':['DiputaciónFemenina','JuniorFemenino'],
  'DiputaciónFemenina':['1ªNacionalFemenina','JuniorFemenino'],
  'JuniorFemenino':['CadeteFemeninoNegro','CadeteFemeninoBlanco','CadeteFemeninoAzul'],
  'CadeteFemeninoNegro':['InfantilFemeninoNegro','InfantilFemeninoBlanco'],
  'CadeteFemeninoBlanco':['InfantilFemeninoNegro','InfantilFemeninoBlanco'],
  'CadeteFemeninoAzul':['InfantilFemeninoNegro','InfantilFemeninoBlanco'],
  'InfantilFemeninoNegro':['MiniFemeninoNegro','Benjamin'],
  'InfantilFemeninoBlanco':['MiniFemeninoNegro','Benjamin'],
  'MiniFemeninoNegro':['Benjamin'],
};
const TEAM_HIERARCHY={};
Object.keys(TEAM_HIERARCHY_RAW).forEach(function(k){
  TEAM_HIERARCHY[_normTeamKey(k)]=TEAM_HIERARCHY_RAW[k].map(_normTeamKey);
});
// Dado un equipo real (objeto de DB.teams), devuelve la lista de equipos reales (objetos)
// de los que se puede "abastecer" según la jerarquía del club.
function _getFeederTeams(t){
  var key=_normTeamKey(t.name);
  var feederKeys=TEAM_HIERARCHY[key];
  if(!feederKeys)return [];
  return DB.teams.filter(function(ot){
    if(ot.id===t.id)return false;
    return feederKeys.indexOf(_normTeamKey(ot.name))>=0;
  });
}
function _normNombre(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(',',' ').trim();
}
function matchFebPlayer(t,febp){
  // IMPORTANTE: el "Num." del acta de la Federación es un dorsal propio de esa
  // competición/temporada, NO el dorsal que usa el club en la app — pueden coincidir
  // por pura casualidad y corresponder a una persona totalmente distinta. Por eso aquí
  // NUNCA se compara por dorsal, solo por nombre.
  return matchByNameOnly(t,febp.name);
}
function matchByNameOnly(t,name){
  const tokens=_normNombre(name).split(/\s+/).filter(Boolean);
  return t.players.find(function(x){
    const nt=_normNombre(x.name).split(/\s+/).filter(Boolean);
    return tokens.every(function(tok){return nt.indexOf(tok)>=0;})||nt.every(function(tok){return tokens.indexOf(tok)>=0;});
  })||null;
}
function matchByExactNameOnly(t,name){
  // Igual que matchByNameOnly pero exige el MISMO número de palabras y que sean las mismas,
  // ni una de más ni de menos. Necesario para casos como padre e hijo con el mismo nombre
  // ("Manuel Cores" / "Manuel Cores Jr"): uno no puede confundirse con el otro solo porque
  // uno de los nombres esté "contenido" dentro del otro.
  const tokens=_normNombre(name).split(/\s+/).filter(Boolean).sort();
  return t.players.find(function(x){
    const nt=_normNombre(x.name).split(/\s+/).filter(Boolean).sort();
    return nt.length===tokens.length&&nt.every(function(tok,i){return tok===tokens[i];});
  })||null;
}
function showFebImportConfirm(feb,bg){
  const t=T();
  const matched=feb.ourPlayers.map(function(fp){return{fp:fp,pl:matchFebPlayer(t,fp)};});
  const found=matched.filter(function(m){return m.pl;});
  const notFound=matched.filter(function(m){return!m.pl;});
  const feederTeams=_getFeederTeams(t).sort(function(a,b){return teamRank(a.name)-teamRank(b.name)||a.name.localeCompare(b.name);});

  function notFoundRowHTML(m,idx){
    var teamOpts='<option value="">— Sin asignar (no se importa) —</option>'+feederTeams.map(function(ft){return'<option value="'+ft.id+'">'+ft.name+'</option>';}).join('');
    return '<div class="card" style="margin-bottom:8px;padding:10px;" data-notfound="'+idx+'">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12px;font-weight:600;">'+m.fp.name+'</span><span style="font-size:11px;color:var(--text3);">'+fmtTime(m.fp.minutes)+' · '+m.fp.points+' pts</span></div>'+
      '<select class="nfTeam" data-idx="'+idx+'" style="width:100%;margin-bottom:6px;">'+teamOpts+'</select>'+
      '<select class="nfPlayer" data-idx="'+idx+'" style="width:100%;display:none;"></select>'+
      '</div>';
  }

  $('#iPrev',bg).innerHTML=`
    <div class="form-group"><label>Rival</label><input id="febRival" value="${feb.rival}"></div>
    <div class="form-group"><label style="color:var(--gold);">📅 Fecha en que se jugó el partido (elige la fecha real — puede no ser hoy)</label><input id="febDate" type="date"></div>
    <div class="form-group"><label>Puntos del rival</label><input id="febRivalPts" type="number" value="${feb.rivalPoints||0}"></div>
    <div style="font-size:11px;color:var(--text2);margin:8px 0 4px;">${found.length} jugadoras reconocidas de la plantilla:</div>
    ${found.map(function(m){const th=m.pl.photo?'<img src="'+m.pl.photo+'" style="width:20px;height:20px;border-radius:50%;object-fit:cover;margin-right:6px;vertical-align:middle;">':'<span class="avatar" style="width:20px;height:20px;font-size:9px;margin-right:6px;display:inline-flex;">'+ini(m.pl.name)+'</span>';return'<div class="report-row"><span class="rlbl">'+th+'#'+m.pl.dorsal+' '+m.pl.name+'</span><span class="rval">'+fmtTime(m.fp.minutes)+' · '+m.fp.points+' pts</span></div>';}).join('')}
    ${notFound.length?'<div style="font-size:11px;color:var(--gold);margin:12px 0 6px;">'+notFound.length+' jugador(a/es) del acta no está(n) en esta plantilla — di a qué equipo pertenece cada uno (solo se muestran equipos de categoría inferior de este mismo club y sección, según el organigrama):</div>'+notFound.map(function(m,i){return notFoundRowHTML(m,i);}).join(''):''}
    ${!feederTeams.length&&notFound.length?'<div style="font-size:10px;color:var(--text3);">Este equipo no tiene categorías inferiores registradas de las que pueda "abastecerse" — si esto no es correcto, revisa el nombre exacto del equipo.</div>':''}
    <button class="btn btn-primary btn-block" style="margin-top:10px;" id="febConfirm">Importar este partido</button>`;

  bg.querySelectorAll('.nfTeam').forEach(function(sel){
    sel.onchange=function(){
      var idx=sel.getAttribute('data-idx');
      var playerSel=bg.querySelector('.nfPlayer[data-idx="'+idx+'"]');
      var teamId=sel.value;
      if(!teamId){playerSel.style.display='none';playerSel.innerHTML='';return;}
      var team=feederTeams.find(function(ft){return ft.id===teamId;});
      var m=notFound[parseInt(idx)];
      var suggestion=matchByNameOnly(team,m.fp.name);
      var opts=team.players.slice().sort(function(a,b){return a.dorsal-b.dorsal;}).map(function(p){
        return '<option value="'+p.id+'"'+(suggestion&&suggestion.id===p.id?' selected':'')+'>#'+p.dorsal+' '+p.name+'</option>';
      }).join('');
      playerSel.innerHTML='<option value="">— Elige jugadora —</option>'+opts;
      playerSel.style.display='block';
    };
  });

  $('#febConfirm',bg).onclick=async function(){
    const date=$('#febDate',bg).value,opp=$('#febRival',bg).value.trim();
    if(!date){toast('Elige la fecha en que se jugó el partido');return;}
    if(!opp){toast('Rival obligatorio');return;}
    const yaExiste=t.games.find(function(gg){return normDate(gg.date)===normDate(date)&&gg.opponent.trim().toLowerCase()===opp.toLowerCase();});
    if(yaExiste){
      await customAlert('Ya existe un partido contra "'+opp+'" el '+normDate(date)+' en este equipo.\n\nSi quieres volver a importarlo, primero borra el partido existente en la pestaña Partidos (y sus Partidos Adicionales relacionados en otros equipos, si los hubiera), y después vuelve a importar el Excel.');
      return;
    }
    // Recoger las asignaciones manuales de los "no reconocidos"
    const asignados=[];
    const incompletos=[];
    bg.querySelectorAll('.nfTeam').forEach(function(sel){
      var idx=parseInt(sel.getAttribute('data-idx'));
      var teamId=sel.value;
      if(!teamId)return;
      var playerSel=bg.querySelector('.nfPlayer[data-idx="'+idx+'"]');
      var playerId=playerSel?playerSel.value:'';
      if(!playerId){incompletos.push(notFound[idx].fp.name);return;}
      var team=feederTeams.find(function(ft){return ft.id===teamId;});
      var pl=team.players.find(function(p){return p.id===playerId;});
      if(team&&pl)asignados.push({fp:notFound[idx].fp,pl:pl,team:team});
    });
    if(incompletos.length){
      await customAlert('Has elegido equipo pero no jugadora para: '+incompletos.join(', ')+'.\n\nElige la jugadora concreta en el segundo desplegable (o deja el equipo sin elegir si no quieres importarla) antes de continuar.');
      return;
    }
    const btn=$('#febConfirm',bg);btn.disabled=true;btn.textContent='Importando...';
    const rivPts=parseInt($('#febRivalPts',bg).value)||0;
    const players=found.map(function(m){return{playerId:m.pl.id,minutes:m.fp.minutes,points:m.fp.points,stats:m.fp.stats};});
    const g={id:gid(),date:date,opponent:opp,players:players,rivalPoints:rivPts,linkedExtra:[],imported:true};
    t.games.push(g);
    if(!t.trainingSessions[date])t.trainingSessions[date]={};
    const propioBulk=[];
    players.forEach(function(gp){
      t.trainingSessions[date][gp.playerId]='P';
      const pl=t.players.find(x=>x.id===gp.playerId);
      propioBulk.push({fecha:date,equipoId:t.id,jugadorId:gp.playerId,nombre:pl?pl.name:'',dorsal:pl?pl.dorsal:'',incidencia:'P'});
    });
    // Partidos adicionales para quienes se han asignado manualmente a otro equipo del club:
    // se crea el partido adicional (con minutos/puntos) Y se marca "P" (jugó partido) en el
    // calendario de SU equipo real — es un partido, no un entreno normal. El día de la semana
    // de ese equipo NO se pinta naranja por esto: el naranja depende solo de que el equipo
    // tenga su propio partido registrado en Partidos, no de las casillas de cada jugadora.
    // IMPORTANTE: el partido guarda en "linkedExtra" el ID exacto de cada uno de estos partidos
    // adicionales — así, al editar o borrar este partido más adelante, se sabe con total
    // seguridad a quién tocar, sin tener que volver a buscar "quién coincide en fecha y rival"
    // (esa búsqueda genérica era la que arrastraba datos viejos sin relación real).
    for(const m of asignados){
      const eg=_upsertExtraGame(m.team,m.pl.id,date,opp,m.fp.minutes,m.fp.points,t.name);
      g.linkedExtra.push({teamId:m.team.id,extraGameId:eg.id});
      const yaHaviaCodigo=(m.team.trainingSessions[date]&&m.team.trainingSessions[date][m.pl.id])||'';
      if(!yaHaviaCodigo){
        if(!m.team.trainingSessions[date])m.team.trainingSessions[date]={};
        m.team.trainingSessions[date][m.pl.id]='P';
        saveDB(DB);
        const rAsis=await syncAsistencia(date,m.team.id,m.pl.id,m.pl.name,m.pl.dorsal,'P');
        m._asistenciaOk=!!(rAsis&&rAsis.ok);
      } else { m._asistenciaOk=true; }
      const rExtra=await syncGuardarPartidoExtra(m.team.id,eg);
      m._extraOk=!!(rExtra&&rExtra.ok);
    }
    saveDB(DB);
    const rGame=await syncGuardarPartido(t.id,g);
    const rBulk=propioBulk.length?await syncAsistenciaBulk(t.id,propioBulk):{ok:true};
    // Se confía en lo que cada guardado ha respondido, sin volver a descargar todos los
    // datos del club para comprobarlo (eso añadía varios segundos de espera de más). Si algo
    // no ha ido bien, se avisa aquí en vez de fallar en silencio.
    let faltan=[];
    let faltanAsignados=[];
    if(!(rGame&&rGame.ok)){faltan.push({nombre:'el partido en sí ('+t.name+')'});}
    if(!(rBulk&&rBulk.ok)){propioBulk.forEach(function(r){faltan.push(r);});}
    asignados.forEach(function(m){if(!m._asistenciaOk||!m._extraOk)faltanAsignados.push(m);});
    btn.disabled=false;
    const sinAsignar=notFound.length-asignados.length;
    const nombresFaltan=faltan.map(function(r){return r.nombre;}).concat(faltanAsignados.map(function(m){return m.pl.name+' ('+m.team.name+')';})).join(', ');
    const huboFallo=faltan.length||faltanAsignados.length;
    $('#iPrev',bg).innerHTML=huboFallo?
      '<div style="color:var(--red);font-weight:600;font-size:12px;">⚠ Partido importado, pero la nube no confirmó guardar correctamente: '+nombresFaltan+'. Revisa a mano (Asistencia o Partidos Adicionales según corresponda).</div>':
      '<div style="color:var(--green);font-weight:600;font-size:12px;">✓ Partido importado y confirmado en la nube ('+players.length+' jugadoras'+(asignados.length?' + '+asignados.length+' partido(s) adicional(es) en otros equipos':'')+(sinAsignar?'. '+sinAsignar+' jugador(a/es) del acta se quedaron sin asignar y no se importaron':'')+').</div>';
    rc();
  };
}
function showImp(){
  const bg=el('div','modal-bg active');
  bg.innerHTML=`<div class="modal"><h3>Importar partidos</h3><p style="font-size:11px;color:var(--text2);margin-bottom:12px;">Sube directamente el Excel de estadísticas de la Federación (FEXB/FEB), o un CSV/Excel propio con columnas Fecha, Rival, Jugador, Minutos, Puntos (una fila por jugadora y partido).</p>
    <div class="import-zone" id="iz">Pulsa para seleccionar archivo<input type="file" accept=".csv,.txt,.xlsx,.xls" style="display:none;" id="csvI"></div>
    <div id="iPrev" style="margin-top:10px;"></div>
    <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="this.closest('.modal-bg').remove()">Cerrar</button></div>`;
  document.body.appendChild(bg);$('#iz',bg).onclick=()=>$('#csvI',bg).click();
  $('#csvI',bg).onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      $('#iPrev',bg).innerHTML='<span style="color:var(--accent);">Procesando Excel...</span>';
      const r=new FileReader();
      r.onload=ev=>{
        const proceed=()=>{
          try{
            const wb=XLSX.read(ev.target.result,{type:'array'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
            const feb=parseFebBoxScore(rows);
            if(feb&&feb.ourPlayers.length){showFebImportConfirm(feb,bg);}
            else{processGameRows(rows,bg);}
          }catch(err){$('#iPrev',bg).innerHTML='<span style="color:var(--red);">Error leyendo el Excel: '+err.message+'</span>';}
        };
        if(typeof XLSX==='undefined'){
          const script=document.createElement('script');
          script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          script.onload=proceed;
          script.onerror=()=>{$('#iPrev',bg).innerHTML='<span style="color:var(--red);">Error cargando la librería de Excel. Prueba con CSV.</span>';};
          document.head.appendChild(script);
        } else proceed();
      };
      r.readAsArrayBuffer(f);
    } else {
      const r=new FileReader();
      r.onload=ev=>{
        const lines=String(ev.target.result).split('\n').map(l=>l.trim()).filter(l=>l);
        const rows=lines.map(l=>l.split(/[,;\t]/).map(s=>s.trim()));
        processGameRows(rows,bg);
      };
      r.readAsText(f);
    }
  };
}

window.delEG=async id=>{
  if(!(await customConfirm('¿Eliminar?')))return;
  const t=T();
  const eg=t.extraGames.find(g=>g.id===id);
  t.extraGames=t.extraGames.filter(g=>g.id!==id);
  saveDB(DB);rc();toast('Eliminado');
  syncEliminarPartidoExtra(id);
  if(eg){
    const date=normDate(eg.date);
    const cur=(t.trainingSessions[date]&&t.trainingSessions[date][eg.playerId])||'';
    if(cur==='P'){
      delete t.trainingSessions[date][eg.playerId];
      saveDB(DB);
      const pl=t.players.find(x=>x.id===eg.playerId);
      syncAsistencia(date,t.id,eg.playerId,pl?pl.name:'',pl?pl.dorsal:'','');
    }
  }
};

function _groupCodesByPeriod(t,playerId,mode){
  var groups={};
  Object.keys(t.trainingSessions||{}).forEach(function(dateStr){
    if(dateStr.indexOf('-')<0)return;
    var sess=t.trainingSessions[dateStr];
    var v=sess[playerId];
    if(!v)return;
    var codes=String(v).split(',').filter(function(x){return x;});
    var dateObj=new Date(dateStr+'T00:00:00');
    if(isNaN(dateObj.getTime()))return;
    var key,sortKey,label;
    if(mode==='month'){
      sortKey=dateObj.getFullYear()*100+(dateObj.getMonth()+1);
      label=dateObj.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
      key=String(sortKey);
    } else {
      var day=dateObj.getDay();
      var diff=(day===0?-6:1-day);
      var monday=new Date(dateObj);monday.setDate(dateObj.getDate()+diff);
      var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
      sortKey=monday.getTime();
      label=monday.getDate()+'/'+(monday.getMonth()+1)+' - '+sunday.getDate()+'/'+(sunday.getMonth()+1);
      key=String(sortKey);
    }
    if(!groups[key])groups[key]={label:label,sortKey:sortKey,codes:{}};
    codes.forEach(function(cd){groups[key].codes[cd]=(groups[key].codes[cd]||0)+1;});
  });
  return Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return a.sortKey-b.sortKey;});
}

function _renderPeriodTable(periods,title){
  if(!periods.length)return '';
  var h='<div style="font-weight:600;font-size:10px;margin:8px 0 4px;color:var(--text2);text-transform:uppercase;">'+title+'</div>';
  periods.forEach(function(p){
    var codesStr=Object.keys(p.codes).map(function(cd){return cd+':'+p.codes[cd];}).join('  ');
    h+='<div class="report-row"><span class="rlbl" style="text-transform:capitalize;">'+p.label+'</span><span class="rval">'+(codesStr||'-')+'</span></div>';
  });
  return h;
}

function _playerGameTotals(t,p){
  var pGames=t.games.filter(function(g){return g.players.some(function(gp){return gp.playerId===p.id;});});
  var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;});
  var totalSec=0,totalPts=0;
  pGames.forEach(function(g){
    var gp=g.players.find(function(x){return x.playerId===p.id;});
    totalSec+=parseTime(gp.minutes);totalPts+=(gp.points||0);
  });
  eg.forEach(function(g){totalSec+=parseTime(g.minutes);totalPts+=(g.points||0);});
  return{count:pGames.length+eg.length,totalSec:totalSec,totalPts:totalPts};
}
function _playerExtraStatsTotals(t,p){
  var tot={p2m:0,p2a:0,p3m:0,p3a:0,p1m:0,p1a:0,reb:0,ast:0,stl:0,blk:0};
  t.games.forEach(function(g){
    var gp=g.players.find(function(x){return x.playerId===p.id;});
    if(gp&&gp.stats){
      Object.keys(tot).forEach(function(k){tot[k]+=(gp.stats[k]||0);});
    }
  });
  return tot;
}

function _playerSummaryGrid(t,p){
  var a=calcAtt(t,p.id);
  var gt=_playerGameTotals(t,p);
  var noEntrena=Math.max(a.teamDays-a.wTeam,0);
  var justCount=(a.bk['J']||0)+(a.bk['B']||0)+(a.bk['E']||0);
  var denomAjust=a.teamDays-justCount;
  var pctEquipo=denomAjust>0?Math.round(a.wTeam/denomAjust*100):0;
  var tMin=Math.floor(gt.totalSec/60),tSec=gt.totalSec%60;
  var rows=[
    ['Entrenos totales',a.teamDays],
    ['Entrenos con equipo',a.wTeam],
    ['No entrena',noEntrena],
    ['% asistencia (jugador)',a.pct+'%'],
    ['% asistencia (con equipo)*',pctEquipo+'%'],
    ['Partidos',gt.count],
    ['Minutos jugados',tMin+':'+String(tSec).padStart(2,'0')],
    ['Puntos anotados',gt.totalPts],
    ['Dobla con otro equipo (D)',a.bk['D']||0],
    ['Entrena con otro equipo (I)',a.bk['I']||0],
    ['Tecnificación (T/t)',(a.bk['T']||0)+(a.bk['t']||0)],
    ['Falta justificada (J)',a.bk['J']||0],
    ['Enfermedad (E)',a.bk['E']||0],
    ['Lesión / baja (B)',a.bk['B']||0],
    ['Falta por clase (C)',a.bk['C']||0],
    ['No avisó (O)',a.bk['O']||0]
  ];
  var h='<div style="font-weight:600;font-size:10px;margin:8px 0 4px;color:var(--text2);text-transform:uppercase;">Resumen total</div>';
  rows.forEach(function(r){
    h+='<div class="report-row"><span class="rlbl">'+r[0]+'</span><span class="rval">'+r[1]+'</span></div>';
  });
  h+='<div style="font-size:9px;color:var(--text3);margin-top:4px;">* Excluye lesión, enfermedad y faltas justificadas del cálculo</div>';
  return h;
}

function _playerGamesBlock(t,p,showTitle){
  var pGames=t.games.filter(function(g){return g.players.some(function(gp){return gp.playerId===p.id;});});
  var eg=(t.extraGames||[]).filter(function(g){return g.playerId===p.id;});
  var totalSec=0,totalPts=0;
  var h=showTitle?'<div style="font-weight:600;font-size:10px;margin:8px 0 4px;color:var(--text2);text-transform:uppercase;">Partidos ('+(pGames.length+eg.length)+')</div>':'';
  pGames.forEach(function(g){
    var gp=g.players.find(function(x){return x.playerId===p.id;});
    var secs=parseTime(gp.minutes);
    totalSec+=secs;totalPts+=(gp.points||0);
    h+='<div class="report-row"><span class="rlbl">'+normDate(g.date)+' vs '+g.opponent+'</span><span class="rval">'+fmtTime(gp.minutes)+' - '+(gp.points||0)+' pts</span></div>';
  });
  eg.forEach(function(g){
    var secs=parseTime(g.minutes);
    totalSec+=secs;totalPts+=(g.points||0);
    h+='<div class="report-row"><span class="rlbl">'+normDate(g.date)+' vs '+g.opponent+' ('+(g.team||'otro')+')</span><span class="rval">'+fmtTime(g.minutes)+' - '+(g.points||0)+' pts</span></div>';
  });
  var tMin=Math.floor(totalSec/60),tSec=totalSec%60;
  h+='<div class="report-row" style="border-top:1px solid var(--accent);margin-top:4px;padding-top:6px;"><span class="rlbl" style="font-weight:700;">TOTAL</span><span class="rval" style="color:var(--accent);">'+tMin+':'+String(tSec).padStart(2,'0')+' - '+totalPts+' pts</span></div>';
  var es=_playerExtraStatsTotals(t,p);
  if(es.p2a+es.p3a+es.p1a+es.reb+es.stl+es.blk>0){
    var p2pct=es.p2a?Math.round(es.p2m/es.p2a*100):0,p3pct=es.p3a?Math.round(es.p3m/es.p3a*100):0,p1pct=es.p1a?Math.round(es.p1m/es.p1a*100):0;
    h+='<div style="font-size:9px;color:var(--text3);margin-top:4px;line-height:1.6;">'+
      'T2: '+es.p2m+'/'+es.p2a+' ('+p2pct+'%) &nbsp; T3: '+es.p3m+'/'+es.p3a+' ('+p3pct+'%) &nbsp; TL: '+es.p1m+'/'+es.p1a+' ('+p1pct+'%)<br>'+
      'Rebotes: '+es.reb+' &nbsp; Recuperaciones: '+es.stl+' &nbsp; Tapones: '+es.blk+
      '</div>';
  }
  return h;
}

function showRosterImportConfirm(filas){
  const t=T();
  const matched=[]; // {fila, pl}
  const nuevos=[]; // {fila, otroEquipo?, plOtro?}
  filas.forEach(function(fila){
    const pl=matchByNameOnly(t,fila.name);
    if(pl){matched.push({fila:fila,pl:pl});return;}
    // No está en este equipo — comprobar si ya pertenece a otro (para ofrecer "vinculado"
    // en vez de tratarlo como una persona totalmente nueva pidiendo dorsal a mano).
    var otroEquipo=null,plOtro=null;
    DB.teams.forEach(function(ot){
      if(ot.id===t.id||plOtro)return;
      var cand=matchByNameOnly(ot,fila.name);
      if(cand){otroEquipo=ot;plOtro=cand;}
    });
    nuevos.push({fila:fila,otroEquipo:otroEquipo,plOtro:plOtro});
  });
  const matchedPlIds=matched.map(function(m){return m.pl.id;});
  const noEnDocumento=t.players.filter(function(p){return matchedPlIds.indexOf(p.id)<0;});

  // Filas combinadas para la tabla de dos columnas: Plantilla | Documento de la Federación,
  // emparejadas cuando coinciden, y con un lado en blanco cuando solo está en uno de los dos.
  const filasTabla=[];
  matched.forEach(function(m,i){filasTabla.push({tipo:'match',idx:i,pl:m.pl,fila:m.fila});});
  nuevos.forEach(function(f,i){filasTabla.push({tipo:'nuevo',idx:i,fila:f.fila,otroEquipo:f.otroEquipo,plOtro:f.plOtro});});
  noEnDocumento.forEach(function(p){filasTabla.push({tipo:'falta',pl:p});});
  filasTabla.sort(function(a,b){
    var na=(a.pl?a.pl.name:a.fila.name),nb=(b.pl?b.pl.name:b.fila.name);
    return na.localeCompare(nb);
  });

  const bg=el('div','modal-bg active');
  function diffRow(label,oldV,newV){
    if(!newV||String(oldV||'')===String(newV))return'';
    return '<div style="font-size:9px;color:var(--text3);">'+label+': <span style="text-decoration:line-through;">'+(oldV||'—')+'</span>→<span style="color:var(--green);font-weight:600;">'+newV+'</span></div>';
  }
  let html='<div class="modal"><h3>Importar plantilla</h3>';
  html+='<div style="font-size:10px;color:var(--text3);margin-bottom:10px;">Comparación de '+t.name+' — plantilla actual a la izquierda, documento de la Federación a la derecha. Revisa y desmarca lo que no quieras aplicar.</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px;"><div>Plantilla</div><div>Documento Federación</div></div>';

  filasTabla.forEach(function(r){
    if(r.tipo==='match'){
      const diffs=diffRow('Nac.',r.pl.birthYear,r.fila.birthYear)+diffRow('Tel.',r.pl.phone,r.fila.phone)+diffRow('Email',r.pl.email,r.fila.email);
      html+='<label style="display:grid;grid-template-columns:16px 1fr 1fr;gap:4px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);">'+
        '<input type="checkbox" class="riMatch" data-idx="'+r.idx+'" checked style="margin-top:3px;">'+
        '<span style="font-size:11px;">#'+r.pl.dorsal+' '+r.pl.name+'</span>'+
        '<span style="font-size:11px;color:var(--green);">✓ '+r.fila.name+(diffs?'<br>'+diffs:'')+'</span>'+
      '</label>';
    } else if(r.tipo==='nuevo'){
      if(r.otroEquipo){
        html+='<div style="display:grid;grid-template-columns:16px 1fr 1fr;gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);">'+
          '<input type="checkbox" class="riVinculado" data-idx="'+r.idx+'" checked>'+
          '<span style="font-size:10px;color:var(--text3);">— no está —</span>'+
          '<span style="font-size:11px;color:var(--gold);">'+r.fila.name+'<br><span style="font-size:9px;color:var(--text3);">Vinculada de '+r.otroEquipo.name+' — dorsal #'+r.plOtro.dorsal+' (el suyo real)</span></span>'+
        '</div>';

          '<input type="checkbox" class="riNew" data-idx="'+r.idx+'" checked>'+
          '<span style="font-size:10px;color:var(--text3);">— no está —</span>'+
          '<span style="font-size:11px;color:var(--gold);">'+r.fila.name+
            (noEnDocumento.length?'<select class="riManualMatch" data-idx="'+r.idx+'" style="width:100%;margin-top:3px;font-size:10px;padding:3px;">'+opcionesFalta+'</select>':'')+

        '</div>';
      }

      html+='<div style="display:grid;grid-template-columns:16px 1fr 1fr;gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);">'+

      '</div>';
    }

  document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg)bg.remove();};
  bg.querySelector('#riCancel').onclick=function(){bg.remove();};

  bg.querySelectorAll('[data-riremove]').forEach(function(btn){
